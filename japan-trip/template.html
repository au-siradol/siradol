<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Japan 2569 Itinerary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Thai: Sukhumvit Set (installed locally; IBM Plex Sans Thai is the web fallback). Latin: Geist Mono. */
@font-face{font-family:'Sukhumvit Set';font-weight:400;src:local('Sukhumvit Set'),local('SukhumvitSet-Text'),local('Sukhumvit Set Text')}
@font-face{font-family:'Sukhumvit Set';font-weight:500;src:local('Sukhumvit Set Medium'),local('SukhumvitSet-Medium')}
@font-face{font-family:'Sukhumvit Set';font-weight:600;src:local('Sukhumvit Set SemiBold'),local('SukhumvitSet-SemiBold')}
@font-face{font-family:'Sukhumvit Set';font-weight:700;src:local('Sukhumvit Set Bold'),local('SukhumvitSet-Bold')}
:root{
  --bg:#f3f3f1; --grid:rgba(17,17,17,.05); --paper:#ffffff; --ink:#111318; --mute:#5b6070; --rule:#cfd2d8; --rule2:#e6e8ec;
  --accent:#2f4058; --accent-ink:#ffffff; --accent-soft:#e6ecf5;
  --err:#b3261e; --err-soft:#f9dfdc; --warn:#8a5a00; --warn-soft:#fbecc8; --info:#3a5a9b; --info-soft:#dde6f6;
  --nap:#e6daf2; --move:#9aa5bd; --eat:#e0954f; --see:#3fae92; --stay:#6d7aa6;
  --m-land:#f7f9f9; --m-sea:#bfe6f6; --m-water:#34b0e8; --m-forest:#6cc98b; --m-forest2:#9ad9b0; --m-tree:#33b89b;
  --m-peak:#e1e8eb; --m-peak-s:#9eb0b8; --m-ink:#2f4058; --m-lbl:#7b8a97; --m-sea-lbl:#3f8db6;
  --font:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Sukhumvit Set','Sukhumvit','IBM Plex Sans Thai','Noto Sans Thai',sans-serif;
  --font-m:var(--font);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --grid:rgba(255,255,255,.045); --paper:#171b24; --ink:#e8ebf2; --mute:#9aa3b8; --rule:#343b4c; --rule2:#272d3b;
  --accent:#8fb4e8; --accent-ink:#0b1220; --accent-soft:#1f2a3d;
  --err:#ff8a80; --err-soft:#3b1f1d; --warn:#f2c36b; --warn-soft:#362b14; --info:#8fb1f0; --info-soft:#1d2a45;
  --nap:#35284a; --move:#69729a; --eat:#c27a3a; --see:#3f8c82; --stay:#8a86c2;
  --m-land:#1c222d; --m-sea:#173449; --m-water:#2f86b8; --m-forest:#3f8a63; --m-forest2:#2f6b4d; --m-tree:#2f9a84;
  --m-peak:#2c3646; --m-peak-s:#4a566b; --m-ink:#e8ebf2; --m-lbl:#7c8798; --m-sea-lbl:#5c93b5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --grid:rgba(255,255,255,.045); --paper:#171b24; --ink:#e8ebf2; --mute:#9aa3b8; --rule:#343b4c; --rule2:#272d3b;
  --accent:#8fb4e8; --accent-ink:#0b1220; --accent-soft:#1f2a3d;
  --err:#ff8a80; --err-soft:#3b1f1d; --warn:#f2c36b; --warn-soft:#362b14; --info:#8fb1f0; --info-soft:#1d2a45;
  --nap:#35284a; --move:#69729a; --eat:#c27a3a; --see:#3f8c82; --stay:#8a86c2;
  --m-land:#1c222d; --m-sea:#173449; --m-water:#2f86b8; --m-forest:#3f8a63; --m-forest2:#2f6b4d; --m-tree:#2f9a84;
  --m-peak:#2c3646; --m-peak-s:#4a566b; --m-ink:#e8ebf2; --m-lbl:#7c8798; --m-sea-lbl:#5c93b5; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:14px 14px;color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.6;padding-inline:16px;padding-block:20px 64px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.mono{font-variant-numeric:tabular-nums}
.btn:focus-visible,.tab:focus-visible,.ico:focus-visible,.opt input:focus-visible+.card,.lg-go:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* title card */
.tb{background:var(--paper);border:1.5px solid var(--ink);border-radius:24px;padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font:500 11.5px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
h1{font:600 clamp(26px,5.2vw,40px)/1.1 var(--font);letter-spacing:-.02em;margin:4px 0 2px;text-wrap:balance}
.sub{color:var(--mute);font-size:13.5px}
.prompt{margin-top:10px;font:500 12px var(--font);letter-spacing:.1em;text-transform:uppercase}
.caret{display:inline-block;width:.6em}
@media(prefers-reduced-motion:no-preference){.caret{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1.5px solid var(--ink);background:var(--paper);padding:6px 14px;font-size:13px;border-radius:999px;min-height:36px}
.btn:hover{background:var(--accent-soft)}
.btn.pri{background:var(--ink);color:var(--paper)}
.rules{font-size:13px;color:var(--mute);border-left:2px solid var(--ink);padding:2px 12px;display:flex;flex-direction:column;gap:2px;background:color-mix(in srgb,var(--paper) 70%,transparent)}

/* deck bar (progress ring + counter + step buttons) */
.deckbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.prog{display:flex;align-items:center;gap:12px;font:500 15px var(--font)}
.ring{width:44px;height:44px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}.ring .trk{stroke:var(--rule)}.ring .arc{stroke:var(--ink);stroke-linecap:round;stroke-dasharray:113.1;transition:stroke-dashoffset .25s}
.steps{display:flex;gap:8px}
.ico{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);display:grid;place-items:center;padding:0;font:500 20px/1 var(--font)}
.ico:hover:not(:disabled){background:var(--accent-soft)}.ico:disabled{opacity:.35;cursor:default}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1.5px solid var(--rule);background:var(--paper);border-radius:14px;padding:5px 24px 6px 12px;text-align:left;min-width:76px;position:relative}
.tab .n{font:500 10.5px var(--font);color:var(--mute);letter-spacing:.08em}
.tab .d{font:600 13.5px var(--font)}
.tab[aria-selected=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab[aria-selected=true] .n{color:inherit;opacity:.75}
.dot{position:absolute;top:5px;right:5px;width:15px;height:15px;border-radius:50%;font:700 9px/15px var(--font);text-align:center;color:var(--paper)}
.dot.err{background:var(--err)}.dot.warn{background:var(--warn)}.dot.pass{background:var(--accent)}
.tab[aria-selected=true] .dot{box-shadow:0 0 0 1.5px var(--paper)}

/* card stack */
.stack{position:relative;margin:0 0 30px 24px}
.stack::before,.stack::after{content:"";position:absolute;inset:0;border:1.5px solid var(--ink);border-radius:26px;background:var(--paper);pointer-events:none}
.stack::before{transform:translate(-12px,12px);opacity:.55;box-shadow:0 12px 26px rgba(0,0,0,.08)}
.stack::after{transform:translate(-24px,24px);opacity:.28}
.dayc{position:relative;z-index:1;background:var(--paper);border:1.5px solid var(--ink);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:18px;min-width:0}
.dhead{display:flex;flex-direction:column;gap:8px}
.dhead h2{font:600 clamp(22px,4vw,30px)/1.15 var(--font);letter-spacing:-.015em;margin:0;text-wrap:balance}
.dsub{font-size:13.5px;color:var(--mute)}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--mute)}
.meta b{color:var(--ink);font-weight:500}
.wx{display:flex;flex-direction:column;gap:6px}
.note{font-size:13.5px;padding:7px 12px;border:1px solid var(--rule);border-left:3px solid var(--info);border-radius:10px;background:var(--info-soft)}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.dcols{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.mapcol,.maincol{display:flex;flex-direction:column;gap:14px;min-width:0}
@media(min-width:900px){.dcols{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:22px}.mapcol{position:sticky;top:12px;align-self:start}}

/* map */
.mapbox{border:1.5px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--m-land)}
.map{display:block;width:100%;height:auto}
.mcap{font:500 10.5px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.m-land{fill:var(--m-land)}.m-sea{fill:var(--m-sea)}
#mf1 ellipse{fill:var(--m-forest)}#mf2 ellipse{fill:var(--m-forest2)}
.m-river{fill:none;stroke:var(--m-water);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.m-lake{fill:var(--m-sea);stroke:var(--m-water);stroke-width:1.6}
.m-peak{fill:var(--m-peak);stroke:var(--m-peak-s);stroke-width:1;stroke-linejoin:round}.m-cap{fill:var(--m-land)}
.m-crown{fill:var(--m-tree)}.m-trunk{stroke:var(--m-ink);stroke-width:1.6;stroke-linecap:round}
.m-lbl{font:500 9.5px var(--font);letter-spacing:.14em;fill:var(--m-lbl);paint-order:stroke;stroke:var(--m-land);stroke-width:3px;stroke-linejoin:round}
.lk-sea,.lk-lake{fill:var(--m-sea-lbl);font-style:italic;stroke:none}.lk-city{font-weight:700;fill:var(--m-ink);opacity:.75}
.m-route{fill:none;stroke:var(--m-ink);stroke-width:6;stroke-linecap:round}
.m-route-in{fill:none;stroke:var(--m-land);stroke-width:2.2;stroke-linecap:round}
.m-hop{fill:none;stroke:var(--m-ink);stroke-width:2;stroke-dasharray:3 4;stroke-linecap:round}
.m-arrow{fill:var(--m-ink);stroke:var(--m-land);stroke-width:1.2;stroke-linejoin:round}
.m-pin{cursor:pointer;outline:none}
.m-pin-bg{fill:var(--m-ink);stroke:var(--m-land);stroke-width:2.5}
.m-hotel .m-pin-bg{fill:var(--m-land);stroke:var(--m-ink)}
.m-pin-t{font:700 12px var(--font);fill:var(--m-land)}.m-hotel .m-pin-t{fill:var(--m-ink)}
.m-pin:hover .m-pin-bg{stroke:var(--accent);stroke-width:3.5}.m-pin:focus-visible .m-pin-bg{stroke:var(--err);stroke-width:3.5}
.m-north-a{fill:var(--m-ink)}.m-north-t,.m-scale text{font:600 10px var(--font);fill:var(--m-ink);paint-order:stroke;stroke:var(--m-land);stroke-width:3px}
.m-scale path{fill:none;stroke:var(--m-ink);stroke-width:1.6}
.lg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.lg li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:4px 0;border-top:1px solid var(--rule2)}
.lg li:first-child{border-top:0}
.pin{width:26px;height:26px;border-radius:50%;background:var(--m-ink);color:var(--m-land);font:700 12px/26px var(--font);text-align:center;flex:0 0 auto}
.pin.hotel{background:var(--m-land);color:var(--m-ink);box-shadow:inset 0 0 0 2px var(--m-ink)}
.lg-go{border:0;background:none;padding:2px 0;text-align:left;min-width:0}
.lg-n{font-size:13.5px;font-weight:500;overflow-wrap:anywhere}.lg-t{font:400 11.5px var(--font);color:var(--mute)}
.lg a{font-size:12px;white-space:nowrap}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--mute);padding-top:8px;border-top:1px dashed var(--rule)}
.key span{display:inline-flex;align-items:center;gap:6px}.key svg{width:26px;height:14px}

/* strip */
.strip{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:10px 12px 8px}
.strip h3{font:500 11px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
.bar{position:relative;height:30px;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/15 - 1px),var(--rule2) calc(100%/15 - 1px) calc(100%/15));border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.nap{position:absolute;top:0;bottom:0;background:var(--nap);opacity:.9}
.seg{position:absolute;top:5px;bottom:5px;min-width:2px;border-radius:2px;cursor:pointer;border:0;padding:0}
.seg.move{background:var(--move)}.seg.eat{background:var(--eat)}.seg.see{background:var(--see)}.seg.stay{background:var(--stay)}
.seg.err{outline:2px solid var(--err);outline-offset:1px}.seg.warn{outline:2px solid var(--warn);outline-offset:1px}
.ticks{position:relative;height:16px;margin-top:2px;font:400 10.5px var(--font);color:var(--mute)}
.ticks span{position:absolute;transform:translateX(-50%)}
.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px;border-radius:2px}

/* issues */
.iss{border:1px solid var(--rule);background:var(--paper);border-radius:14px;overflow:hidden}
.iss h3{margin:0;padding:8px 12px;font:600 13.5px var(--font);border-bottom:1px solid var(--rule2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cnt{font:500 12px var(--font);padding:1px 8px;border-radius:9px}
.cnt.err{background:var(--err-soft);color:var(--err)}.cnt.warn{background:var(--warn-soft);color:var(--warn)}.cnt.info{background:var(--info-soft);color:var(--info)}
.iss ul{list-style:none;margin:0;padding:4px 0;max-height:240px;overflow:auto}
.iss li button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;padding:5px 12px;font-size:13.5px}
.iss li button:hover{background:var(--bg)}
.lv{flex:0 0 auto;font:600 10.5px var(--font);padding:1px 6px;border-radius:3px;margin-top:3px;letter-spacing:.05em}
.lv.err{background:var(--err);color:var(--paper)}.lv.warn{background:var(--warn);color:var(--paper)}.lv.info{background:var(--info);color:var(--paper)}
.ok{padding:10px 12px;color:var(--accent);font-size:14px}

/* slots */
.slots{display:flex;flex-direction:column}
.slot{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--rule);scroll-margin-top:12px}
.slot:first-child{border-top:0}
.slot:target,.slot.flash{background:linear-gradient(90deg,var(--accent-soft),transparent 60%)}
.time{font:600 15px var(--font);padding-top:2px}
.time small{display:block;font:400 11px var(--font);color:var(--mute)}
.body{display:flex;flex-direction:column;gap:8px;min-width:0}
.st{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.st h4{font:600 15px var(--font);margin:0}
.chip{font:500 10.5px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);border:1px solid var(--rule);border-radius:999px;padding:0 8px}
.pk{font-size:12px;color:var(--mute)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.opt{display:block;min-width:0;position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%;z-index:2}
.card{border:1px solid var(--rule);background:var(--paper);border-radius:12px;padding:8px 11px;height:100%;display:flex;flex-direction:column;gap:3px}
.opt input:checked+.card{border:1.5px solid var(--ink);box-shadow:inset 4px 0 0 var(--accent);background:var(--accent-soft)}
.card .n{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.card .nt{font-size:12.5px;color:var(--mute)}
.tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tg{font-size:11px;padding:0 7px;border-radius:999px;background:var(--rule2);color:var(--ink)}
.tg.warn{background:var(--warn-soft);color:var(--warn)}.tg.info{background:var(--info-soft);color:var(--info)}.tg.good{background:var(--accent-soft);color:var(--accent)}
.map-a{position:relative;z-index:3;font-size:12px;margin-left:auto;white-space:nowrap}
.slot-iss{display:flex;flex-direction:column;gap:3px}
.si{font-size:13px;padding:3px 10px;border-left:3px solid var(--info);background:var(--info-soft);border-radius:0 8px 8px 0}
.si.warn{border-color:var(--warn);background:var(--warn-soft)}.si.err{border-color:var(--err);background:var(--err-soft)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;font-size:13px;border-radius:999px;z-index:10}
.fb{display:flex;flex-direction:column;gap:6px}
.fb textarea{width:100%;height:160px;font:12px var(--font);background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media(max-width:560px){
  body{padding-inline:12px}
  .tb{padding:16px}.dayc{padding:16px;border-radius:20px}
  .stack{margin-left:14px}.stack::before{transform:translate(-7px,8px);border-radius:22px}.stack::after{transform:translate(-14px,16px);border-radius:22px}
  .slot{grid-template-columns:1fr;gap:4px}.time{display:flex;gap:8px;align-items:baseline}.time small{display:inline}
}
@media(prefers-reduced-motion:no-preference){.card{transition:background .12s,border-color .12s}}
</style>
<body>
<div class="wrap">
  <header class="tb">
    <div class="eyebrow" id="eb"></div>
    <h1 id="ttl"></h1>
    <div class="sub" id="sub"></div>
    <div class="prompt">&gt; READY TO EXECUTE <span class="caret">_</span></div>
    <div class="tools">
      <button class="btn pri" id="cpDay">คัดลอกแผนวันนี้</button>
      <button class="btn" id="cpAll">คัดลอกทั้งทริป</button>
      <button class="btn" id="reset">รีเซ็ตตัวเลือก</button>
      <button class="btn" id="theme" aria-label="สลับธีม">◐</button>
    </div>
  </header>
  <div class="rules" id="rules"></div>
  <div class="deckbar">
    <div class="prog">
      <svg class="ring" viewBox="0 0 44 44" aria-hidden="true"><circle class="trk" cx="22" cy="22" r="18"/><circle class="arc" id="ring" cx="22" cy="22" r="18"/></svg>
      <span id="cnt" class="mono"></span>
    </div>
    <div class="steps">
      <button class="ico" id="prev" data-step="-1" aria-label="วันก่อนหน้า"><svg viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6"/></svg></button>
      <button class="ico" id="next" data-step="1" aria-label="วันถัดไป"><svg viewBox="0 0 20 20"><path d="M3 4l6 6-6 6M10 4l6 6-6 6M18 4v12"/></svg></button>
    </div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="stack"><main id="day" class="dayc" role="tabpanel" tabindex="-1"></main></div>
  <div id="sr" class="sr" aria-live="polite"></div>
</div>
<div id="toast" class="toast" hidden></div>

<script id="trip" type="application/json">{{TRIP}}</script>
<script>{{ENGINE}}</script>
<script>{{MAP}}</script>
<script>
(function(){
  const E=window.Engine, MV=window.MapView, trip=JSON.parse(document.getElementById('trip').textContent);
  const KEY='japan2569.sel.'+(trip.meta.version||'v1'), N=trip.days.length;
  let sel={}, cur=0, resetT;
  try{sel=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){sel={}}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(sel))}catch(e){}};
  const $=s=>document.querySelector(s);
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const pad=n=>String(n).padStart(2,'0');
  const GROUP={arrival:'move',drive:'move',nap:'move',rest:'move',refuel:'move',car:'move',carreturn:'move',flight:'move',transit:'move',move:'move',meal:'eat',cafe:'eat',see:'see',arch:'see',shop:'see',spa:'see',hotel:'stay'};
  const KIND={arrival:'ถึง',hotel:'โรงแรม',meal:'มื้ออาหาร',drive:'ขับรถ',nap:'ขับ·นอน',rest:'พัก',sight:'เที่ยว',see:'เที่ยว',arch:'สถาปัตย์',cafe:'คาเฟ่',shop:'ช้อป',refuel:'เติมน้ำมัน',car:'รถเช่า',carreturn:'คืนรถ',flight:'เที่ยวบิน',spa:'ออนเซ็น',transit:'เดินทาง',move:'เดินทาง'};
  const MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const MONEN=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const DOWF=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  const DOWEN=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const dstr=d=>{const p=d.date.split('-');return DOWF[E.dowOf(d)]+' '+(+p[2])+' '+MON[+p[1]-1]};
  const dEn=d=>{const p=d.date.split('-');return DOWEN[E.dowOf(d)]+' '+(+p[2])+' '+MONEN[+p[1]-1]+' '+p[0]};
  const mapUrl=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
  const worst=is=>is.some(i=>i.level==='err')?'err':is.some(i=>i.level==='warn')?'warn':'ok';
  const KEYSVG='<div class="key" aria-label="สัญลักษณ์">'+
    '<span><svg viewBox="0 0 26 14"><path d="M1 7H25" stroke="var(--m-ink)" stroke-width="6" stroke-linecap="round"/><path d="M1 7H25" stroke="var(--paper)" stroke-width="2.2" stroke-linecap="round"/></svg>ขับรถ</span>'+
    '<span><svg viewBox="0 0 26 14"><path d="M1 7H25" stroke="var(--m-ink)" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round"/></svg>ระยะสั้น</span>'+
    '<span><svg viewBox="0 0 26 14"><circle cx="13" cy="7" r="6" fill="var(--m-ink)"/></svg>จุดแวะ</span>'+
    '<span><svg viewBox="0 0 26 14"><circle cx="13" cy="7" r="5.5" fill="var(--paper)" stroke="var(--m-ink)" stroke-width="2"/></svg>ที่พัก</span>'+
    '<span><svg viewBox="0 0 26 14"><path d="M1 12L8 3l7 9" fill="var(--m-peak)" stroke="var(--m-peak-s)"/><circle cx="20" cy="5" r="1.4" fill="var(--m-forest)"/><circle cx="23" cy="9" r="1.4" fill="var(--m-forest)"/></svg>ภูเขา/ป่า</span></div>';

  function head(){
    $('#eb').textContent='> ITINERARY · '+N+' DAYS';
    $('#ttl').textContent=trip.meta.title;
    $('#sub').textContent=trip.meta.subtitle+' · '+trip.meta.party;
    $('#rules').innerHTML=trip.meta.rules.map(r=>'<div>• '+esc(r)+'</div>').join('');
  }
  function deck(){
    $('#cnt').textContent=pad(cur+1)+' / '+pad(N);
    $('#ring').style.strokeDashoffset=(113.1*(1-(cur+1)/N)).toFixed(1);
    $('#prev').disabled=cur===0; $('#next').disabled=cur===N-1;
  }
  function tabs(){
    const box=$('#tabs'), sx=box.scrollLeft;
    box.innerHTML=trip.days.map((d,i)=>{
      const w=worst(E.analyze(trip,d,sel)), p=d.date.split('-');
      return '<button class="tab" role="tab" id="tab'+i+'" aria-controls="day" tabindex="'+(i===cur?0:-1)+'" aria-selected="'+(i===cur)+'" aria-label="วันที่ '+d.n+' · '+(w==='err'?'มีข้อขัดแย้ง':w==='warn'?'มีข้อควรระวัง':'ผ่าน')+'" data-i="'+i+'"><span class="dot '+(w==='ok'?'pass':w)+'" aria-hidden="true">'+(w==='err'?'✕':w==='warn'?'!':'✓')+'</span><div class="n">D'+d.n+' · '+E.DOW[E.dowOf(d)]+'</div><div class="d">'+(+p[2])+' ต.ค.</div></button>';
    }).join('');
    box.scrollLeft=sx;
    const on=box.querySelector('[aria-selected=true]'); if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'nearest'});
  }
  function strip(d,is){
    const A=E.mins(trip.meta.dayStart),B=E.mins(trip.meta.dayEnd),W=B-A,pcn=m=>Math.min(100,Math.max(0,(m-A)/W*100)),pc=m=>pcn(m).toFixed(2);
    const bad={};is.forEach(i=>{if(i.slotId&&(i.level==='err'||bad[i.slotId]!=='err'&&i.level==='warn'))bad[i.slotId]=i.level});
    const segs=d.slots.map(s=>{const dur=E.slotDur(s,sel);if(!dur)return '';const st=E.mins(s.time);
      const cls='seg '+(GROUP[s.kind]||'see')+(bad[s.id]?' '+bad[s.id]:'');
      return '<button class="'+cls+'" style="left:'+pc(st)+'%;width:'+Math.max(0.3,pcn(st+dur)-pcn(st)).toFixed(2)+'%" data-go="'+s.id+'" title="'+esc(s.time+' · '+s.title+' ('+dur+' นาที)')+'" aria-label="'+esc(s.time+' '+s.title)+'"></button>'}).join('');
    const n1=E.mins(trip.meta.nap[0]),n2=E.mins(trip.meta.nap[1]);
    let ticks='';for(let m=A;m<=B;m+=180)ticks+='<span style="left:'+pc(m)+'%">'+E.hhmm(m)+'</span>';
    return '<section class="strip"><h3>Timeline '+trip.meta.dayStart+'–'+trip.meta.dayEnd+' · แถบม่วง = เด็กนอน '+trip.meta.nap.join('–')+'</h3><div class="bar"><div class="nap" style="left:'+pc(n1)+'%;width:'+((n2-n1)/W*100).toFixed(2)+'%"></div>'+segs+'</div><div class="ticks">'+ticks+'</div><div class="legend"><span><i style="background:var(--move)"></i>เดินทาง</span><span><i style="background:var(--eat)"></i>อาหาร</span><span><i style="background:var(--see)"></i>เที่ยว</span><span><i style="background:var(--stay)"></i>พัก</span></div></section>';
  }
  function issBox(is){
    const c={err:0,warn:0,info:0};is.forEach(i=>{c[i.level]++});
    const h='<section class="iss"><h3>ตรวจความขัดแย้งอัตโนมัติ <span class="cnt err">ผิดพลาด '+c.err+'</span><span class="cnt warn">เตือน '+c.warn+'</span><span class="cnt info">แจ้ง '+c.info+'</span></h3>';
    if(!is.length)return h+'<div class="ok">✓ ไม่พบข้อขัดแย้งในตัวเลือกปัจจุบัน</div></section>';
    return h+'<ul>'+is.map(i=>'<li><button data-go="'+i.slotId+'"><span class="lv '+i.level+'">'+({err:'ERR',warn:'WARN',info:'INFO'})[i.level]+'</span><span>'+esc(i.msg)+'</span></button></li>').join('')+'</ul></section>';
  }
  function mapCol(d){
    const mv=MV.render(trip,d,sel);
    if(!mv.svg)return '';
    const rows=mv.stops.map(s=>{
      const names=MV.stopName(s);
      const times=[...new Set(s.items.map(i=>i.time||'START'))].join(' · ');
      const first=s.items.find(i=>i.slotId)||s.items[0];
      return '<li><span class="pin'+(s.hotel?' hotel':'')+'" aria-hidden="true">'+s.letter+'</span><button class="lg-go" '+(first.slotId?'data-go="'+esc(first.slotId)+'"':'disabled')+'><div class="lg-n">'+esc(names)+'</div><div class="lg-t">'+esc(times)+'</div></button><a href="'+mapUrl(first.q)+'" target="_blank" rel="noopener" aria-label="เปิด '+esc(first.name)+' ใน Google Maps">แผนที่ ↗</a></li>';
    }).join('');
    return '<div class="mapbox">'+mv.svg+'</div><div class="mcap"><span>Illustration · not to scale</span><span>ตำแหน่งโดยประมาณ — ใช้ Google Maps ตอนขับจริง</span></div><ol class="lg">'+rows+'</ol>'+KEYSVG;
  }
  function opt(s,o,on){
    const tags=[];
    if(o.dur)tags.push('<span class="tg mono">'+o.dur+' นาที</span>');
    if(o.km)tags.push('<span class="tg mono">'+o.km+' กม.</span>');
    if(o.arch)tags.push('<span class="tg good">สถาปัตย์</span>');
    if(o.kids)tags.push('<span class="tg good">เหมาะเด็ก</span>');
    if(o.queue)tags.push('<span class="tg warn">มีคิว</span>');
    if(o.steep)tags.push('<span class="tg warn">บันไดชัน</span>');
    if(o.cold)tags.push('<span class="tg info">เย็น</span>');
    if(o.reserve)tags.push('<span class="tg info">ควรจอง</span>');
    if(o.last)tags.push('<span class="tg mono">เข้าถึง '+o.last+'</span>');
    const link=o.q?'<a class="map-a" href="'+mapUrl(o.q)+'" target="_blank" rel="noopener">แผนที่ ↗</a>':'';
    const type=s.pick==='one'?'radio':'checkbox';
    return '<label class="opt"><input type="'+type+'" name="'+s.id+'" value="'+o.id+'" data-slot="'+s.id+'"'+(on?' checked':'')+'><div class="card"><div class="n">'+esc(o.n)+'</div>'+(o.note?'<div class="nt">'+esc(o.note)+'</div>':'')+'<div class="tags">'+tags.join('')+link+'</div></div></label>';
  }
  function slots(d,is){
    return '<section class="slots">'+d.slots.map(s=>{
      const on=E.selected(s,sel).map(o=>o.id),dur=E.slotDur(s,sel),st=E.mins(s.time);
      const mine=is.filter(i=>i.slotId===s.id);
      return '<div class="slot" id="'+s.id+'"><div class="time">'+s.time+(dur?'<small>→ '+E.hhmm(st+dur)+'</small>':'')+'</div><div class="body"><div class="st"><h4>'+esc(s.title)+'</h4><span class="chip">'+(KIND[s.kind]||s.kind)+'</span>'+(s.opts.length>1?'<span class="pk">'+(s.pick==='one'?'เลือก 1':'เลือกได้หลายอย่าง')+'</span>':'')+'</div><div class="opts">'+s.opts.map(o=>opt(s,o,on.indexOf(o.id)>-1)).join('')+'</div>'+(mine.length?'<div class="slot-iss">'+mine.map(i=>'<div class="si '+i.level+'">'+esc(i.msg)+'</div>').join('')+'</div>':'')+'</div></div>';
    }).join('')+'</section>';
  }
  function day(){
    const d=trip.days[cur],is=E.analyze(trip,d,sel);
    $('#day').innerHTML='<div class="dhead"><div class="eyebrow">&gt; DAY '+pad(d.n)+' / '+pad(N)+' · '+dEn(d)+'</div><h2>'+esc(d.label)+'</h2><div class="dsub">'+dstr(d)+'</div>'+
      '<div class="meta"><span>เส้นทาง: <b>'+esc(d.route)+'</b></span><span>พัก: <b>'+esc(d.night)+'</b></span></div>'+
      '<div class="wx">'+d.weather.map(w=>'<div class="note '+(w.s==='warn'?'warn':'')+'">'+esc(w.t)+'</div>').join('')+'</div></div>'+
      '<div class="dcols"><div class="mapcol">'+mapCol(d)+'</div><div class="maincol">'+strip(d,is)+issBox(is)+slots(d,is)+'</div></div>';
    const c={err:0,warn:0,info:0};is.forEach(i=>{c[i.level]++});
    $('#sr').textContent='DAY '+d.n+': ผิดพลาด '+c.err+' เตือน '+c.warn+' แจ้ง '+c.info;
  }
  function render(focusKey){
    head();deck();tabs();day();
    if(focusKey){const el=document.querySelector('input[name="'+focusKey[0]+'"][value="'+focusKey[1]+'"]');if(el)el.focus({preventScroll:true})}
  }
  function go(i,slot){
    cur=Math.max(0,Math.min(N-1,i));
    try{history.replaceState(null,'','#d'+(cur+1))}catch(e){location.hash='d'+(cur+1)}
    render();
    if(slot){const el=document.getElementById(slot);if(el){el.scrollIntoView({block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1400)}}
  }
  function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.hidden=true},1800)}
  function planText(ds){
    return ds.map(d=>{
      const lines=['DAY '+d.n+' · '+dstr(d)+' · '+d.label,'พัก: '+d.night];
      d.slots.forEach(s=>{const o=E.selected(s,sel).filter(x=>!x.skip);if(!o.length)return;
        lines.push(s.time+'  '+s.title+': '+o.map(x=>x.n).join(' + '))});
      const is=E.analyze(trip,d,sel).filter(i=>i.level!=='info');
      if(is.length){lines.push('— ข้อควรตรวจ —');is.forEach(i=>lines.push('• '+i.msg))}
      return lines.join('\n')}).join('\n\n');
  }
  function copy(text){
    function fb(){const w=document.createElement('div');w.className='fb';w.innerHTML='<div class="sub">คัดลอกอัตโนมัติไม่ได้ — เลือกข้อความด้านล่างแล้วกดคัดลอก</div><textarea readonly></textarea>';w.querySelector('textarea').value=text;$('#day').prepend(w);const t=w.querySelector('textarea');t.focus();t.select()}
    try{navigator.clipboard.writeText(text).then(()=>toast('คัดลอกแล้ว'),fb)}catch(e){fb()}
  }

  document.addEventListener('click',e=>{
    if(e.target.closest('a'))return;
    const st=e.target.closest('[data-step]');if(st){go(cur+(+st.dataset.step));return}
    const t=e.target.closest('.tab');if(t){go(+t.dataset.i);return}
    const g=e.target.closest('[data-go]');if(g){const id=g.dataset.go;let di=-1;trip.days.forEach((d,i)=>{if(d.slots.some(s=>s.id===id))di=i});if(di>-1)go(di,id);return}
    if(e.target.id==='cpDay')copy(planText([trip.days[cur]]));
    if(e.target.id==='cpAll')copy(planText(trip.days));
    if(e.target.id==='reset'){const b=e.target;
      if(b.dataset.arm){clearTimeout(resetT);delete b.dataset.arm;b.textContent='รีเซ็ตตัวเลือก';sel={};save();render();toast('รีเซ็ตแล้ว')}
      else{b.dataset.arm='1';b.textContent='แตะอีกครั้งเพื่อรีเซ็ต';resetT=setTimeout(()=>{delete b.dataset.arm;b.textContent='รีเซ็ตตัวเลือก'},3000)}}
    if(e.target.id==='theme'){const r=document.documentElement,dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dark?'light':'dark'}
  });
  document.addEventListener('change',e=>{
    const i=e.target;if(!i.dataset||!i.dataset.slot)return;
    let s=null;trip.days.forEach(d=>{d.slots.forEach(x=>{if(x.id===i.dataset.slot)s=x})});
    if(s.pick==='one')sel[s.id]=[i.value];
    else{const c2=E.selected(s,sel).map(o=>o.id),k=c2.indexOf(i.value);if(k>-1)c2.splice(k,1);else c2.push(i.value);sel[s.id]=c2}
    save();const y=window.scrollY;render([s.id,i.value]);window.scrollTo(0,y);
  });
  document.addEventListener('keydown',e=>{
    const pinEl=e.target.closest&&e.target.closest('.m-pin');
    if(pinEl&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pinEl.dispatchEvent(new MouseEvent('click',{bubbles:true}));return}
    const t=e.target.closest&&e.target.closest('.tab');if(!t)return;
    const i=+t.dataset.i,j=e.key==='ArrowRight'?(i+1)%N:e.key==='ArrowLeft'?(i+N-1)%N:e.key==='Home'?0:e.key==='End'?N-1:-1;
    if(j<0)return;e.preventDefault();go(j);const el=document.getElementById('tab'+j);if(el)el.focus();
  });
  const fromHash=()=>{const m=/^#d(\d)$/.exec(location.hash);if(m&&trip.days[+m[1]-1])cur=+m[1]-1};
  window.addEventListener('hashchange',()=>{fromHash();render()});
  fromHash();render();
})();
</script>
</body>
</html>
