<!doctype html>
<html lang="th" data-style="mint" data-mode="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Japan 2569 Itinerary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>{{VENDOR_CSS}}</style>
<style>
/* Thai: Sukhumvit Set (local install; IBM Plex Sans Thai is the web fallback). */
@font-face{font-family:'Sukhumvit Set';font-weight:400;src:local('Sukhumvit Set'),local('SukhumvitSet-Text'),local('Sukhumvit Set Text')}
@font-face{font-family:'Sukhumvit Set';font-weight:500;src:local('Sukhumvit Set Medium'),local('SukhumvitSet-Medium')}
@font-face{font-family:'Sukhumvit Set';font-weight:600;src:local('Sukhumvit Set SemiBold'),local('SukhumvitSet-SemiBold')}

/* ===== tokens — three minimal options ===== */
[data-style]{--th:'Sukhumvit Set','Sukhumvit','IBM Plex Sans Thai','Noto Sans Thai',sans-serif;
  --nap:rgba(110,80,160,.18);--move:#8b97ad;--eat:#d08a4c;--see:#3f9a82;--stay:#6c74a8;--route:#d9480f}
[data-style="mint"]{--bg:#b9d6c0;--ink:#0f1a12;--mute:#3a4a3e;--faint:#46594c;--rule:rgba(15,26,18,.22);
  --err:#8c1c13;--warn:#6a4300;--info:#1f4378;--sel:rgba(15,26,18,.08);
  --font:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace,var(--th);--tsz:11.5px}
[data-style="outline"]{--bg:#ffffff;--ink:#111111;--mute:#666666;--faint:#6e6e6e;--rule:#cfcfcf;
  --err:#b3261e;--warn:#8a5a00;--info:#2a5aa8;--sel:#f3f3f3;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',var(--th);--tsz:13px}
[data-style="blueprint"]{--bg:#f4f8fc;--ink:#1c4f8a;--mute:#4a6f96;--faint:#52759b;--rule:#a9c3dd;
  --err:#b3261e;--warn:#8a5a00;--info:#1c4f8a;--sel:#e3edf7;--route:#d9480f;
  --font:'Geist Mono',ui-monospace,Menlo,Consolas,monospace,var(--th);--tsz:11.5px}
[data-mode="dark"] [data-style],[data-mode="dark"][data-style]{--err:#ff8a80;--warn:#f2c36b;--info:#8fb1f0;--nap:rgba(170,140,230,.22);--move:#6c7695;--eat:#c27a3a;--see:#3f8c82;--stay:#8a86c2;--route:#ff8a4c}
[data-mode="dark"] [data-style="mint"],[data-mode="dark"][data-style="mint"]{--bg:#12211a;--ink:#d3eadb;--mute:#9cb8a5;--faint:#9cb8a5;--rule:rgba(211,234,219,.2);--sel:rgba(211,234,219,.07)}
[data-mode="dark"] [data-style="outline"],[data-mode="dark"][data-style="outline"]{--bg:#121212;--ink:#f0f0f0;--mute:#a3a3a3;--faint:#a3a3a3;--rule:#3a3a3a;--sel:#1e1e1e}
[data-mode="dark"] [data-style="blueprint"],[data-mode="dark"][data-style="blueprint"]{--bg:#0d1b2a;--ink:#a9cdf2;--mute:#7ea6cf;--faint:#7ea6cf;--rule:#28425e;--sel:#13263a}
[data-mode="dark"]{color-scheme:dark}

/* ===== base: type and space only, no boxes ===== */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;padding:28px 20px 96px;transition:background .2s}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.u{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.lbl{font-size:var(--tsz);color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.tl{font-size:var(--tsz);color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}

.tb{display:flex;flex-direction:column;gap:2px}
.tb h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.08em;text-transform:uppercase}
.sub{color:var(--mute);font-size:13.5px}
.tools{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13.5px}
.tools button,.tools a{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.rules{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:2px}

/* style picker */
.gallery summary{cursor:pointer;font-size:13.5px}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:14px}
.gcard{display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left}
.gl{font-size:14px;font-weight:600}.gd{font-size:12.5px;color:var(--mute)}
.gcard[aria-checked="true"] .gl{text-decoration:underline;text-underline-offset:4px}
.pv{height:190px;overflow:hidden;padding:14px;border-radius:14px;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;pointer-events:none;
  box-shadow:0 1px 0 rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.07);-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.pv .pvh{font-weight:600;margin-bottom:8px}
@media(max-width:760px){.gal{grid-template-columns:1fr}.pv{height:160px}}

/* day navigation */
.nav{display:flex;align-items:baseline;gap:4px 16px;flex-wrap:wrap}
.tabs{display:flex;gap:2px 14px;flex-wrap:wrap}
.tab{font-size:14px;padding:4px 0;color:var(--faint);font-variant-numeric:tabular-nums;position:relative}
.tab[aria-selected=true]{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1.5px}
.tab .m{font-size:10px;margin-left:2px;vertical-align:super}
.tab .m.err{color:var(--err)}.tab .m.warn{color:var(--warn)}
.steps{display:flex;align-items:center;gap:14px;margin-left:auto;font-size:14px}
.steps button{font-size:20px;line-height:1;width:36px;height:36px}
.steps button:disabled{opacity:.25;cursor:default}
@media(max-width:600px){
  body{padding:20px 16px 96px}
  .steps{position:fixed;left:0;right:0;bottom:0;z-index:20;justify-content:space-between;padding:10px 28px calc(10px + env(safe-area-inset-bottom,0px));margin:0;
    background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--rule)}
  .steps button{width:44px;height:44px}
}

/* day */
.dayc{display:flex;flex-direction:column;gap:22px;min-width:0}
.dhead{display:flex;flex-direction:column;gap:4px}
.dhead h2{font-size:clamp(20px,3.6vw,28px);line-height:1.2;margin:0;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:2px 18px;font-size:13.5px;color:var(--mute)}.meta b{color:var(--ink);font-weight:500}
.wx{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:13.5px}
.wx div{padding-left:18px;text-indent:-18px}.wx div::before{content:"·";display:inline-block;width:18px;text-indent:0}
.wx .warn{color:var(--warn)}.wx .warn::before{content:"!"}
.dcols{display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.mapcol,.maincol{display:flex;flex-direction:column;gap:18px;min-width:0}
@media(min-width:920px){.dcols{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px}.mapcol{position:sticky;top:16px;align-self:start}}

/* map */
.gm-bar{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px}
.gm-bar button{padding:4px 0;color:var(--faint)}
.gm-bar button[aria-pressed=true]{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:5px}
.gm-frame{position:relative;aspect-ratio:1/1;max-height:62vh;width:100%;border-radius:14px;overflow:hidden;background:#f4f8fc}
.ml{position:absolute;inset:0}
.gm-frame .fallback{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:13.5px;color:#4a6f96}
[data-mode="dark"] .ml .maplibregl-canvas{filter:invert(.92) hue-rotate(180deg)}
.mk{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font:600 12px/24px system-ui,sans-serif;text-align:center;cursor:pointer;box-shadow:0 0 0 2px var(--bg);transition:transform .15s}
.mk.hotel{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink),0 0 0 2px var(--bg)}
.mk.on{transform:scale(1.3);z-index:2}
.maplibregl-ctrl-attrib{font-size:10px}
.gm-act{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px}
.gm-note{margin:0;font-size:12px;color:var(--mute)}
.lg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lg li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:3px 0}
.lg .k{font-size:var(--tsz);color:var(--mute)}
.lg li.on .k{color:var(--ink);font-weight:600}
.lg .nm{text-align:left;font-size:14px;overflow-wrap:anywhere}
.lg li.on .nm{text-decoration:underline;text-underline-offset:4px}
.lg .r{display:flex;gap:12px;align-items:baseline}
.lg .r a,.lg .r button{font-size:var(--tsz);color:var(--mute)}

/* timeline strip + checks */
.bar{position:relative;height:10px;border-radius:5px;overflow:hidden;background:var(--sel)}
.nap{position:absolute;top:0;bottom:0;background:var(--nap)}
.seg{position:absolute;top:0;bottom:0;min-width:2px;cursor:pointer}
.seg.move{background:var(--move)}.seg.eat{background:var(--eat)}.seg.see{background:var(--see)}.seg.stay{background:var(--stay)}
.seg.err{box-shadow:inset 0 0 0 2px var(--err)}.seg.warn{box-shadow:inset 0 0 0 2px var(--warn)}
.ticks{position:relative;height:16px;margin-top:4px}
.ticks span{position:absolute;transform:translateX(-50%)}.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:2px}
.legend i{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:50%}
.iss{display:flex;flex-direction:column;gap:2px}
.iss .h{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
.iss ul{list-style:none;margin:4px 0 0;padding:0}
.iss li button{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;text-align:left;font-size:13.5px;padding:2px 0}
.lv{font-size:10.5px;font-weight:600;letter-spacing:.06em;padding-top:2px}
.lv.err{color:var(--err)}.lv.warn{color:var(--warn)}.lv.info{color:var(--info)}
.c-err{color:var(--err)}.c-warn{color:var(--warn)}.c-info{color:var(--info)}

/* slots — a quiet list: time | title, options indented underneath */
.slots{display:flex;flex-direction:column}
.slot{display:grid;grid-template-columns:var(--tw,52px) minmax(0,1fr);column-gap:14px;padding:12px 0;scroll-margin-top:16px;position:relative}
.time{font-size:var(--tsz);color:var(--mute);font-variant-numeric:tabular-nums;padding-top:3px;line-height:1.5}
.time small{display:block;font-size:inherit;opacity:.8}
.node{display:none}
.body{display:flex;flex-direction:column;gap:4px;min-width:0}
.st{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.st h4{font-size:15px;margin:0;font-weight:500}
.chip,.pk{font-size:var(--tsz);color:var(--mute)}
.opts{display:flex;flex-direction:column;gap:0}
.opt{display:block;position:relative;min-width:0}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%;z-index:2}
.card{display:flex;flex-direction:column;gap:0;padding:3px 0 3px 18px;color:var(--faint);position:relative}
.card::before{content:"○";position:absolute;left:0;top:3px;font-size:12px}
.opt input:checked+.card{color:var(--ink)}
.opt input:checked+.card::before{content:"●"}
.opt input[type=checkbox]+.card::before{content:"□"}.opt input[type=checkbox]:checked+.card::before{content:"■"}
.opt input:focus-visible+.card{outline:2px solid var(--ink);outline-offset:2px}
.card .n{font-size:14px;overflow-wrap:anywhere}
.opt input:checked+.card .n{font-weight:500;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.card .nt{font-size:12.5px;color:var(--mute)}
.tags{display:flex;gap:2px 10px;flex-wrap:wrap;font-size:var(--tsz);color:var(--mute)}
.tg.warn{color:var(--warn)}.tg.info{color:var(--info)}
.map-a{position:relative;z-index:3}
.slot-iss{display:flex;flex-direction:column;gap:1px;margin-top:2px}
.si{font-size:13px}.si::before{content:"→ "}
.si.err{color:var(--err)}.si.warn{color:var(--warn)}.si.info{color:var(--info)}
.slot.flash{background:var(--sel)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;font-size:13px;border-radius:999px;z-index:30}
.fb textarea{width:100%;height:160px;font:12px ui-monospace,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--rule)}

/* ===== option 1 · Mint list (phone notes) — the base above, nothing added ===== */

/* ===== option 2 · Outline (white, pills, dashed dividers) ===== */
[data-style="outline"] .tb h1{text-transform:none;letter-spacing:0;font-size:22px}
[data-style="outline"] .slot{--tw:34px;border-top:1px dashed var(--rule);padding:16px 0}
[data-style="outline"] .slot:first-child{border-top:0}
[data-style="outline"] .time{font-size:0;padding-top:0}
[data-style="outline"] .node{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--ink);margin-top:-2px}
[data-style="outline"] .node .ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[data-style="outline"] .tpill{display:inline-flex;gap:6px;border:1px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:13px;font-variant-numeric:tabular-nums}
[data-style="outline"] .card{padding:4px 0 4px 18px}
[data-style="outline"] .gm-bar button[aria-pressed=true],[data-style="outline"] .tab[aria-selected=true]{text-decoration:none;border:1px solid var(--ink);border-radius:999px;padding:3px 10px}
[data-style="outline"] .tab,[data-style="outline"] .gm-bar button{padding:3px 10px;border:1px solid transparent}
.tpill{display:none}
[data-style="outline"] .st{flex-direction:column;gap:4px}

/* ===== option 3 · Blueprint (matches the map) ===== */
[data-style="blueprint"] .slot{border-top:1px dashed var(--rule)}
[data-style="blueprint"] .slot:first-child{border-top:0}
[data-style="blueprint"] .tb h1::before{content:"▢ "}
[data-style="blueprint"] .gm-frame{border-radius:0;outline:1px solid var(--rule);outline-offset:6px}

/* previews: undo rules inherited from the page style, then apply the preview's own */
.pv[data-style] .slot{border-top:0;padding:12px 0;--tw:52px}
.pv[data-style] .time{font-size:var(--tsz);padding-top:3px}
.pv[data-style] .node,.pv[data-style] .tpill{display:none}
.pv[data-style] .st{flex-direction:row;gap:10px}
.pv[data-style="outline"] .slot{--tw:34px;padding:14px 0}
.pv[data-style="outline"] .slot+.slot,.pv[data-style="blueprint"] .slot+.slot{border-top:1px dashed var(--rule)}
.pv[data-style="outline"] .time{font-size:0;padding-top:0}
.pv[data-style="outline"] .node{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--ink);margin-top:-2px}
.pv[data-style="outline"] .node .ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pv[data-style="outline"] .tpill{display:inline-flex;border:1px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:13px}
.pv[data-style="outline"] .st{flex-direction:column;gap:4px}
</style>
<body>
<div class="wrap">
  <header class="tb">
    <h1 id="ttl" class="u"></h1>
    <div class="sub" id="sub"></div>
    <div class="tools">
      <button id="cpDay">คัดลอกแผนวันนี้</button>
      <button id="cpAll">คัดลอกทั้งทริป</button>
      <button id="reset">รีเซ็ตตัวเลือก</button>
      <button id="theme">สว่าง / มืด</button>
      <a href="index.html" class="u">หน้า "วันนี้" ↗</a>
      <a id="l-places" class="u" target="_blank" rel="noopener">แผนที่สถานที่ ↗</a>
      <a id="l-sheet" class="u" target="_blank" rel="noopener">ข้อมูลทริป ↗</a>
    </div>
  </header>
  <details class="gallery" id="gallery" open><summary>เลือกสไตล์ (3 แบบ)</summary><div class="gal" role="radiogroup" aria-label="สไตล์" id="gal"></div></details>
  <nav class="nav" aria-label="วัน">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="steps">
      <button id="prev" data-step="-1" aria-label="วันก่อนหน้า">‹</button>
      <span id="cnt" class="tl"></span>
      <button id="next" data-step="1" aria-label="วันถัดไป">›</button>
    </div>
  </nav>
  <main id="day" class="dayc" role="tabpanel" tabindex="-1"></main>
  <details class="rules-d"><summary class="lbl">กติกาของทริป</summary><div class="rules" id="rules"></div></details>
  <div id="sr" class="sr" aria-live="polite"></div>
</div>
<div id="toast" class="toast" hidden></div>

<script id="trip" type="application/json">{{TRIP}}</script>
<script id="mapstyle" type="application/json">{{STYLE}}</script>
<script>{{VENDOR_JS}}</script>
<script>{{ENGINE}}</script>
<script>{{MAP}}</script>
<script>
(function(){
  const E=window.Engine, MV=window.MapView, trip=JSON.parse(document.getElementById('trip').textContent);
  const KEY='japan2569.sel.'+(trip.meta.version||'v1'), N=trip.days.length, root=document.documentElement;
  const STYLES=[
    {id:'mint',l:'1 · Mint list',d:'พื้นเขียวมิ้นต์ ตัวพิมพ์โมโน เวลาเล็กๆ ซ้าย ชื่อขวา ไม่มีกรอบเลย'},
    {id:'outline',l:'2 · Outline',d:'พื้นขาว วงกลมเส้นประ เวลาเป็นแคปซูลเส้นขอบ เส้นประคั่น'},
    {id:'blueprint',l:'3 · Blueprint',d:'น้ำเงินแบบแบบพิมพ์เขียว ให้เข้าชุดกับแผนที่'}];
  const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  let sel={}, cur=0, resetT, gm=-1, curStops=[];
  try{sel=JSON.parse(ls.get(KEY)||'{}')||{}}catch(e){sel={}}
  const save=()=>ls.set(KEY,JSON.stringify(sel));
  const st0=ls.get('japan2569.style');
  root.dataset.style=STYLES.some(s=>s.id===st0)?st0:'mint';
  root.dataset.mode=ls.get('japan2569.mode')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const $=s=>document.querySelector(s);
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const pad=n=>String(n).padStart(2,'0');
  const GROUP={arrival:'move',drive:'move',nap:'move',rest:'move',refuel:'move',car:'move',carreturn:'move',flight:'move',transit:'move',move:'move',meal:'eat',cafe:'eat',see:'see',arch:'see',shop:'see',spa:'see',hotel:'stay'};
  const KIND={arrival:'ถึง',hotel:'โรงแรม',meal:'อาหาร',drive:'ขับรถ',nap:'ขับ·นอน',rest:'พัก',see:'เที่ยว',arch:'สถาปัตย์',cafe:'คาเฟ่',shop:'ช้อป',refuel:'เติมน้ำมัน',car:'รถเช่า',carreturn:'คืนรถ',flight:'เที่ยวบิน',spa:'ออนเซ็น',transit:'เดินทาง',move:'เดินทาง'};
  const PLANE='M21 16v-2l-8-5V4.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z',CAR='M4 15v-3l2-5h12l2 5v3M4 15h16v3h-3v-2M4 15v3h3v-2';
  const ICON={arrival:PLANE,flight:PLANE,transit:PLANE,move:CAR,drive:CAR,nap:CAR,car:CAR,carreturn:CAR,
    meal:'M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-2.5 5-2.5 8H17v10',cafe:'M5 8h11v6a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V8zM16 9h2a2.5 2.5 0 0 1 0 5h-2',
    hotel:'M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5',rest:'M7 21V4h6a4 4 0 0 1 0 8H7',see:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z',
    arch:'M4 21V8l8-5 8 5v13M9 21v-6h6v6M3 21h18',shop:'M5 8h14l-1 12H6L5 8zM9 8a3 3 0 0 1 6 0',refuel:'M5 21V4h9v17M3 21h13M5 10h9M14 8l3 2v8a1.5 1.5 0 0 0 3 0v-7l-2-2',spa:'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z'};
  const icon=k=>'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="'+(ICON[k]||'M12 8v8M8 12h8')+'"/></svg>';
  const MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'],DOWF=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  const dstr=d=>{const p=d.date.split('-');return DOWF[E.dowOf(d)]+' '+(+p[2])+' '+MON[+p[1]-1]};
  const worst=is=>is.some(i=>i.level==='err')?'err':is.some(i=>i.level==='warn')?'warn':'ok';

  /* ---------- map: MapLibre + ELEMNT Blueprint style (PMTiles from elemnt.earth) ---------- */
  let map=null,mapEl=null,mapReady=false,markers=[];
  const mapOK=!!(window.maplibregl&&window.pmtiles)&&(()=>{try{const c=document.createElement('canvas');return !!(c.getContext('webgl2')||c.getContext('webgl'))}catch(e){return false}})();
  function ensureMap(){
    if(map||!mapOK)return;
    try{
      const pm=new pmtiles.Protocol();maplibregl.addProtocol('pmtiles',pm.tile);
      mapEl=document.createElement('div');mapEl.className='ml';
      map=new maplibregl.Map({container:mapEl,style:JSON.parse(document.getElementById('mapstyle').textContent),center:[138.3,36],zoom:7,
        attributionControl:{compact:true},cooperativeGestures:true,dragRotate:false,pitchWithRotate:false});
      map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
      map.on('style.load',()=>{
        map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[]}}});
        map.addLayer({id:'route',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':getComputedStyle(root).getPropertyValue('--route').trim()||'#d9480f','line-width':2.4,'line-dasharray':[2,1.6]}});
        mapReady=true;drawStops();
      });
    }catch(e){map=null}
  }
  function camera(){
    if(!map||!curStops.length)return;
    if(gm>=0){map.flyTo({center:[curStops[gm].ll[1],curStops[gm].ll[0]],zoom:14,duration:600});return}
    const b=new maplibregl.LngLatBounds();curStops.forEach(s=>b.extend([s.ll[1],s.ll[0]]));
    map.fitBounds(b,{padding:56,maxZoom:13,duration:0});
  }
  function drawStops(){
    if(!map)return;
    markers.forEach(m=>m.remove());markers=[];
    curStops.forEach((s,i)=>{
      const el=document.createElement('button');el.className='mk'+(s.hotel?' hotel':'')+(gm===i?' on':'');el.textContent=s.letter;el.dataset.gm=i;
      el.setAttribute('aria-label',s.letter+' '+MV.stopName(s));el.title=MV.stopName(s);
      markers.push(new maplibregl.Marker({element:el}).setLngLat([s.ll[1],s.ll[0]]).addTo(map));
    });
    if(mapReady)map.getSource('route').setData({type:'Feature',geometry:{type:'LineString',coordinates:MV.lineCoords(curStops)}});
    camera();
  }
  function mountMap(){
    const box=$('.gm-frame');if(!box)return;
    if(!mapOK){box.innerHTML='<div class="fallback">เบราว์เซอร์นี้แสดงแผนที่ไม่ได้ (ต้องใช้ WebGL) — ใช้ลิงก์เปิดใน Google Maps ด้านล่าง</div>';return}
    ensureMap();if(!map)return;box.appendChild(mapEl);map.resize();drawStops();
  }
  function setGm(i){
    gm=i;
    document.querySelectorAll('.gm-bar button').forEach(c=>c.setAttribute('aria-pressed',String(+c.dataset.gm===gm)));
    document.querySelectorAll('.lg li').forEach((li,k)=>li.classList.toggle('on',k===gm));
    markers.forEach((m,k)=>m.getElement().classList.toggle('on',k===gm));
    camera();
  }

  function links(){const L=trip.meta.links||{};[['l-places',L.places],['l-sheet',L.sheet]].forEach(([id,u])=>{const a=$('#'+id);a.hidden=!u;if(u)a.href=u})}
  function head(){links();
    $('#ttl').textContent=trip.meta.title;
    $('#sub').innerHTML=esc(trip.meta.subtitle)+'<br>'+esc(trip.meta.party);
    $('#rules').innerHTML=trip.meta.rules.map(r=>'<div>· '+esc(r)+'</div>').join('');
    $('#cnt').textContent=pad(cur+1)+' / '+pad(N);
    $('#prev').disabled=cur===0;$('#next').disabled=cur===N-1;
  }
  function tabs(){
    $('#tabs').innerHTML=trip.days.map((d,i)=>{
      const w=worst(E.analyze(trip,d,sel)),p=d.date.split('-');
      return '<button class="tab" role="tab" id="tab'+i+'" aria-controls="day" tabindex="'+(i===cur?0:-1)+'" aria-selected="'+(i===cur)+'" aria-label="วันที่ '+d.n+' '+(+p[2])+' ต.ค. · '+(w==='err'?'มีข้อขัดแย้ง':w==='warn'?'มีข้อควรระวัง':'ผ่าน')+'" data-i="'+i+'">'+(+p[2])+' '+E.DOW[E.dowOf(d)]+(w==='ok'?'':'<span class="m '+w+'" aria-hidden="true">'+(w==='err'?'✕':'!')+'</span>')+'</button>';
    }).join('');
  }
  function gallery(){
    const d=trip.days[cur],is=E.analyze(trip,d,sel),mini={...d,slots:d.slots.slice(0,4)};
    $('#gal').innerHTML=STYLES.map(s=>{
      const on=root.dataset.style===s.id;
      return '<div class="gcard" role="radio" tabindex="'+(on?0:-1)+'" aria-checked="'+on+'" data-pick="'+s.id+'"><div class="pv" data-style="'+s.id+'" inert><div class="pvh">'+esc(d.label)+'</div>'+slots(mini,is,s.id)+'</div><span class="gl">'+s.l+(on?' ●':'')+'</span><span class="gd">'+s.d+'</span></div>';
    }).join('');
  }
  function strip(d,is){
    const A=E.mins(trip.meta.dayStart),B=E.mins(trip.meta.dayEnd),W=B-A,pcn=m=>Math.min(100,Math.max(0,(m-A)/W*100)),pc=m=>pcn(m).toFixed(2);
    const bad={};is.forEach(i=>{if(i.slotId&&(i.level==='err'||bad[i.slotId]!=='err'&&i.level==='warn'))bad[i.slotId]=i.level});
    const segs=d.slots.map(s=>{const dur=E.slotDur(s,sel);if(!dur)return '';const st=E.mins(s.time);
      return '<button class="seg '+(GROUP[s.kind]||'see')+(bad[s.id]?' '+bad[s.id]:'')+'" style="left:'+pc(st)+'%;width:'+Math.max(0.3,pcn(st+dur)-pcn(st)).toFixed(2)+'%" data-go="'+s.id+'" title="'+esc(s.time+' · '+s.title+' ('+dur+' นาที)')+'" aria-label="'+esc(s.time+' '+s.title)+'"></button>'}).join('');
    const n1=E.mins(trip.meta.nap[0]),n2=E.mins(trip.meta.nap[1]);
    let ticks='';for(let m=A;m<=B;m+=180)ticks+='<span style="left:'+pc(m)+'%">'+E.hhmm(m)+'</span>';
    return '<section><div class="bar"><div class="nap" style="left:'+pc(n1)+'%;width:'+((n2-n1)/W*100).toFixed(2)+'%"></div>'+segs+'</div><div class="ticks tl">'+ticks+'</div><div class="legend tl"><span><i style="background:var(--move)"></i>เดินทาง</span><span><i style="background:var(--eat)"></i>อาหาร</span><span><i style="background:var(--see)"></i>เที่ยว</span><span><i style="background:var(--stay)"></i>พัก</span><span><i style="background:var(--nap)"></i>เด็กนอน '+trip.meta.nap.join('–')+'</span></div></section>';
  }
  function issBox(is){
    const c={err:0,warn:0,info:0};is.forEach(i=>{c[i.level]++});
    const h='<section class="iss"><div class="h"><span class="lbl">ตรวจความขัดแย้ง</span><span class="tl c-err">ผิดพลาด '+c.err+'</span><span class="tl c-warn">เตือน '+c.warn+'</span><span class="tl c-info">แจ้ง '+c.info+'</span></div>';
    if(!is.length)return h+'<div class="tl">ไม่พบข้อขัดแย้ง</div></section>';
    return h+'<ul>'+is.map(i=>'<li><button data-go="'+i.slotId+'"><span class="lv '+i.level+'">'+({err:'ERR',warn:'WARN',info:'INFO'})[i.level]+'</span><span>'+esc(i.msg)+'</span></button></li>').join('')+'</ul></section>';
  }
  function gmCol(d){
    curStops=MV.stops(trip,d,sel);
    if(!curStops.length)return '';
    if(gm>=curStops.length)gm=-1;
    const chips='<button data-gm="-1" aria-pressed="'+(gm<0)+'">ทั้งวัน</button>'+curStops.map((s,i)=>'<button data-gm="'+i+'" aria-pressed="'+(gm===i)+'" aria-label="'+esc(s.letter+' '+MV.stopName(s))+'">'+s.letter+'</button>').join('');
    const rows=curStops.map((s,i)=>{
      const first=s.items.find(x=>x.slotId)||s.items[0],times=[...new Set(s.items.map(x=>x.time||'start'))].join(' · ');
      return '<li class="'+(gm===i?'on':'')+'"><span class="k">'+s.letter+'</span><button class="nm" data-gm="'+i+'">'+esc(MV.stopName(s))+' <span class="tl">'+esc(times)+'</span></button><span class="r">'+
        (first.slotId?'<button data-go="'+esc(first.slotId)+'">เวลา ↓</button>':'')+'<a href="'+MV.searchUrl(MV.query(s))+'" target="_blank" rel="noopener">Google ↗</a></span></li>';
    }).join('');
    return '<section class="gm"><div class="gm-bar" role="group" aria-label="มุมมองแผนที่">'+chips+'</div></section><div class="gm-frame"></div>'+
      '<div class="gm-act"><a class="u" href="'+esc(MV.dirUrl(curStops))+'" target="_blank" rel="noopener">นำทางใน Google Maps ↗</a></div>'+
      '<p class="gm-note">แผนที่ ELEMNT · OpenStreetMap — เส้นประคือเส้นเชื่อมจุด ไม่ใช่ถนน · ตำแหน่งหมุดเป็นค่าประมาณ ใช้ปุ่มนำทางตอนขับจริง</p><ol class="lg">'+rows+'</ol>';
  }
  function opt(s,o,on,pv){
    const tags=[];
    if(o.dur)tags.push('<span class="tg">'+o.dur+' นาที</span>');
    if(o.km)tags.push('<span class="tg">'+o.km+' กม.</span>');
    if(o.arch)tags.push('<span class="tg">สถาปัตย์</span>');
    if(o.kids)tags.push('<span class="tg">เหมาะเด็ก</span>');
    if(o.queue)tags.push('<span class="tg warn">มีคิว</span>');
    if(o.steep)tags.push('<span class="tg warn">บันไดชัน</span>');
    if(o.cold)tags.push('<span class="tg info">เย็น</span>');
    if(o.reserve)tags.push('<span class="tg info">ควรจอง</span>');
    if(o.last)tags.push('<span class="tg">เข้าถึง '+o.last+'</span>');
    if(!pv&&o.q)tags.push('<a class="map-a" href="'+MV.searchUrl(o.q)+'" target="_blank" rel="noopener">แผนที่ ↗</a>');
    return '<label class="opt"><input type="'+(s.pick==='one'?'radio':'checkbox')+'" name="'+(pv?pv+'-':'')+s.id+'" value="'+o.id+'"'+(pv?'':' data-slot="'+s.id+'"')+(on?' checked':'')+'><div class="card"><span class="n">'+esc(o.n)+'</span>'+(o.note&&!pv?'<span class="nt">'+esc(o.note)+'</span>':'')+(pv?'':'<span class="tags">'+tags.join('')+'</span>')+'</div></label>';
  }
  function slots(d,is,pv){
    return '<section class="slots">'+d.slots.map(s=>{
      const on=E.selected(s,sel).map(o=>o.id),dur=E.slotDur(s,sel),st=E.mins(s.time),mine=pv?[]:is.filter(i=>i.slotId===s.id);
      const t=s.time+(dur?'<small>'+E.hhmm(st+dur)+'</small>':'');
      return '<article class="slot"'+(pv?'':' id="'+s.id+'"')+'><div class="time">'+t+'<span class="node">'+icon(s.kind)+'</span></div>'+
        '<div class="body"><div class="st"><span class="tpill">'+s.time+(dur?' → '+E.hhmm(st+dur):'')+'</span><h4>'+esc(s.title)+'</h4>'+(pv?'':'<span class="chip">'+(KIND[s.kind]||s.kind)+(s.opts.length>1?' · '+(s.pick==='one'?'เลือก 1':'เลือกได้หลายอย่าง'):'')+'</span>')+'</div>'+
        '<div class="opts">'+s.opts.map(o=>opt(s,o,on.indexOf(o.id)>-1,pv)).join('')+'</div>'+(mine.length?'<div class="slot-iss">'+mine.map(i=>'<div class="si '+i.level+'">'+esc(i.msg)+'</div>').join('')+'</div>':'')+'</div></article>';
    }).join('')+'</section>';
  }
  let lastKey='';
  function day(full){
    const d=trip.days[cur],is=E.analyze(trip,d,sel),key=d.id+'|'+JSON.stringify(MV.lineCoords(MV.stops(trip,d,sel)));
    const main=strip(d,is)+issBox(is)+slots(d,is);
    if(!full&&key===lastKey&&$('.maincol')){$('.maincol').innerHTML=main}
    else{
      $('#day').innerHTML='<div class="dhead"><span class="lbl">Day '+pad(d.n)+' · '+dstr(d)+'</span><h2>'+esc(d.label)+'</h2>'+
        '<div class="meta"><span>เส้นทาง <b>'+esc(d.route)+'</b></span><span>พัก <b>'+esc(d.night)+'</b></span></div>'+
        '<div class="wx">'+d.weather.map(w=>'<div class="'+(w.s==='warn'?'warn':'')+'">'+esc(w.t)+'</div>').join('')+'</div></div>'+
        '<div class="dcols"><div class="mapcol">'+gmCol(d)+'</div><div class="maincol">'+main+'</div></div>';
      mountMap();lastKey=key;
    }
    const c={err:0,warn:0,info:0};is.forEach(i=>{c[i.level]++});
    $('#sr').textContent='DAY '+d.n+': ผิดพลาด '+c.err+' เตือน '+c.warn+' แจ้ง '+c.info;
  }
  function render(focusKey,full){
    head();tabs();day(full);gallery();
    if(focusKey){const el=document.querySelector('input[data-slot="'+focusKey[0]+'"][value="'+focusKey[1]+'"]');if(el)el.focus({preventScroll:true})}
  }
  function go(i,slot){
    const nc=Math.max(0,Math.min(N-1,i));if(nc!==cur)gm=-1;cur=nc;
    try{history.replaceState(null,'','#d'+(cur+1))}catch(e){location.hash='d'+(cur+1)}
    render(null,!slot);
    if(slot){const el=document.getElementById(slot);if(el){el.scrollIntoView({block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1400)}}
  }
  function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.hidden=true},1800)}
  function planText(ds){
    return ds.map(d=>{
      const lines=['DAY '+d.n+' · '+dstr(d)+' · '+d.label,'พัก: '+d.night];
      d.slots.forEach(s=>{const o=E.selected(s,sel).filter(x=>!x.skip);if(o.length)lines.push(s.time+'  '+s.title+': '+o.map(x=>x.n).join(' + '))});
      const st=MV.stops(trip,d,sel);if(st.length>1)lines.push('เส้นทาง: '+MV.dirUrl(st));
      const is=E.analyze(trip,d,sel).filter(i=>i.level!=='info');
      if(is.length){lines.push('— ข้อควรตรวจ —');is.forEach(i=>lines.push('• '+i.msg))}
      return lines.join('\n')}).join('\n\n');
  }
  function copy(text){
    function fb(){const w=document.createElement('div');w.className='fb';w.innerHTML='<div class="sub">คัดลอกอัตโนมัติไม่ได้ — เลือกข้อความด้านล่างแล้วกดคัดลอก</div><textarea readonly></textarea>';w.querySelector('textarea').value=text;$('#day').prepend(w);const t=w.querySelector('textarea');t.focus();t.select()}
    try{navigator.clipboard.writeText(text).then(()=>toast('คัดลอกแล้ว'),fb)}catch(e){fb()}
  }
  function pick(id){root.dataset.style=id;ls.set('japan2569.style',id);gallery();
    if(map&&mapReady)map.setPaintProperty('route','line-color',getComputedStyle(root).getPropertyValue('--route').trim());}

  document.addEventListener('click',e=>{
    if(e.target.closest('a'))return;
    const pk=e.target.closest('[data-pick]');if(pk){pick(pk.dataset.pick);return}
    const st=e.target.closest('[data-step]');if(st){go(cur+(+st.dataset.step));return}
    const g2=e.target.closest('[data-gm]');if(g2){setGm(+g2.dataset.gm);return}
    const t=e.target.closest('.tab');if(t){go(+t.dataset.i);return}
    const g=e.target.closest('[data-go]');if(g){const id=g.dataset.go;let di=-1;trip.days.forEach((d,i)=>{if(d.slots.some(s=>s.id===id))di=i});if(di>-1)go(di,id);return}
    if(e.target.id==='cpDay')copy(planText([trip.days[cur]]));
    if(e.target.id==='cpAll')copy(planText(trip.days));
    if(e.target.id==='reset'){const b=e.target;
      if(b.dataset.arm){clearTimeout(resetT);delete b.dataset.arm;b.textContent='รีเซ็ตตัวเลือก';sel={};save();render(null,true);toast('รีเซ็ตแล้ว')}
      else{b.dataset.arm='1';b.textContent='แตะอีกครั้งเพื่อรีเซ็ต';resetT=setTimeout(()=>{delete b.dataset.arm;b.textContent='รีเซ็ตตัวเลือก'},3000)}}
    if(e.target.id==='theme'){root.dataset.mode=root.dataset.mode==='dark'?'light':'dark';ls.set('japan2569.mode',root.dataset.mode);if(map&&mapReady)map.setPaintProperty('route','line-color',getComputedStyle(root).getPropertyValue('--route').trim())}
  });
  document.addEventListener('change',e=>{
    const i=e.target;if(!i.dataset||!i.dataset.slot)return;
    let s=null;trip.days.forEach(d=>{d.slots.forEach(x=>{if(x.id===i.dataset.slot)s=x})});
    if(s.pick==='one')sel[s.id]=[i.value];
    else{const c2=E.selected(s,sel).map(o=>o.id),k=c2.indexOf(i.value);if(k>-1)c2.splice(k,1);else c2.push(i.value);sel[s.id]=c2}
    save();const y=window.scrollY;render([s.id,i.value]);window.scrollTo(0,y);
  });
  document.addEventListener('keydown',e=>{
    const gc=e.target.closest&&e.target.closest('[data-pick]');
    if(gc&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pick(gc.dataset.pick);document.querySelector('[data-pick="'+gc.dataset.pick+'"]').focus();return}
    const t=e.target.closest&&e.target.closest('.tab');if(!t)return;
    const i=+t.dataset.i,j=e.key==='ArrowRight'?(i+1)%N:e.key==='ArrowLeft'?(i+N-1)%N:e.key==='Home'?0:e.key==='End'?N-1:-1;
    if(j<0)return;e.preventDefault();go(j);const el=document.getElementById('tab'+j);if(el)el.focus();
  });
  const fromHash=()=>{const m=/^#d(\d)$/.exec(location.hash);if(m&&trip.days[+m[1]-1])cur=+m[1]-1};
  window.addEventListener('hashchange',()=>{fromHash();render(null,true)});
  fromHash();render(null,true);
})();
</script>
</body>
</html>
