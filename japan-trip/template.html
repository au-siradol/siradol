<!doctype html>
<html lang="th" data-style="paper" data-mode="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Japan 2569 Itinerary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Thai: Sukhumvit Set (local install; IBM Plex Sans Thai is the web fallback). */
@font-face{font-family:'Sukhumvit Set';font-weight:400;src:local('Sukhumvit Set'),local('SukhumvitSet-Text'),local('Sukhumvit Set Text')}
@font-face{font-family:'Sukhumvit Set';font-weight:500;src:local('Sukhumvit Set Medium'),local('SukhumvitSet-Medium')}
@font-face{font-family:'Sukhumvit Set';font-weight:600;src:local('Sukhumvit Set SemiBold'),local('SukhumvitSet-SemiBold')}
@font-face{font-family:'Sukhumvit Set';font-weight:700;src:local('Sukhumvit Set Bold'),local('SukhumvitSet-Bold')}

/* ===== style tokens: A paper · B soft · C doodle ===== */
[data-style]{--th:'Sukhumvit Set','Sukhumvit','IBM Plex Sans Thai','Noto Sans Thai',sans-serif;
  --err:#b3261e;--err-soft:#f9dfdc;--warn:#8a5a00;--warn-soft:#fbecc8;--info:#3a5a9b;--info-soft:#dde6f6;
  --nap:#e6daf2;--move:#9aa5bd;--eat:#e0954f;--see:#3fae92;--stay:#6d7aa6}
[data-style="paper"]{--bg:#f2efe8;--paper:#f2efe8;--surface:transparent;--ink:#1c1b19;--mute:#5d5a52;--rule:#cdc8ba;--rule2:#e2ddd0;
  --accent:#1c1b19;--accent-ink:#f2efe8;--accent-soft:#e6e1d3;--font:'Courier Prime','Courier New',ui-monospace,monospace,var(--th);
  --r:3px;--time-w:92px;--rail-w:30px;--gap:10px;--eat:#c98a52;--see:#5d917f;--move:#a19f96;--stay:#7c7aa0}
[data-style="soft"]{--bg:#e2e2e2;--paper:#ffffff;--surface:#f1f1f1;--ink:#141414;--mute:#666;--rule:#d7d7d7;--rule2:#ececec;
  --accent:#1f74ba;--accent-ink:#fff;--accent-soft:#e4f0fa;--font:'Inter',system-ui,-apple-system,'Segoe UI',var(--th);
  --r:22px;--time-w:0px;--rail-w:34px;--gap:12px}
[data-style="doodle"]{--bg:#dcdcde;--paper:#dcdcde;--surface:transparent;--ink:#2511c7;--mute:#4f45b0;--rule:#a9a3dc;--rule2:#c7c3e6;
  --accent:#2511c7;--accent-ink:#ececf2;--accent-soft:#cfcbee;--font:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace,var(--th);
  --r:14px;--time-w:70px;--rail-w:28px;--gap:10px;--eat:#7b6ee0;--see:#2511c7;--move:#a39de0;--stay:#5446d6;--nap:#c9c3f0}
[data-mode="dark"] [data-style],[data-mode="dark"][data-style]{
  --err:#ff8a80;--err-soft:#3b1f1d;--warn:#f2c36b;--warn-soft:#362b14;--info:#8fb1f0;--info-soft:#1d2a45;--nap:#35284a;--move:#69729a;--eat:#c27a3a;--see:#3f8c82;--stay:#8a86c2}
[data-mode="dark"] [data-style="paper"],[data-mode="dark"][data-style="paper"]{--bg:#1b1a17;--paper:#1b1a17;--ink:#ebe6d9;--mute:#a7a193;--rule:#3d3a32;--rule2:#2b2924;--accent:#ebe6d9;--accent-ink:#1b1a17;--accent-soft:#2c2a24}
[data-mode="dark"] [data-style="soft"],[data-mode="dark"][data-style="soft"]{--bg:#0f0f10;--paper:#1c1c1e;--surface:#2a2a2d;--ink:#f2f2f2;--mute:#a1a1a6;--rule:#3a3a3e;--rule2:#2c2c2f;--accent:#64b2f0;--accent-ink:#0b1622;--accent-soft:#1d2d3c}
[data-mode="dark"] [data-style="doodle"],[data-mode="dark"][data-style="doodle"]{--bg:#15132c;--paper:#15132c;--ink:#bdb6ff;--mute:#9d95ee;--rule:#3b3670;--rule2:#25214a;--accent:#bdb6ff;--accent-ink:#15132c;--accent-soft:#2a2558}
[data-mode="dark"]{color-scheme:dark}

/* ===== shared structure ===== */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;padding:20px 16px 64px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt input:focus-visible+.card{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{border:1.5px solid var(--ink);background:transparent;padding:6px 14px;font-size:13px;border-radius:999px;min-height:36px}
.btn.pri{background:var(--ink);color:var(--bg);text-decoration:none;display:inline-flex;align-items:center}
.btn:hover{background:var(--accent-soft)}.btn.pri:hover{opacity:.9;background:var(--ink)}

.tb{display:flex;flex-direction:column;gap:4px;position:relative}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
h1{font-size:clamp(28px,5vw,42px);line-height:1.1;margin:4px 0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.gnome,.dandelion{display:none}
.rules{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:2px}

/* style gallery */
.gallery{border:1.5px dashed var(--rule);border-radius:16px;padding:10px 14px}
.gallery summary{cursor:pointer;font-weight:600;font-size:14px}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.gcard{border:2px solid var(--rule);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:transparent}
.gcard[aria-checked="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
.gl{font-weight:700;font-size:14px}.gd{font-size:12.5px;color:var(--mute)}
.gcard .chk{font-size:12px;font-weight:600}
.pv{height:250px;overflow:hidden;border-radius:10px;padding:12px;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;pointer-events:none;
  -webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}
.pv .pvh{font-weight:700;margin-bottom:6px}.pv .pvh span{display:block;font-weight:400;color:var(--mute);font-size:12px}
.pv .opts{grid-template-columns:1fr}
@media(max-width:760px){.gal{grid-template-columns:1fr}.pv{height:200px}}

/* day nav */
.deckbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.prog{display:flex;align-items:center;gap:12px;font-weight:600}
.ring{width:42px;height:42px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:3}.ring .trk{stroke:var(--rule)}.ring .arc{stroke:var(--ink);stroke-linecap:round;stroke-dasharray:113.1;transition:stroke-dashoffset .25s}
.steps{display:flex;gap:8px}
.ico{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;display:grid;place-items:center;padding:0}
.ico:disabled{opacity:.3;cursor:default}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px}
.tab{flex:0 0 auto;border:1.5px solid var(--rule);background:transparent;border-radius:12px;padding:5px 24px 6px 12px;text-align:left;min-width:74px;position:relative}
.tab .n{font-size:11px;color:var(--mute);letter-spacing:.06em}.tab .d{font-weight:700;font-size:14px}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.tab[aria-selected=true] .n{color:inherit;opacity:.75}
.dot{position:absolute;top:5px;right:5px;width:15px;height:15px;border-radius:50%;font:700 9px/15px system-ui,sans-serif;text-align:center;color:#fff}
.dot.err{background:var(--err)}.dot.warn{background:var(--warn)}.dot.pass{background:var(--see)}

/* day */
.dayc{display:flex;flex-direction:column;gap:18px;min-width:0}
.dhead{display:flex;flex-direction:column;gap:6px}
.dhead h2{font-size:clamp(22px,4vw,32px);line-height:1.15;margin:0;font-weight:700}
.dsub{color:var(--mute);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13.5px;color:var(--mute)}.meta b{color:var(--ink);font-weight:600}
.wx{display:flex;flex-direction:column;gap:6px}
.note{font-size:13.5px;padding:7px 12px;border-left:3px solid var(--info);background:var(--info-soft);border-radius:0 var(--r) var(--r) 0}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.dcols{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.mapcol,.maincol{display:flex;flex-direction:column;gap:14px;min-width:0}
@media(min-width:920px){.dcols{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:28px}.mapcol{position:sticky;top:12px;align-self:start}}

/* google map */
.gm{display:flex;flex-direction:column;gap:10px}
.gm-bar{display:flex;flex-wrap:wrap;gap:6px}
.gm-chip{border:1.5px solid var(--rule);background:transparent;border-radius:999px;padding:3px 10px;font-size:13px;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.gm-chip[aria-pressed=true]{border-color:var(--ink);background:var(--accent-soft)}
.gm-frame{position:relative;aspect-ratio:4/3;min-height:280px;border:1.5px solid var(--ink);border-radius:var(--r);overflow:hidden;background:var(--rule2)}
.gm-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.gm-act{display:flex;flex-wrap:wrap;gap:8px}
.gm-note{margin:0;font-size:12px;color:var(--mute)}
.pin{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font:700 12px/24px system-ui,sans-serif;text-align:center;flex:0 0 auto;display:inline-block}
.pin.hotel{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.gm-chip .pin{width:20px;height:20px;line-height:20px;font-size:11px}
.lg{list-style:none;margin:0;padding:0}
.lg li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--rule2)}
.lg li:first-child{border-top:0}
.lg li.on .lg-go .lg-n{text-decoration:underline;text-underline-offset:3px}
.lg button{border:0;background:none;padding:2px 0;text-align:left;min-width:0}
.lg .pinb{padding:0}
.lg-n{font-size:14px;font-weight:600;overflow-wrap:anywhere}.lg-t{font-size:12px;color:var(--mute)}
.lg-jump{font-size:12px;color:var(--mute);white-space:nowrap}
.lg a{font-size:12px;white-space:nowrap}

/* strip + issues */
.strip,.iss{border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px 8px;background:var(--surface)}
.strip h3{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 6px;font-weight:600}
.bar{position:relative;height:28px;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/15 - 1px),var(--rule2) calc(100%/15 - 1px) calc(100%/15));border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.nap{position:absolute;top:0;bottom:0;background:var(--nap)}
.seg{position:absolute;top:5px;bottom:5px;min-width:2px;border-radius:2px;border:0;padding:0;cursor:pointer}
.seg.move{background:var(--move)}.seg.eat{background:var(--eat)}.seg.see{background:var(--see)}.seg.stay{background:var(--stay)}
.seg.err{outline:2px solid var(--err);outline-offset:1px}.seg.warn{outline:2px solid var(--warn);outline-offset:1px}
.ticks{position:relative;height:16px;margin-top:2px;font-size:10.5px;color:var(--mute)}
.ticks span{position:absolute;transform:translateX(-50%)}.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;border-radius:2px}
.iss{padding:0;overflow:hidden}
.iss h3{margin:0;padding:8px 12px;font-size:14px;border-bottom:1px solid var(--rule2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cnt{font-size:12px;padding:1px 8px;border-radius:9px;font-weight:500}
.cnt.err{background:var(--err-soft);color:var(--err)}.cnt.warn{background:var(--warn-soft);color:var(--warn)}.cnt.info{background:var(--info-soft);color:var(--info)}
.iss ul{list-style:none;margin:0;padding:4px 0;max-height:240px;overflow:auto}
.iss li button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;padding:5px 12px;font-size:13.5px}
.lv{flex:0 0 auto;font:700 10px system-ui,sans-serif;padding:2px 6px;border-radius:3px;margin-top:3px;color:#fff}
.lv.err{background:var(--err)}.lv.warn{background:var(--warn)}.lv.info{background:var(--info)}
[data-mode="dark"] .lv,[data-mode="dark"] .dot{color:#111}
.ok{padding:10px 12px;font-size:14px;display:flex;align-items:center;gap:10px}

/* timeline of slots */
.slots{position:relative;display:flex;flex-direction:column}
.slot{position:relative;display:grid;grid-template-columns:var(--time-w) var(--rail-w) minmax(0,1fr);grid-template-areas:"time rail body";column-gap:var(--gap);padding:12px 0;scroll-margin-top:12px}
.time{grid-area:time;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.time small{display:block;font-weight:400;font-size:11.5px;color:var(--mute)}
.rail{grid-area:rail;position:relative;display:flex;justify-content:center}
.node{position:relative;z-index:1;display:grid;place-items:center}
.node .ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.body{grid-area:body;display:flex;flex-direction:column;gap:8px;min-width:0}
.st{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.st h4{font-size:15.5px;margin:0;font-weight:700}
.chip{font-size:11px;letter-spacing:.06em;color:var(--mute);border:1px solid var(--rule);border-radius:999px;padding:0 8px}
.pk{font-size:12px;color:var(--mute)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.opt{display:block;min-width:0;position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%;z-index:2}
.card{position:relative;height:100%;display:flex;flex-direction:column;gap:3px;padding:8px 11px;border-radius:calc(var(--r) * .7)}
.card .n{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.card .nt{font-size:12.5px;color:var(--mute)}
.tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tg{font-size:11px;padding:0 7px;border-radius:999px;border:1px solid var(--rule)}
.tg.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}.tg.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.map-a{position:relative;z-index:3;font-size:12px;margin-left:auto;white-space:nowrap}
.slot-iss{display:flex;flex-direction:column;gap:3px}
.si{font-size:13px;padding:3px 10px;border-left:3px solid var(--info);background:var(--info-soft)}
.si.warn{border-color:var(--warn);background:var(--warn-soft)}.si.err{border-color:var(--err);background:var(--err-soft)}
.slot.flash{background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;font-size:13px;border-radius:999px;z-index:10}
.fb textarea{width:100%;height:160px;font:12px ui-monospace,monospace;background:var(--paper);color:var(--ink);border:1px solid var(--rule)}
@media(max-width:600px){
  body{padding-inline:12px}
  .slot{grid-template-columns:var(--rail-w) minmax(0,1fr);grid-template-areas:"rail time" "rail body"}
  .time{display:flex;gap:8px;align-items:baseline}.time small{display:inline}
}

/* ===== A · Paper timeline (typewriter CV) ===== */
[data-style="paper"] .tb{align-items:center;text-align:center;padding:24px 0 8px}
[data-style="paper"] h1{font-weight:700;letter-spacing:.02em}
[data-style="paper"] .tools{justify-content:center}
[data-style="paper"] .slots::before,[data-style="doodle"] .slots::before{content:"";position:absolute;top:6px;bottom:6px;width:20px;pointer-events:none;background:var(--ink);
  left:calc(var(--time-w) + var(--gap) + var(--rail-w) / 2 - 10px);
  -webkit-mask:var(--spine) repeat-y center top/20px 300px;mask:var(--spine) repeat-y center top/20px 300px}
[data-style="paper"] .time{text-align:right;font-weight:400}
[data-style="paper"] .node{width:12px;height:12px;border-radius:50%;background:var(--ink);margin-top:7px;box-shadow:0 0 0 5px var(--bg)}
[data-style="paper"] .node .ic,[data-style="doodle"] .node .ic{display:none}
[data-style="paper"] .opts{display:flex;flex-direction:column;gap:0}
[data-style="paper"] .card{padding:5px 0 5px 22px;border-radius:0;border-bottom:1px dotted var(--rule)}
[data-style="paper"] .card::before{content:"";position:absolute;left:2px;top:11px;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink)}
[data-style="paper"] .opt input:checked+.card::before{background:var(--ink)}
[data-style="paper"] .card .n{font-weight:400}
[data-style="paper"] .opt input:checked+.card .n{font-weight:700}
[data-style="paper"] .chip{border-radius:0}
[data-style="paper"] .gm-frame iframe{filter:grayscale(.9) contrast(1.05)}
[data-style="paper"] .note{border-radius:0}

/* ===== B · Soft cards ===== */
[data-style="soft"] .dayc{background:var(--paper);border-radius:36px;padding:26px}
[data-style="soft"] .tb{background:var(--paper);border-radius:36px;padding:24px 26px}
[data-style="soft"] .btn{border-width:1px;border-color:var(--rule)}[data-style="soft"] .btn.pri{border-color:var(--ink)}
[data-style="soft"] .tab{border-radius:999px}
[data-style="soft"] .slots{gap:12px}
[data-style="soft"] .slot{background:var(--surface);border-radius:26px;padding:16px 18px;grid-template-columns:var(--rail-w) minmax(0,1fr);grid-template-areas:"rail time" "rail body";row-gap:8px}
[data-style="soft"] .time{display:inline-flex;align-items:center;gap:6px;justify-self:start;background:var(--paper);border-radius:999px;padding:2px 12px;font-weight:600;font-size:14px}
[data-style="soft"] .time small{display:inline;font-size:12px}
[data-style="soft"] .node{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:var(--surface)}
[data-style="soft"] .slot:first-child .node{border-style:dashed}
[data-style="soft"] .slot:last-child .node{background:var(--ink);color:var(--surface)}
[data-style="soft"] .rail::after{content:"";position:absolute;left:50%;top:36px;bottom:4px;border-left:2px dashed var(--ink);opacity:.55}
[data-style="soft"] .card{background:var(--paper);border:2px solid transparent;border-radius:16px}
[data-style="soft"] .opt input:checked+.card{border-color:var(--ink)}
[data-style="soft"] .opt input:checked+.card .n::after{content:" ✓"}
[data-style="soft"] .tg{border-color:var(--rule)}
[data-style="soft"] .strip,[data-style="soft"] .iss{background:var(--surface);border-color:transparent;border-radius:20px}
[data-style="soft"] .gm-frame{border:0;border-radius:24px}
[data-style="soft"] .lg li{border-top:0;background:var(--surface);border-radius:16px;padding:6px 10px;margin-top:6px}
[data-style="soft"] .note{border-radius:14px;border-left-width:0}
[data-style="soft"] .slot.flash{outline:2px solid var(--accent)}
@media(max-width:600px){[data-style="soft"] .dayc,[data-style="soft"] .tb{border-radius:26px;padding:16px}[data-style="soft"] .slot{padding:14px 12px}}

/* ===== C · Doodle (indigo ink) ===== */
[data-style="doodle"] .gnome{display:block;position:absolute;right:0;top:0;width:96px;height:120px;color:var(--ink);background:none;border:0;padding:0}
[data-style="doodle"] .gnome svg,[data-style="doodle"] .dandelion svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
[data-style="doodle"] .dandelion{display:block;width:40px;height:50px;color:var(--ink);flex:0 0 auto}
[data-style="doodle"] .tb{padding-right:110px;min-height:120px}
[data-style="doodle"] h1{font-weight:600}
[data-style="doodle"] .sub,[data-style="doodle"] .eyebrow{color:var(--mute)}
[data-style="doodle"] .btn,[data-style="doodle"] .tab,[data-style="doodle"] .ico,[data-style="doodle"] .gm-chip{border-width:2px;border-color:var(--ink)}
[data-style="doodle"] .time{font-weight:600}
[data-style="doodle"] .node{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--ink);background:var(--bg);margin-top:5px;filter:url(#wobble)}
[data-style="doodle"] .card::before{content:"";position:absolute;inset:0;border:2px solid var(--ink);border-radius:12px;filter:url(#wobble);pointer-events:none}
[data-style="doodle"] .opt input:checked+.card{background:var(--ink);color:var(--accent-ink);border-radius:12px}
[data-style="doodle"] .opt input:checked+.card .nt,[data-style="doodle"] .opt input:checked+.card .tg{color:inherit;border-color:currentColor}
[data-style="doodle"] .opt input:checked+.card .map-a{color:inherit}
[data-style="doodle"] .strip,[data-style="doodle"] .iss,[data-style="doodle"] .gm-frame{border:2px solid var(--ink)}
[data-style="doodle"] .gm-frame iframe{filter:grayscale(1) contrast(1.05)}
[data-style="doodle"] .note{background:transparent;border-left-width:4px}
@media(max-width:600px){[data-style="doodle"] .tb{padding-right:80px}[data-style="doodle"] .gnome{width:72px;height:90px}}
</style>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter></svg>
<div class="wrap">
  <header class="tb">
    <div class="eyebrow" id="eb"></div>
    <h1 id="ttl"></h1>
    <div class="sub" id="sub"></div>
    <div class="tools">
      <button class="btn pri" id="cpDay">คัดลอกแผนวันนี้</button>
      <button class="btn" id="cpAll">คัดลอกทั้งทริป</button>
      <button class="btn" id="reset">รีเซ็ตตัวเลือก</button>
      <button class="btn" id="theme" aria-label="สลับโหมดสว่าง/มืด">◐</button>
    </div>
    <button class="gnome" data-step="1" aria-label="แตะคนแคระเพื่อไปวันถัดไป" title="tap the gnome to continue"><svg viewBox="0 0 120 150"><path d="M60 6L83 56H37Z"/><path d="M50 40l18-6M47 49l24-7"/><path d="M33 56H87"/><path d="M42 56v20q0 10 18 10t18-10V56"/><circle cx="52" cy="67" r="1.5"/><circle cx="68" cy="67" r="1.5"/><path d="M40 78q-4 22 10 32l6-8 6 10 7-9 7 6q10-10 4-31"/><path d="M38 108v22h44v-22"/><path d="M48 130v14h-9M72 130v14h9"/></svg></button>
  </header>
  <div class="rules" id="rules"></div>
  <details class="gallery" id="gallery" open><summary>เลือกสไตล์หน้าตา (3 แบบ — ดูตัวอย่างจากวันนี้)</summary><div class="gal" role="radiogroup" aria-label="สไตล์" id="gal"></div></details>
  <div class="deckbar">
    <div class="prog"><svg class="ring" viewBox="0 0 44 44" aria-hidden="true"><circle class="trk" cx="22" cy="22" r="18"/><circle class="arc" id="ring" cx="22" cy="22" r="18"/></svg><span id="cnt"></span></div>
    <div class="steps">
      <button class="ico" id="prev" data-step="-1" aria-label="วันก่อนหน้า"><svg viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6"/></svg></button>
      <button class="ico" id="next" data-step="1" aria-label="วันถัดไป"><svg viewBox="0 0 20 20"><path d="M8 4l6 6-6 6"/></svg></button>
    </div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <main id="day" class="dayc" role="tabpanel" tabindex="-1"></main>
  <div id="sr" class="sr" aria-live="polite"></div>
</div>
<div id="toast" class="toast" hidden></div>

<script id="trip" type="application/json">{{TRIP}}</script>
<script>{{ENGINE}}</script>
<script>{{MAP}}</script>
<script>
(function(){
  const E=window.Engine, MV=window.MapView, trip=JSON.parse(document.getElementById('trip').textContent);
  const KEY='japan2569.sel.'+(trip.meta.version||'v1'), N=trip.days.length, root=document.documentElement;
  const STYLES=[
    {id:'paper',l:'A · Paper timeline',d:'กระดาษพิมพ์ดีด เส้นเวลาวาดมือ ตัวเลือกเป็นรายการ — อ่านง่าย พิมพ์ได้'},
    {id:'soft',l:'B · Soft cards',d:'การ์ดมุมมน พื้นเทา ไอคอนตามประเภท เส้นประเชื่อมจุด — แบบแอปจองเดินทาง'},
    {id:'doodle',l:'C · Doodle',d:'หมึกคราม ลายเส้นสั่นแบบวาดมือ มีคนแคระเป็นปุ่มไปวันถัดไป'}];
  const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  let sel={}, cur=0, resetT, gm=-1, lastSig='', curStops=[];
  try{sel=JSON.parse(ls.get(KEY)||'{}')||{}}catch(e){sel={}}
  const save=()=>ls.set(KEY,JSON.stringify(sel));
  root.dataset.style=STYLES.some(s=>s.id===ls.get('japan2569.style'))?ls.get('japan2569.style'):'paper';
  root.dataset.mode=ls.get('japan2569.mode')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const $=s=>document.querySelector(s);
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const pad=n=>String(n).padStart(2,'0');
  const GROUP={arrival:'move',drive:'move',nap:'move',rest:'move',refuel:'move',car:'move',carreturn:'move',flight:'move',transit:'move',move:'move',meal:'eat',cafe:'eat',see:'see',arch:'see',shop:'see',spa:'see',hotel:'stay'};
  const KIND={arrival:'ถึง',hotel:'โรงแรม',meal:'มื้ออาหาร',drive:'ขับรถ',nap:'ขับ·นอน',rest:'พัก',see:'เที่ยว',arch:'สถาปัตย์',cafe:'คาเฟ่',shop:'ช้อป',refuel:'เติมน้ำมัน',car:'รถเช่า',carreturn:'คืนรถ',flight:'เที่ยวบิน',spa:'ออนเซ็น',transit:'เดินทาง',move:'เดินทาง'};
  const PLANE='M21 16v-2l-8-5V4.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z';
  const CAR='M4 15v-3l2-5h12l2 5v3M4 15h16v3h-3v-2M4 15v3h3v-2M7.5 12h9';
  const ICON={arrival:PLANE,flight:PLANE,transit:PLANE,move:CAR,drive:CAR,nap:CAR,car:CAR,carreturn:CAR,
    meal:'M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-2.5 5-2.5 8H17v10',
    cafe:'M5 8h11v6a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V8zM16 9h2a2.5 2.5 0 0 1 0 5h-2',
    hotel:'M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5',
    rest:'M7 21V4h6a4 4 0 0 1 0 8H7',
    see:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z',
    arch:'M4 21V8l8-5 8 5v13M9 21v-6h6v6M3 21h18',
    shop:'M5 8h14l-1 12H6L5 8zM9 8a3 3 0 0 1 6 0',
    refuel:'M5 21V4h9v17M3 21h13M5 10h9M14 8l3 2v8a1.5 1.5 0 0 0 3 0v-7l-2-2',
    spa:'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z'};
  const icon=k=>'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="'+(ICON[k]||'M12 8v8M8 12h8')+'"/></svg>';
  const MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'],MONEN=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const DOWF=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'],DOWEN=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const dstr=d=>{const p=d.date.split('-');return DOWF[E.dowOf(d)]+' '+(+p[2])+' '+MON[+p[1]-1]};
  const dEn=d=>{const p=d.date.split('-');return DOWEN[E.dowOf(d)]+' '+(+p[2])+' '+MONEN[+p[1]-1]+' '+p[0]};
  const worst=is=>is.some(i=>i.level==='err')?'err':is.some(i=>i.level==='warn')?'warn':'ok';
  const DANDELION='<span class="dandelion" aria-hidden="true"><svg viewBox="0 0 90 110"><circle cx="45" cy="10" r="1.6"/><circle cx="32" cy="16" r="1.6"/><circle cx="58" cy="16" r="1.6"/><circle cx="26" cy="28" r="1.6"/><circle cx="64" cy="28" r="1.6"/><circle cx="38" cy="26" r="1.6"/><circle cx="52" cy="26" r="1.6"/><circle cx="45" cy="36" r="1.6"/><circle cx="32" cy="40" r="1.6"/><circle cx="58" cy="40" r="1.6"/><path d="M45 48v52M45 100L26 88l-4 8-10-2 12 8zM45 100l18-16 2 8 12-4-10 12z"/></svg></span>';

  // hand-drawn spine: a seeded wobbly line used as a CSS mask, tiles seamlessly every 300px
  (function(){
    let s=11;const rnd=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296};
    const n=12,p=[];for(let i=0;i<=n;i++){const k=(i===0||i===n)?0:(i===1||i===n-1)?1.2:6;p.push([10+(rnd()-.5)*k,i*300/n])}
    const g=i=>p[Math.max(0,Math.min(n,i))];let d='M'+p[0][0].toFixed(1)+',0';
    for(let i=0;i<n;i++){const a=g(i-1),b=g(i),c=g(i+1),e=g(i+2);d+='C'+(b[0]+(c[0]-a[0])/6).toFixed(1)+','+(b[1]+(c[1]-a[1])/6).toFixed(1)+' '+(c[0]-(e[0]-b[0])/6).toFixed(1)+','+(c[1]-(e[1]-b[1])/6).toFixed(1)+' '+c[0].toFixed(1)+','+c[1].toFixed(1)}
    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="20" height="300" viewBox="0 0 20 300"><path d="'+d+'" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/></svg>';
    root.style.setProperty('--spine','url("data:image/svg+xml,'+encodeURIComponent(svg)+'")');
  })();

  function head(){
    $('#eb').textContent='Itinerary · '+N+' days · '+trip.days[0].date.slice(8)+'–'+trip.days[N-1].date.slice(8)+'.10.2026';
    $('#ttl').textContent=trip.meta.title;
    $('#sub').textContent=trip.meta.subtitle+' · '+trip.meta.party;
    $('#rules').innerHTML=trip.meta.rules.map(r=>'<div>• '+esc(r)+'</div>').join('');
  }
  function deck(){
    $('#cnt').textContent=pad(cur+1)+' / '+pad(N);
    $('#ring').style.strokeDashoffset=(113.1*(1-(cur+1)/N)).toFixed(1);
    $('#prev').disabled=cur===0;$('#next').disabled=cur===N-1;
  }
  function tabs(){
    const box=$('#tabs'),sx=box.scrollLeft;
    box.innerHTML=trip.days.map((d,i)=>{
      const w=worst(E.analyze(trip,d,sel)),p=d.date.split('-');
      return '<button class="tab" role="tab" id="tab'+i+'" aria-controls="day" tabindex="'+(i===cur?0:-1)+'" aria-selected="'+(i===cur)+'" aria-label="วันที่ '+d.n+' · '+(w==='err'?'มีข้อขัดแย้ง':w==='warn'?'มีข้อควรระวัง':'ผ่าน')+'" data-i="'+i+'"><span class="dot '+(w==='ok'?'pass':w)+'" aria-hidden="true">'+(w==='err'?'✕':w==='warn'?'!':'✓')+'</span><div class="n">D'+d.n+' · '+E.DOW[E.dowOf(d)]+'</div><div class="d">'+(+p[2])+' ต.ค.</div></button>';
    }).join('');
    box.scrollLeft=sx;const on=box.querySelector('[aria-selected=true]');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'nearest'});
  }
  function gallery(){
    const d=trip.days[cur],is=E.analyze(trip,d,sel),mini={...d,slots:d.slots.slice(0,4)};
    $('#gal').innerHTML=STYLES.map(s=>{
      const on=root.dataset.style===s.id;
      return '<div class="gcard" role="radio" tabindex="'+(on?0:-1)+'" aria-checked="'+on+'" data-pick="'+s.id+'"><span class="gl">'+s.l+'</span><span class="gd">'+s.d+'</span>'+
        '<div class="pv" data-style="'+s.id+'" inert><div class="pvh">D'+d.n+' · '+dEn(d)+'<span>'+esc(d.label)+'</span></div>'+slots(mini,is,true)+'</div>'+
        '<span class="chk">'+(on?'✓ ใช้อยู่':'แตะเพื่อใช้แบบนี้')+'</span></div>';
    }).join('');
  }
  function strip(d,is){
    const A=E.mins(trip.meta.dayStart),B=E.mins(trip.meta.dayEnd),W=B-A,pcn=m=>Math.min(100,Math.max(0,(m-A)/W*100)),pc=m=>pcn(m).toFixed(2);
    const bad={};is.forEach(i=>{if(i.slotId&&(i.level==='err'||bad[i.slotId]!=='err'&&i.level==='warn'))bad[i.slotId]=i.level});
    const segs=d.slots.map(s=>{const dur=E.slotDur(s,sel);if(!dur)return '';const st=E.mins(s.time);
      return '<button class="seg '+(GROUP[s.kind]||'see')+(bad[s.id]?' '+bad[s.id]:'')+'" style="left:'+pc(st)+'%;width:'+Math.max(0.3,pcn(st+dur)-pcn(st)).toFixed(2)+'%" data-go="'+s.id+'" title="'+esc(s.time+' · '+s.title+' ('+dur+' นาที)')+'" aria-label="'+esc(s.time+' '+s.title)+'"></button>'}).join('');
    const n1=E.mins(trip.meta.nap[0]),n2=E.mins(trip.meta.nap[1]);
    let ticks='';for(let m=A;m<=B;m+=180)ticks+='<span style="left:'+pc(m)+'%">'+E.hhmm(m)+'</span>';
    return '<section class="strip"><h3>Timeline · แถบม่วง = เด็กนอน '+trip.meta.nap.join('–')+'</h3><div class="bar"><div class="nap" style="left:'+pc(n1)+'%;width:'+((n2-n1)/W*100).toFixed(2)+'%"></div>'+segs+'</div><div class="ticks">'+ticks+'</div><div class="legend"><span><i style="background:var(--move)"></i>เดินทาง</span><span><i style="background:var(--eat)"></i>อาหาร</span><span><i style="background:var(--see)"></i>เที่ยว</span><span><i style="background:var(--stay)"></i>พัก</span></div></section>';
  }
  function issBox(is){
    const c={err:0,warn:0,info:0};is.forEach(i=>{c[i.level]++});
    const h='<section class="iss"><h3>ตรวจความขัดแย้ง <span class="cnt err">ผิดพลาด '+c.err+'</span><span class="cnt warn">เตือน '+c.warn+'</span><span class="cnt info">แจ้ง '+c.info+'</span></h3>';
    if(!is.length)return h+'<div class="ok">'+DANDELION+'✓ ไม่พบข้อขัดแย้งในตัวเลือกปัจจุบัน</div></section>';
    return h+'<ul>'+is.map(i=>'<li><button data-go="'+i.slotId+'"><span class="lv '+i.level+'">'+({err:'ERR',warn:'WARN',info:'INFO'})[i.level]+'</span><span>'+esc(i.msg)+'</span></button></li>').join('')+'</ul></section>';
  }
  function gmCol(d){
    curStops=MV.stops(trip,d,sel);
    if(!curStops.length)return '';
    if(gm>=curStops.length)gm=-1;
    const url=gm<0?MV.routeEmbed(curStops):MV.placeEmbed(MV.query(curStops[gm]));
    const chips='<button class="gm-chip" data-gm="-1" aria-pressed="'+(gm<0)+'">เส้นทางทั้งวัน</button>'+curStops.map((s,i)=>'<button class="gm-chip" data-gm="'+i+'" aria-pressed="'+(gm===i)+'" aria-label="'+esc(s.letter+' '+MV.stopName(s))+'"><span class="pin'+(s.hotel?' hotel':'')+'">'+s.letter+'</span></button>').join('');
    const rows=curStops.map((s,i)=>{
      const first=s.items.find(x=>x.slotId)||s.items[0],times=[...new Set(s.items.map(x=>x.time||'start'))].join(' · ');
      return '<li class="'+(gm===i?'on':'')+'"><button class="pinb" data-gm="'+i+'" aria-label="แสดง '+esc(s.letter)+' บนแผนที่"><span class="pin'+(s.hotel?' hotel':'')+'">'+s.letter+'</span></button><button class="lg-go" data-gm="'+i+'"><div class="lg-n">'+esc(MV.stopName(s))+'</div><div class="lg-t">'+esc(times)+'</div></button>'+
        (first.slotId?'<button class="lg-jump" data-go="'+esc(first.slotId)+'">ดูเวลา ↓</button>':'<span></span>')+'<a href="'+MV.searchUrl(MV.query(s))+'" target="_blank" rel="noopener">เปิด ↗</a></li>';
    }).join('');
    return '<section class="gm"><div class="gm-bar" role="group" aria-label="มุมมองแผนที่">'+chips+'</div><div class="gm-frame" data-src="'+esc(url)+'"></div>'+
      '<div class="gm-act"><a class="btn pri" href="'+esc(MV.dirUrl(curStops))+'" target="_blank" rel="noopener">เปิดเส้นทางใน Google Maps ↗</a></div>'+
      '<p class="gm-note">แผนที่ Google จริง ค้นจากชื่อสถานที่ · ถ้ากรอบแผนที่ไม่ขึ้น (เน็ตหรือแอปบางตัวบล็อก) ให้กดปุ่มด้านบน</p></section><ol class="lg">'+rows+'</ol>';
  }
  function mountFrame(){
    const box=$('.gm-frame');if(!box)return;
    const f=document.createElement('iframe');f.src=box.dataset.src;f.title='Google Maps';f.loading='lazy';f.referrerPolicy='no-referrer-when-downgrade';f.allowFullscreen=true;
    box.replaceChildren(f);
  }
  function setGm(i){
    gm=i;const box=$('.gm-frame');if(!box)return;
    box.dataset.src=gm<0?MV.routeEmbed(curStops):MV.placeEmbed(MV.query(curStops[gm]));mountFrame();
    document.querySelectorAll('.gm-chip').forEach(c=>c.setAttribute('aria-pressed',String(+c.dataset.gm===gm)));
    document.querySelectorAll('.lg li').forEach((li,k)=>li.classList.toggle('on',k===gm));
  }
  function opt(s,o,on,pv){
    const tags=[];
    if(o.dur)tags.push('<span class="tg">'+o.dur+' นาที</span>');
    if(o.km)tags.push('<span class="tg">'+o.km+' กม.</span>');
    if(o.arch)tags.push('<span class="tg">สถาปัตย์</span>');
    if(o.kids)tags.push('<span class="tg">เหมาะเด็ก</span>');
    if(o.queue)tags.push('<span class="tg warn">มีคิว</span>');
    if(o.steep)tags.push('<span class="tg warn">บันไดชัน</span>');
    if(o.cold)tags.push('<span class="tg info">เย็น</span>');
    if(o.reserve)tags.push('<span class="tg info">ควรจอง</span>');
    if(o.last)tags.push('<span class="tg">เข้าถึง '+o.last+'</span>');
    const link=!pv&&o.q?'<a class="map-a" href="'+MV.searchUrl(o.q)+'" target="_blank" rel="noopener">แผนที่ ↗</a>':'';
    return '<label class="opt"><input type="'+(s.pick==='one'?'radio':'checkbox')+'" name="'+(pv?'pv-':'')+s.id+'" value="'+o.id+'"'+(pv?'':' data-slot="'+s.id+'"')+(on?' checked':'')+'><div class="card"><div class="n">'+esc(o.n)+'</div>'+(o.note&&!pv?'<div class="nt">'+esc(o.note)+'</div>':'')+'<div class="tags">'+tags.join('')+link+'</div></div></label>';
  }
  function slots(d,is,pv){
    return '<section class="slots">'+d.slots.map(s=>{
      const on=E.selected(s,sel).map(o=>o.id),dur=E.slotDur(s,sel),st=E.mins(s.time),mine=pv?[]:is.filter(i=>i.slotId===s.id);
      return '<article class="slot"'+(pv?'':' id="'+s.id+'"')+'><div class="time">'+s.time+(dur?'<small>→ '+E.hhmm(st+dur)+'</small>':'')+'</div><div class="rail"><span class="node">'+icon(s.kind)+'</span></div>'+
        '<div class="body"><div class="st"><h4>'+esc(s.title)+'</h4><span class="chip">'+(KIND[s.kind]||s.kind)+'</span>'+(s.opts.length>1&&!pv?'<span class="pk">'+(s.pick==='one'?'เลือก 1':'เลือกได้หลายอย่าง')+'</span>':'')+'</div>'+
        '<div class="opts">'+s.opts.map(o=>opt(s,o,on.indexOf(o.id)>-1,pv)).join('')+'</div>'+(mine.length?'<div class="slot-iss">'+mine.map(i=>'<div class="si '+i.level+'">'+esc(i.msg)+'</div>').join('')+'</div>':'')+'</div></article>';
    }).join('')+'</section>';
  }
  function day(full){
    const d=trip.days[cur],is=E.analyze(trip,d,sel),sig=d.id+'|'+MV.routeEmbed(MV.stops(trip,d,sel));
    const main=strip(d,is)+issBox(is)+slots(d,is);
    if(!full&&sig===lastSig&&$('.maincol')){$('.maincol').innerHTML=main;}
    else{
      $('#day').innerHTML='<div class="dhead"><div class="eyebrow">Day '+pad(d.n)+' / '+pad(N)+' · '+dEn(d)+'</div><h2>'+esc(d.label)+'</h2><div class="dsub">'+dstr(d)+'</div>'+
        '<div class="meta"><span>เส้นทาง: <b>'+esc(d.route)+'</b></span><span>พัก: <b>'+esc(d.night)+'</b></span></div>'+
        '<div class="wx">'+d.weather.map(w=>'<div class="note '+(w.s==='warn'?'warn':'')+'">'+esc(w.t)+'</div>').join('')+'</div></div>'+
        '<div class="dcols"><div class="mapcol">'+gmCol(d)+'</div><div class="maincol">'+main+'</div></div>';
      mountFrame();lastSig=sig;
    }
    const c={err:0,warn:0,info:0};is.forEach(i=>{c[i.level]++});
    $('#sr').textContent='DAY '+d.n+': ผิดพลาด '+c.err+' เตือน '+c.warn+' แจ้ง '+c.info;
  }
  function render(focusKey,full){
    head();deck();tabs();day(full);gallery();
    if(focusKey){const el=document.querySelector('input[data-slot="'+focusKey[0]+'"][value="'+focusKey[1]+'"]');if(el)el.focus({preventScroll:true})}
  }
  function go(i,slot){
    const nc=Math.max(0,Math.min(N-1,i));if(nc!==cur)gm=-1;cur=nc;
    try{history.replaceState(null,'','#d'+(cur+1))}catch(e){location.hash='d'+(cur+1)}
    render(null,!slot);
    if(slot){const el=document.getElementById(slot);if(el){el.scrollIntoView({block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1400)}}
  }
  function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.hidden=true},1800)}
  function planText(ds){
    return ds.map(d=>{
      const lines=['DAY '+d.n+' · '+dstr(d)+' · '+d.label,'พัก: '+d.night];
      d.slots.forEach(s=>{const o=E.selected(s,sel).filter(x=>!x.skip);if(o.length)lines.push(s.time+'  '+s.title+': '+o.map(x=>x.n).join(' + '))});
      const st=MV.stops(trip,d,sel);if(st.length>1)lines.push('เส้นทาง: '+MV.dirUrl(st));
      const is=E.analyze(trip,d,sel).filter(i=>i.level!=='info');
      if(is.length){lines.push('— ข้อควรตรวจ —');is.forEach(i=>lines.push('• '+i.msg))}
      return lines.join('\n')}).join('\n\n');
  }
  function copy(text){
    function fb(){const w=document.createElement('div');w.className='fb';w.innerHTML='<div class="sub">คัดลอกอัตโนมัติไม่ได้ — เลือกข้อความด้านล่างแล้วกดคัดลอก</div><textarea readonly></textarea>';w.querySelector('textarea').value=text;$('#day').prepend(w);const t=w.querySelector('textarea');t.focus();t.select()}
    try{navigator.clipboard.writeText(text).then(()=>toast('คัดลอกแล้ว'),fb)}catch(e){fb()}
  }
  function pick(id){root.dataset.style=id;ls.set('japan2569.style',id);gallery();toast('ใช้สไตล์ '+STYLES.find(s=>s.id===id).l)}

  document.addEventListener('click',e=>{
    if(e.target.closest('a'))return;
    const pk=e.target.closest('[data-pick]');if(pk){pick(pk.dataset.pick);return}
    const st=e.target.closest('[data-step]');if(st){go(cur+(+st.dataset.step));return}
    const g2=e.target.closest('[data-gm]');if(g2){setGm(+g2.dataset.gm);return}
    const t=e.target.closest('.tab');if(t){go(+t.dataset.i);return}
    const g=e.target.closest('[data-go]');if(g){const id=g.dataset.go;let di=-1;trip.days.forEach((d,i)=>{if(d.slots.some(s=>s.id===id))di=i});if(di>-1)go(di,id);return}
    if(e.target.id==='cpDay')copy(planText([trip.days[cur]]));
    if(e.target.id==='cpAll')copy(planText(trip.days));
    if(e.target.id==='reset'){const b=e.target;
      if(b.dataset.arm){clearTimeout(resetT);delete b.dataset.arm;b.textContent='รีเซ็ตตัวเลือก';sel={};save();render(null,true);toast('รีเซ็ตแล้ว')}
      else{b.dataset.arm='1';b.textContent='แตะอีกครั้งเพื่อรีเซ็ต';resetT=setTimeout(()=>{delete b.dataset.arm;b.textContent='รีเซ็ตตัวเลือก'},3000)}}
    if(e.target.id==='theme'){root.dataset.mode=root.dataset.mode==='dark'?'light':'dark';ls.set('japan2569.mode',root.dataset.mode)}
  });
  document.addEventListener('change',e=>{
    const i=e.target;if(!i.dataset||!i.dataset.slot)return;
    let s=null;trip.days.forEach(d=>{d.slots.forEach(x=>{if(x.id===i.dataset.slot)s=x})});
    if(s.pick==='one')sel[s.id]=[i.value];
    else{const c2=E.selected(s,sel).map(o=>o.id),k=c2.indexOf(i.value);if(k>-1)c2.splice(k,1);else c2.push(i.value);sel[s.id]=c2}
    save();const y=window.scrollY;render([s.id,i.value]);window.scrollTo(0,y);
  });
  document.addEventListener('keydown',e=>{
    const gc=e.target.closest&&e.target.closest('[data-pick]');
    if(gc&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pick(gc.dataset.pick);document.querySelector('[data-pick="'+gc.dataset.pick+'"]').focus();return}
    const t=e.target.closest&&e.target.closest('.tab');if(!t)return;
    const i=+t.dataset.i,j=e.key==='ArrowRight'?(i+1)%N:e.key==='ArrowLeft'?(i+N-1)%N:e.key==='Home'?0:e.key==='End'?N-1:-1;
    if(j<0)return;e.preventDefault();go(j);const el=document.getElementById('tab'+j);if(el)el.focus();
  });
  const fromHash=()=>{const m=/^#d(\d)$/.exec(location.hash);if(m&&trip.days[+m[1]-1])cur=+m[1]-1};
  window.addEventListener('hashchange',()=>{fromHash();render(null,true)});
  fromHash();render(null,true);
})();
</script>
</body>
</html>
