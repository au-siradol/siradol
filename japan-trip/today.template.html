<style>
:root{
  --bg:#ececec;--ink:#1b1b1b;--mute:#666;--red:#c0392f;
  /* place colours — set from PALETTES in the script */
  --hl-food:#e07a5f;--hl-cafe:#e0b14a;--hl-see:#2a9d8f;--hl-arch:#5f6caf;--hl-stay:#8d6e63;--hl-shop:#d48c6a;--hl-must:#c0392f;
  /* 'Trip Text' = Sukhumvit Set for Thai + Helvetica Neue for Latin (see #ff); IBM Plex Sans Thai is the web fallback */
  --font:'Trip Text','Helvetica Neue',Helvetica,Arial,'IBM Plex Sans Thai',sans-serif;
  --hand:'iannnnnBKK','Mali',cursive;
  /* typography knobs — set from TYPE in the script */
  --body:19px;--lh:1.3;--gap:.6em;--red-size:21px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--font);min-height:100dvh;display:flex;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 22px calc(110px + env(safe-area-inset-bottom))}
.screen{width:100%;max-width:440px;display:flex;flex-direction:column;gap:20px}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:4px}

.top{text-align:center}
.date{font-size:19px;font-weight:500}
.clock{font-size:clamp(72px,24vw,104px);font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:4px}
.tz{font-size:12px;color:var(--mute);letter-spacing:.06em}
.widgets{display:flex;align-items:center;gap:18px;margin-top:18px}
.wtrip{flex:1;min-width:0;text-align:left}
.wtrip b{font-size:14px}.wtrip span{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:6px;border-radius:3px;background:rgba(0,0,0,.1);margin-top:6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.ring{position:relative;width:62px;height:62px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:4}.ring .t{stroke:rgba(0,0,0,.1)}.ring .a{stroke:var(--ink);stroke-linecap:round}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring .v b{font-size:15px}.ring .v small{display:block;font-size:9.5px;color:var(--mute)}

.note{font-family:var(--hand);color:var(--red);font-size:calc(var(--red-size) + 1px);line-height:1.3}
.note.top-note{margin:4px 0 0 -6px}
.note.end-note{text-align:center}
/* red handwriting: level lines, slanted letters (synthetic oblique — the font has no italic) */
.slant .note,.slant .mark,.slant .skip,.slant .err,.slant .sheet ol button,.slant .sheet .notes{font-style:oblique 12deg}
.slant .sheet ol .cfg button,.slant .sheet ol .lens button{font-style:normal}
/* prose: the line gap is just enough for one row of small red notes */
.prose{position:relative;font-size:var(--body);line-height:var(--lh);margin:calc(var(--red-size) * .6) 0 0;overflow-wrap:anywhere}
.t{font-size:1em;font-weight:500;color:var(--mute);margin-right:4px;font-variant-numeric:tabular-nums}
.anc{position:relative}
.hl{--c:transparent;text-decoration:underline;text-decoration-color:var(--c);text-decoration-thickness:1.5px;text-underline-offset:.24em;text-decoration-skip-ink:auto}
.band .hl{text-decoration:none;padding:0 .12em;--b:color-mix(in srgb,var(--c) 45%,transparent);background:linear-gradient(transparent 54%,var(--b) 54%,var(--b) 94%,transparent 94%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.c-food{--c:var(--hl-food)}.c-cafe{--c:var(--hl-cafe)}.c-see{--c:var(--hl-see)}.c-arch{--c:var(--hl-arch)}
.c-stay{--c:var(--hl-stay)}.c-shop{--c:var(--hl-shop)}.c-must{--c:var(--hl-must)}
.c-move{border-bottom:1.5px dotted var(--mute)}
.ig::after{content:" ◎";font-size:.6em;vertical-align:.45em}
/* a small red mark after a word; tapping it opens the sheet with choices and notes */
.arr{width:.8em;height:.8em;vertical-align:-.05em;display:inline-block;flex:none}
.mark{font-family:var(--hand);color:var(--red);font-size:var(--red-size);line-height:1;vertical-align:.15em;margin-left:1px;padding:6px 3px;margin-block:-6px}
.sheet[hidden],.sheet-bg[hidden]{display:none}   /* .sheet sets display:flex, which would otherwise override [hidden] */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom))}
.sheet .in{width:100%;max-width:440px;background:var(--bg);border-radius:20px;padding:16px 20px 18px;box-shadow:0 -6px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:10px}
.sheet h3{margin:0;font-size:15px;font-weight:600}.sheet h3 span{color:var(--mute);font-weight:500;margin-right:6px}
.sheet .now{font-size:14px;color:var(--mute)}
.sheet ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.sheet ol button{width:100%;text-align:left;font-family:var(--hand);color:var(--red);font-size:calc(var(--red-size) + 2px);padding:8px 0;border-bottom:1px dashed rgba(192,57,47,.3)}
.sheet ol button[aria-pressed=true]::after{content:"  ✓";color:var(--ink)}
.sheet .notes{font-family:var(--hand);color:var(--red);font-size:var(--red-size);display:flex;flex-direction:column;gap:2px}
.sheet .close{align-self:flex-end;font-size:14px;color:var(--mute);padding:6px 2px}
/* literature (three ways to show it — see LIT) */
.ja{font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','Noto Serif CJK JP',serif;letter-spacing:.02em}
.lit-a{display:block;margin:6px 0 14px;padding:4px 0 4px 14px;border-left:2px solid var(--red);line-height:1.6;font-size:15px}
.lit-a .ja{display:block;font-size:15px}.lit-a .th{display:block;margin-top:2px}.lit-a .by{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.litc{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.litc h3{margin:0;font-size:14px;font-weight:600;color:var(--mute);letter-spacing:.04em}
.litc article{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.035)}
.litc .ja{font-size:16px;line-height:1.7}.litc .th{font-size:15px}.litc .by{font-size:12.5px;color:var(--mute)}.litc .nt{font-size:13.5px;color:var(--mute);line-height:1.6}
.litc .at{font-size:12px;color:var(--mute)}
.book{display:inline-grid;place-items:center;vertical-align:.05em;margin-left:3px;padding:6px 4px;margin-block:-6px;color:var(--red)}
.book svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lens{display:flex;gap:6px}.sheet ol .lens button{flex:1;width:auto;text-align:center;font-family:var(--font);color:var(--ink);font-size:14px;border:1px solid rgba(0,0,0,.18);border-radius:999px;padding:7px 0;text-decoration:none}
.sheet ol .lens button[aria-pressed=true]::after{content:none}.sheet ol .lens button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sheet .lit details{font-size:14px;color:var(--mute)}.sheet .lit summary{cursor:pointer;padding:4px 0}.sheet .lit details .ja{margin-top:4px;color:var(--ink)}
.sheet .lit .kind{font-size:12px;color:var(--red)}
.sheet .in{max-height:85dvh;overflow:auto}
.sheet .lit{display:flex;flex-direction:column;gap:10px;font-size:18px;line-height:1.75}
.sheet .lit .src{font-size:14px;color:var(--mute)}
.sheet ol .cfg{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.08);font-size:14px}
.cfg .row{display:flex;justify-content:space-between;align-items:baseline}.cfg .row b{font-weight:500}.cfg .row span{color:var(--mute);font-variant-numeric:tabular-nums}
.cfg input[type=range]{width:100%;accent-color:var(--ink);margin:2px 0}
.sheet ol .cfg button{width:auto;text-align:left;font-family:var(--font);color:var(--ink);font-size:14px;padding:7px 10px;border:1px solid rgba(0,0,0,.15);border-radius:12px}
.sheet ol .cfg button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sheet ol .cfg button[aria-pressed=true]::after{content:none}
.cfg .seg{display:flex;gap:6px}.cfg .seg button{flex:1;text-align:center!important}
.cfg .pals{display:flex;flex-direction:column;gap:6px}.cfg .pals button{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cfg .dots{display:flex;gap:4px}.cfg .dots i{width:14px;height:14px;border-radius:50%}
.aa{font:600 13px/1 var(--font);color:var(--ink);margin-left:8px;padding:3px 0 3px 8px;border-left:1px solid rgba(0,0,0,.15)}
.mid{display:flex;align-items:center}
.skip{font-family:var(--hand);color:var(--red);font-size:var(--red-size)}
.err{font-family:var(--hand);color:var(--red);font-size:var(--red-size);line-height:1.4;display:flex;flex-direction:column;gap:4px}
.nav-link{font-size:13px;color:var(--mute)}
.links{display:flex;flex-direction:column;gap:6px}
.credit{font-size:11.5px;color:var(--mute)}

.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 22px calc(18px + env(safe-area-inset-bottom));pointer-events:none;z-index:5}
.dock .in{width:100%;max-width:440px;display:flex;align-items:center;justify-content:space-between;pointer-events:auto}
.round{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.08);display:grid;place-items:center;font:500 22px/1 var(--font);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.round:disabled{opacity:.3;cursor:default}
.mid{font-size:13px;color:var(--mute);text-align:center;background:rgba(236,236,236,.85);border-radius:12px;padding:4px 12px}
.mid a{color:var(--ink)}
</style>

<script>
(function(){
  const E=window.Engine, MV=window.MapView, trip=JSON.parse(document.getElementById('trip').textContent), N=trip.days.length;
  const KEY='japan2569.sel.'+(trip.meta.version||'v1');   // shared with the full planner
  const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  let sel={};try{sel=JSON.parse(ls.get(KEY)||'{}')||{}}catch(e){}
  const $=id=>document.getElementById(id);
  // hand-drawn arrows as SVG: iOS turns ↙ ↘ into emoji
  const ARR=d=>'<svg class="arr" viewBox="0 0 20 20" aria-hidden="true"><path d="'+(d==='se'?'M4 4.5Q10 10.5 15.5 15.8M8 16h7.8V8.3':'M16 4.5Q10 10.5 4.5 15.8M12 16H4.2V8.3')+'" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* ---------- typography ----------
     th  : Thai glyph size relative to Latin, in % (size-adjust on the Thai half of Sukhumvit Set)
     lh  : prose line height   red: size of the red marks and sheet text (px) */
  /* body: prose size (px)   slant: red handwriting leans   pal: place colours   ul: 'line' underline / 'band' highlighter */
  const TYPE_DEFAULT={th:90,body:19,lh:1.3,gap:.6,red:21,slant:true,pal:'fuji',ul:'line'};
  // food, cafe, see, arch, stay, shop, must — strong enough to read as a thin underline
  const PALETTES={
    momiji:['ใบไม้เปลี่ยนสี',['#c8612b','#d29a17','#7d8b35','#9c4566','#83563a','#d0764f','#b3261e']],
    dento:['สีญี่ปุ่นโบราณ',['#eb6101','#e6a700','#3e9a6a','#8f77b5','#7b4b3a','#e16b8c','#d7003a']],
    fuji:['ทะเลสาบกับภูเขา',['#e07a5f','#e0b14a','#2a9d8f','#5f6caf','#8d6e63','#d48c6a','#c0392f']],
    sumi:['หมึกกับชาด',['#555','#777','#555','#777','#999','#777','#c0392f']],
    sakura:['พาสเทลนุ่ม',['#f2a98a','#f0cf6b','#a9c98f','#c6a6d8','#c9ad94','#f3b2c0','#e8836f']]
  };
  const HL=['food','cafe','see','arch','stay','shop','must'];
  let TYPE=Object.assign({},TYPE_DEFAULT);try{Object.assign(TYPE,JSON.parse(ls.get('japan2569.type3')||'{}'))}catch(e){}
  function applyType(t){
    Object.assign(TYPE,t||{});
    const TH={400:['Sukhumvit Set Text','SukhumvitSet-Text','Sukhumvit Set'],500:['Sukhumvit Set Medium','SukhumvitSet-Medium'],600:['Sukhumvit Set SemiBold','SukhumvitSet-SemiBold'],700:['Sukhumvit Set Bold','SukhumvitSet-Bold']};
    const EN={400:['Helvetica Neue','HelveticaNeue'],500:['Helvetica Neue Medium','HelveticaNeue-Medium'],600:['Helvetica Neue Bold','HelveticaNeue-Bold'],700:['Helvetica Neue Bold','HelveticaNeue-Bold']};
    const face=(w,names,range,adj)=>"@font-face{font-family:'Trip Text';font-weight:"+w+";src:"+names.map(n=>"local('"+n+"')").join(',')+";unicode-range:"+range+";size-adjust:"+adj+"%}";
    $('ff').textContent=[400,500,600,700].map(w=>face(w,TH[w],'U+0E00-0E7F',TYPE.th)+face(w,EN[w],'U+0000-0DFF,U+0E80-FFFF',100)).join('\n');
    const r=document.documentElement.style;r.setProperty('--body',TYPE.body+'px');r.setProperty('--lh',TYPE.lh);r.setProperty('--gap',TYPE.gap+'em');r.setProperty('--red-size',TYPE.red+'px');
    (PALETTES[TYPE.pal]||PALETTES.momiji)[1].forEach((c,i)=>r.setProperty('--hl-'+HL[i],c));
    document.body.classList.toggle('slant',!!TYPE.slant);document.body.classList.toggle('band',TYPE.ul==='band');
  }
  window.applyType=t=>{applyType(t);ls.set('japan2569.type3',JSON.stringify(TYPE))};
  window.getType=()=>Object.assign({},TYPE);

  const MON=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const DOW=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  const jst=()=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
    const g=t=>p.find(x=>x.type===t).value;return{date:g('year')+'-'+g('month')+'-'+g('day'),hm:(g('hour')==='24'?'00':g('hour'))+':'+g('minute')}};
  function initialDay(){
    const m=/^#d(\d)$/.exec(location.hash);if(m&&trip.days[+m[1]-1])return +m[1]-1;
    const t=jst().date,i=trip.days.findIndex(d=>d.date===t);
    return i>-1?i:(t<trip.days[0].date?0:N-1);
  }
  let cur=initialDay();
  // literature display: 'a' inline under the sentence · 'b' a red 本 mark that opens the sheet · 'c' a card after the day · '' off
  let LIT=(new URLSearchParams(location.search).get('lit'))??(trip.meta.lit||'');
  window.setLit=m=>{LIT=m;render()};
  const LENS=[['short','สั้น'],['medium','กลาง'],['long','ยาว']];
  let litLen=ls.get('japan2569.litlen2')||'long';
  const lev=(L,k)=>(L.levels&&(L.levels[k]||L.levels.short))||{ja:L.ja,th:L.th,kind:'แปลจากต้นฉบับ'};
  const para=s=>esc(s).replace(/\n/g,'<br>');
  const litBody=L=>{const v=lev(L,'short');return (v.ja?'<span class="ja" lang="ja">'+esc(v.ja)+'</span>':'')+'<span class="th">'+esc(v.th)+'</span>'};
  const BOOK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10.2 5 7.6 4.5 4 4.8v13c3.6-.3 6.2.2 8 1.7 1.8-1.5 4.4-2 8-1.7v-13c-3.6-.3-6.2.2-8 1.7z"/><path d="M12 6.5v13"/></svg>';

  const COLOR={meal:'food',cafe:'cafe',see:'see',arch:'arch',hotel:'stay',rest:'stay',shop:'shop',spa:'shop',refuel:'must',carreturn:'must',car:'must',drive:'move',nap:'move',transit:'move',move:'move',arrival:'move',flight:'must'};
  const VERB=s=>({meal:'กิน'+s.title.replace(/\s*\+.*$/,'')+'ที่',cafe:'แวะกินกาแฟที่',drive:'ขับรถไป',nap:'ขับรถไป',rest:'แวะพักที่',see:'ไปเที่ยว',arch:'ไปดูงานสถาปัตย์',
    hotel:/เช็กอิน/.test(s.title)?'เช็กอินที่':'กลับไปพักที่',shop:'ช้อปที่',refuel:'เติมน้ำมันที่',car:'',carreturn:'คืนรถที่',spa:'แช่ออนเซ็นที่',transit:'',move:'นั่ง',arrival:'',flight:''}[s.kind]||'');
  const FLAG=(o,s)=>[s.kind==='nap'&&'น้องหลับในรถ',o.queue&&'คิวยาว',o.reserve&&'จองก่อน',o.steep&&'บันไดชัน เดินรอบนอก',o.cold&&'ใส่เสื้ออุ่น'].filter(Boolean);
  const link=o=>o.ig?{href:'https://www.instagram.com/'+encodeURIComponent(o.ig.replace(/^@/,''))+'/',ig:true}:{href:MV.searchUrl(o.q||o.n),ig:false};
  const shortName=n=>n.replace(/\s*\(([^)]*)\)\s*$/,'').replace(/^คืนรถ\s+/,'');
  const label=(s,o)=>s.kind==='drive'||s.kind==='nap'?shortName(o.pin||o.n).replace(/^.*→\s*/,''):shortName(o.n);

  // the red mark after a word: "↙n" when there are n other choices, "!" when there are only notes
  function mark(s,notes){
    const n=s.opts.length-E.selected(s,sel).length;
    if(!n&&!notes.length)return '';
    return '<button class="mark" data-pop="'+s.id+'" aria-label="'+(n?n+' ทางเลือก':'หมายเหตุ')+'">'+(n?ARR('sw')+n:'!')+'</button>';
  }
  function word(s,o,withMark){
    const L=link(o);
    return '<a class="hl c-'+(COLOR[s.kind]||'see')+(L.ig?' ig':'')+'" href="'+esc(L.href)+'" target="_blank" rel="noopener">'+esc(label(s,o))+'</a>'+
      (withMark?mark(s,notesOf(s)):'');
  }
  const notesOf=s=>[...new Set(E.selected(s,sel).filter(o=>!o.skip).flatMap(o=>FLAG(o,s)))];
  function sentence(s){
    const chosen=E.selected(s,sel),real=chosen.filter(o=>!o.skip),t='<span class="t">'+s.time+'</span>';
    if(!real.length)return t+'<span class="skip">(ข้าม'+esc(s.title.replace(/\s*\(.*\)\s*$/,''))+')</span>'+mark(s,[])+' ';
    const v=VERB(s);
    const L=s.lit,litMark=L&&LIT==='b'?'<button class="book" data-lit="'+s.id+'" aria-label="อ่านจากหนังสือ: '+esc(L.work)+'" title="อ่านจากหนังสือ">'+BOOK+'</button>':'';
    const litBlock=L&&LIT==='a'?'<span class="lit-a">'+litBody(L)+'<span class="by">— '+esc(L.who)+', '+esc(L.work)+'</span></span>':'';
    return t+(v?esc(v)+' ':'')+real.map((o,i)=>word(s,o,i===real.length-1)).join(' และ ')+litMark+litBlock+(litBlock?'':(s.kind==='meal'||s.kind==='hotel'?' ':' แล้ว '));
  }
  /* sheet: tap a red mark → choose */
  let popSlot=null,popFrom=null;
  function openSheet(id,from){
    const s=trip.days[cur].slots.find(x=>x.id===id);if(!s)return;popSlot=s;popFrom=from;
    const chosen=E.selected(s,sel);
    $('sh-t').innerHTML='<span>'+s.time+'</span>'+esc(s.title.replace(/\s*\(.*\)\s*$/,''));
    $('sh-now').textContent='ตอนนี้: '+(chosen.filter(o=>!o.skip).map(o=>shortName(o.n)).join(' + ')||'ข้าม');
    const list=s.pick==='one'?s.opts.filter(o=>!chosen.includes(o)):s.opts;
    $('sh-opts').innerHTML=list.map((o,i)=>'<li><button data-s="'+s.id+'" data-o="'+o.id+'"'+(s.pick==='any'?' aria-pressed="'+chosen.includes(o)+'"':'')+'>'+(i+1)+') '+esc(o.skip?'ข้าม':shortName(o.n))+'</button></li>').join('');
    const nt=notesOf(s);$('sh-notes').innerHTML=nt.map(x=>'<div>! '+esc(x)+'</div>').join('');
    $('sheet').hidden=false;$('sheetbg').hidden=false;
    const f=$('sh-opts').querySelector('button')||$('sh-x');f.focus();
  }
  function openLit(id,from){
    const s=trip.days[cur].slots.find(x=>x.id===id);if(!s||!s.lit)return;const L=s.lit;if(from)popFrom=from;
    const v=lev(L,litLen),hasLv=!!L.levels;
    $('sh-t').innerHTML='<span>'+s.time+'</span>'+esc(s.title.replace(/\s*\(.*\)\s*$/,''));$('sh-now').textContent='ทิวทัศน์จากหนังสือ';
    $('sh-opts').innerHTML=(hasLv?'<li><div class="lens" role="group" aria-label="ความยาวข้อความ">'+LENS.map(([k,n])=>'<button data-len="'+k+'" data-for="'+s.id+'" aria-pressed="'+(k===litLen)+'">'+n+'</button>').join('')+'</div></li>':'')+
      '<li class="lit"><div class="th">'+para(v.th)+'</div><div class="src">— '+esc(L.who)+', '+esc(L.work)+'</div></li>';
    $('sh-notes').innerHTML='';$('sheet').hidden=false;$('sheetbg').hidden=false;
    const f=$('sh-opts').querySelector('[aria-pressed=true]')||$('sh-x');f.focus();
  }
  function litCards(d){
    const box=$('litc'),ls=d.slots.filter(s=>s.lit);
    if(LIT!=='c'||!ls.length){box.hidden=true;box.innerHTML='';return}
    box.hidden=false;
    box.innerHTML='<h3>อ่านระหว่างทาง</h3>'+ls.map(s=>'<article><span class="at">'+s.time+' · '+esc(s.title)+'</span>'+litBody(s.lit).replace(/<span class="(ja|th)"/g,'<div class="$1"').replace(/<\/span>/g,'</div>')+'<div class="by">— '+esc(s.lit.who)+', '+esc(s.lit.work)+'</div><div class="nt">'+esc(s.lit.note)+'</div></article>').join('');
  }
  /* sheet: Aa → text size, line spacing, red handwriting, colours */
  const RANGES=[['body','ขนาดตัวอักษร',14,26,1,v=>v+' px'],['lh','ระยะห่างบรรทัด',1.3,2.4,.05,v=>(+v).toFixed(2)],['red','ขนาดตัวอักษรสีแดง',16,34,1,v=>v+' px']];
  function openSettings(from,again){
    popFrom=from;
    const seg=(k,opts)=>'<div class="seg">'+opts.map(([v,n])=>'<button data-cfg="'+k+'" data-v="'+v+'" aria-pressed="'+(String(TYPE[k])===String(v))+'">'+n+'</button>').join('')+'</div>';
    $('sh-t').textContent='ตัวอักษรและสี';$('sh-now').textContent='ปรับแล้วเห็นผลทันที · จำไว้ในเครื่องนี้';
    $('sh-opts').innerHTML=RANGES.map(([k,n,a,b,st,f])=>'<li class="cfg"><label class="row" for="r-'+k+'"><b>'+n+'</b><span id="v-'+k+'">'+f(TYPE[k])+'</span></label><input type="range" id="r-'+k+'" data-range="'+k+'" min="'+a+'" max="'+b+'" step="'+st+'" value="'+TYPE[k]+'"></li>').join('')+
      '<li class="cfg"><div class="row"><b>ตัวอักษรสีแดง</b></div>'+seg('slant',[['true','เอียง'],['false','ตรง']])+'</li>'+
      '<li class="cfg"><div class="row"><b>ชื่อสถานที่</b></div>'+seg('ul',[['line','ขีดเส้นใต้'],['band','ไฮไลต์']])+'</li>'+
      '<li class="cfg"><div class="row"><b>โทนสี</b></div><div class="pals">'+Object.entries(PALETTES).map(([k,[n,c]])=>'<button data-cfg="pal" data-v="'+k+'" aria-pressed="'+(TYPE.pal===k)+'"><span>'+n+'</span><span class="dots">'+c.map(x=>'<i style="background:'+x+'"></i>').join('')+'</span></button>').join('')+'</div></li>'+
      '<li class="cfg"><div class="seg"><button data-cfg="reset">กลับเป็นค่าเริ่มต้น</button></div></li>';
    $('sh-notes').innerHTML='';$('sheet').hidden=false;$('sheetbg').hidden=false;
    if(!again)$('r-body').focus();
  }
  document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.range;if(!k)return;
    const R=RANGES.find(x=>x[0]===k);window.applyType({[k]:+e.target.value});$('v-'+k).textContent=R[5](TYPE[k])});
  function closeSheet(){$('sheet').hidden=true;$('sheetbg').hidden=true;popSlot=null;if(popFrom&&document.body.contains(popFrom))popFrom.focus()}
  function render(){
    const d=trip.days[cur],p=d.date.split('-'),now=jst(),isToday=now.date===d.date;
    $('date').textContent='วัน'+DOW[E.dowOf(d)]+' '+(+p[2])+' '+MON[+p[1]-1];
    $('dayn').textContent='วันที่ '+d.n+' / '+N+(isToday?' · วันนี้':'');
    $('route').textContent=d.label;$('pb').style.width=(d.n/N*100)+'%';$('cnt').textContent=d.n+' / '+N;
    $('prev').disabled=cur===0;$('next-d').disabled=cur===N-1;
    const warn=d.weather.find(w=>w.s==='warn'),daysTo=Math.round((Date.parse(trip.days[0].date)-Date.parse(now.date))/864e5);
    $('topnote').innerHTML=ARR('sw')+' '+esc((daysTo>0?'อีก '+daysTo+' วันออกเดินทาง / ':'')+(warn?'อย่าลืม: '+(warn.t.length>70?warn.t.slice(0,68)+'…':warn.t):'วันนี้ค่อยๆ ไป ไม่ต้องรีบ'));
    $('prose').innerHTML=d.slots.map(sentence).join('').replace(/ แล้ว $/,'');
    $('endnote').innerHTML=ARR('se')+' '+esc('คืนนี้นอนที่ '+d.night);
    litCards(d);
    $('err').innerHTML=E.analyze(trip,d,sel).filter(i=>i.level==='err').map(i=>'<div>! '+esc(i.msg)+'</div>').join('');
    $('nav').href=MV.dirUrl(MV.stops(trip,d,sel));
    const L=trip.meta.links||{};[['l-places',L.places],['l-sheet',L.sheet]].forEach(([id,u])=>{$(id).hidden=!u;if(u)$(id).href=u});
    try{history.replaceState(null,'','#d'+(cur+1))}catch(e){}
    tick();
  }
  function tick(){
    const now=jst(),d=trip.days[cur];$('clock').textContent=now.hm;
    const sl=d.slots.filter(s=>E.slotDur(s,sel)>0||s.kind==='flight'),m=E.mins(now.hm),today=now.date===d.date;
    const nx=today?sl.find(s=>E.mins(s.time)>m):sl[0],a=E.mins(sl[0].time),b=E.mins(sl[sl.length-1].time);
    $('arc').setAttribute('stroke-dashoffset',(169.6*(1-(today?Math.max(0,Math.min(1,(m-a)/Math.max(1,b-a))):0))).toFixed(1));
    $('next').innerHTML=nx?'<div><b>'+nx.time+'</b><small>'+(today?'ต่อไป':'เริ่ม')+'</small></div>':'<div><b>✓</b><small>จบวัน</small></div>';
  }
  document.addEventListener('click',e=>{
    const pm=e.target.closest('[data-pop]');if(pm){openSheet(pm.dataset.pop,pm);return}
    const lm=e.target.closest('[data-lit]');if(lm){openLit(lm.dataset.lit,lm);return}
    const ln=e.target.closest('[data-len]');if(ln){litLen=ln.dataset.len;ls.set('japan2569.litlen2',litLen);openLit(ln.dataset.for,null);return}
    if(e.target.closest('#aa')){openSettings(e.target.closest('#aa'));return}
    const cf=e.target.closest('[data-cfg]');if(cf){const k=cf.dataset.cfg,v=cf.dataset.v;
      if(k==='reset'){const keep=TYPE.th;window.applyType(Object.assign({},TYPE_DEFAULT,{th:keep}))}
      else window.applyType({[k]:v==='true'?true:v==='false'?false:v});
      const y=$('sheet').querySelector('.in').scrollTop;openSettings(popFrom,true);$('sheet').querySelector('.in').scrollTop=y;return}
    if(e.target.closest('#sh-x')||e.target.id==='sheetbg'){closeSheet();return}
    const b=e.target.closest('button[data-s]');
    if(b){const s=trip.days[cur].slots.find(x=>x.id===b.dataset.s);
      if(s.pick==='one')sel[s.id]=[b.dataset.o];
      else{const c=E.selected(s,sel).map(o=>o.id),k=c.indexOf(b.dataset.o);if(k>-1)c.splice(k,1);else c.push(b.dataset.o);sel[s.id]=c}
      ls.set(KEY,JSON.stringify(sel));render();
      if(s.pick==='any')openSheet(s.id,null);else closeSheet();
      return}
    if(e.target.closest('#prev')&&cur>0){cur--;render();scrollTo(0,0)}
    if(e.target.closest('#next-d')&&cur<N-1){cur++;render();scrollTo(0,0)}
  });
  addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden)closeSheet()});
  addEventListener('hashchange',()=>{const i=initialDay();if(i!==cur){cur=i;closeSheet();render()}});
  let x0=null;   // swipe left/right to change day
  addEventListener('touchstart',e=>{x0=e.target.closest('input,.mock,.sheet')?null:e.touches[0].clientX},{passive:true});
  addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>70){const n=cur+(dx<0?1:-1);if(n>=0&&n<N){cur=n;render();scrollTo(0,0)}}},{passive:true});
  
  applyType();render();setInterval(tick,15000);
})();
</script>
</body>
</html>
