        .canvas-container {
            max-width: 1100px; margin: 16px auto 0;
            border-bottom: 1px dashed #aaa; padding-bottom: 15px; position: relative;
        }
        canvas#simCanvas {
            display: block; width: 100%; aspect-ratio: 110 / 62; height: auto;
            background: #ffffff; border: 1px solid #eaeaea;
            cursor: grab; touch-action: none;

        canvas.scalebar { position: absolute; right: 10px; bottom: 24px; pointer-events: none; }

        .reading-switch button {
            border: 1px solid #111; background: #fff; cursor: pointer; box-sizing: border-box;

            font: inherit; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #111;
        }
        .reading-switch button.active { background: #111; color: #fff; }
        .view-hint {
            position: absolute; bottom: 22px; left: 10px;
            font-size: 9px; color: #bbb; letter-spacing: 0.4px;
        }

        .controls-strip {
            max-width: 1100px; margin: 14px auto 0; padding-top: 12px;
            border-top: 1px dashed #aaa; display: flex; flex-direction: column;
            gap: 18px; font-size: 11px; line-height: 1.5;

        .strip-row { display: flex; align-items: flex-start; gap: 0; flex-wrap: wrap; }

            display: flex; flex-direction: column; gap: 8px;
            padding-right: 24px; margin-right: 24px; border-right: 1px solid #ccc;
            min-width: 0; flex: 1 1 260px;
        }
        .cluster:last-child { border-right: none; padding-right: 0; margin-right: 0; }
        .cluster-fields { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px; }

        .gravity-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; max-width: 420px; }
        .gravity-row .grav-lbl { font-size: 8px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: #999; flex: none; }
        .gravity-row .grav-val {
            font-size: 10px; letter-spacing: 0.5px; color: #111; flex: none;
            width: 46px; text-align: right; font-variant-numeric: tabular-nums;
        }
        .gravity-row .grav-val.at0 { color: #bbb; }
        #gravitySlider {
            flex: 1; -webkit-appearance: none; appearance: none; height: 1px;
            background: #999; outline: none; cursor: pointer;
        }
        #gravitySlider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%;

        }
        #gravitySlider::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: #111; border: none; cursor: pointer; }

        .reading-switch button svg { width: 12px; height: 12px; vertical-align: -2px; margin-right: 5px; }
        .reading-switch button:hover { background: #fafafa; }
        .reading-switch button.active:hover { background: #111; }

            font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: #999;

        button.resetview:hover { border-color: #111; color: #111; }

                      G={x:x0+w/2,y:y0,z:z0+d/2}, H={x:x0-w/2,y:y0,z:z0+d/2},
                      E={x:x1-w/2,y:y1,z:z1-d/2}, F={x:x1+w/2,y:y1,z:z1-d/2},

            // diagram; it stays where it lies, under the floor above.
            const line = (a,b,color,w,arrow,dashed,front) =>
                lines.push({a,b,color,w,arrow:!!arrow,dashed:!!dashed,front:!!front});

            // The Gravity Paradox — melting slabs. p.gravity away from 0 (either
            // direction) softens the floor plates. Each plate is zero-deflection
            // exactly at its own four real posts (which migrate — corner or
            // mid-side — so the shape genuinely differs floor to floor) and grows
            // smoothly (a plate's bending curve, not a pointed dimple) away from
            // them, largest at whichever corner/edge that floor's posts don't
            // reach. The bottom face and a fascia skirt are flat CPU triangles
            // (built here, same shape as the roof's soffit trick); the smooth
            // warped top face is built separately in three.js (see "slab tops" in
            // renderScene) and collected into slabTops, one sag function each.
            const meltAmt = Math.min(1, Math.abs(p.gravity || 0));
            const SAG_MAX = 0.52, SAG_REACH = Math.max(W, D) * 0.45;
            const floorBend = (p.gravity || 0) * 0.1;            // a slight lean, same idea as the roof's
            function supportSag(supports) {
                if (!supports) return (x, z) => floorBend * (z / (D/2));   // ground/basement: no posts below, no dish
                return (x, z) => {
                    let dmin = Infinity;
                    for (const s of supports) {
                        const d = Math.hypot(x - s.x, z - s.z);
                        if (d < dmin) dmin = d;
                    }
                    // a cantilever's curve: flat where it leaves the post (the
                    // plate is continuous there, so zero slope) and steepening all
                    // the way out. It must NOT level off at the reach radius the
                    // way a smoothstep does — a free edge keeps turning, and that
                    // last bit of turn is what makes the tip read as lifted.

                    const curve = u * u * (3 - u) / 2;                     // f(0)=0, f'(0)=0, still climbing at u=1

            }
            const slabTops = [];
            function sagStrip(x0, x1, z0, z1, yBot, thick, tint, sagFn) {

                // thickness and genuinely bends — rather than a melted top sitting
                // on a flat soffit, which read as a dark stain where it got exposed
                const mid = { x:(x0+x1)/2, y: yBot + thick/2, z:(z0+z1)/2 };
                const B0 = (x,z) => ({ x, y: yBot + sagFn(x,z), z });
                const T0 = (x,z) => ({ x, y: yBot + thick + sagFn(x,z), z });
                const NX = Math.max(2, Math.round((x1-x0)/1.4)), NZ = Math.max(2, Math.round((z1-z0)/1.4));

                        const za = z0 + j*(z1-z0)/NZ, zb = z0 + (j+1)*(z1-z0)/NZ;
                        if (j === 0)      quad(B0(xa,za), B0(xb,za), T0(xb,za), T0(xa,za), mid, tint);
                        if (j === NZ-1)   quad(T0(xa,zb), T0(xb,zb), B0(xb,zb), B0(xa,zb), mid, tint);
                        if (i === 0)      quad(B0(xa,zb), B0(xa,za), T0(xa,za), T0(xa,zb), mid, tint);

            // slabs, cut open over the core on every level - except the middle of the
            // second floor, where the landing between the two stair flights stays solid
            const flight0 = Math.min((risers - 1) * REAL.going, cl/2 - 0.05);
            const hz = cd/2 - cwall;                     // clear between the core walls

            //   floor 1  - both walls solid (the storey-1 opening was pulled back).
            //   floor 2  - both walls solid, no openings (the stair only passes).

            p.floors.forEach((f, idx) => {

                    const pBOrig = idx*fh - 0.02;

                        ? Math.max(0, dLoad)                        // heavier gravity pushes the strut

                    } else {

                    }

                    // what it's hiding stays right there, now visible as a bare
                    // cable through the gap it just opened
                    if (role !== 'strut' && pB > pBOrig + 1e-4)
                        line({x:q.x, y:pBOrig, z:q.z}, {x:q.x, y:pB, z:q.z}, 'rgba(20,20,20,0.85)', 1.5, false, false, true);
                    if (!showForce) return;
                    // the force diagram reads off the post as it actually stands now,
                    // not off the nominal floor line — so the arrows travel with the
                    // gap, the stretch and the bow as the gravity slider moves
                    // roughly on the bowed shaft (it bulges to bendX/bendZ at mid-height)
                    const mx = q.x + bendX / 2, mz = q.z + bendZ / 2;
                    // ...and it points where gravity actually points. The slider is a
                    // gravity vector: centre is 1 g, right is heavier, left passes
                    // through weightless at half travel and comes out inverted — so
                    // the arrows shrink to nothing at gEff = 0 and then flip.
                    const dir = gEffG < 0 ? -1 : 1, mag = Math.abs(gEffG);
                    if (mag > 0.04) {
                        const L = (pT - pB) * 0.55 * Math.min(1, mag);
                        if (role === 'strut') {
                            const a = dir > 0 ? pT : pB;
                            line({x:mx,y:a,z:mz}, {x:mx,y:a - dir*L,z:mz}, 'rgba(211,47,47,0.95)', 2, true);
                        } else {
                            const a = dir > 0 ? pB : pT, b = dir > 0 ? pT : pB;
                            line({x:mx,y:a,z:mz}, {x:mx,y:b,z:mz}, 'rgba(25,118,210,0.95)', 2, true);
                        }
                    }
                    if (role !== 'strut') {
                        const head = topY - (idx === p.floors.length - 1 ? p.slabThick/2 : p.slabThick);
                        if (head > pT + 1e-6) line({x:q.x,y:pT,z:q.z}, {x:q.x,y:head,z:q.z}, 'rgba(13,71,161,0.9)', 1.6, false, true, true);
                        const ax = q.x < -0.01 ? -cl/2 : (q.x > 0.01 ? cl/2 : 0);
                        const az = q.z < -0.01 ? -cd/2 : (q.z > 0.01 ? cd/2 : 0);
                        if (mag > 0.04) {
                            const h0 = dir > 0 ? {x:q.x,z:q.z} : {x:ax,z:az}, h1 = dir > 0 ? {x:ax,z:az} : {x:q.x,z:q.z};
                            line({x:h0.x,y:head,z:h0.z}, {x:h1.x,y:head,z:h1.z}, 'rgba(230,81,0,0.95)', 2, true);
                        }
                    }
                });
            });

            // Furniture, drawn flat on each plate from the plans' own FURN layer.
            // Lines only — it is plan information lying on the floor, not objects.
            // Hidden the moment the plates start to melt, since these sit at a
            // fixed height and would float off a bending floor.
            if (meltAmt < 0.02) {
                for (let fi = 0; fi < FURN.length && fi < p.numFloors; fi++) {
                    const fy = fi * fh + 0.012;
                    for (const q of FURN[fi])
                        for (let i = 0; i + 3 < q.length; i += 2)
                            line({ x:q[i], y:fy, z:q[i+1] }, { x:q[i+2], y:fy, z:q[i+3] },
                                 'rgba(70,70,70,0.45)', 1);
                }
            }

            return { tris, lines, topY, W, D, cl, cd, lift, slabTops };
        }

        /* ============================================================
           THREE.JS RENDER
           ============================================================ */
        const canvas = document.getElementById('simCanvas');
        const wrap = canvas.parentElement;
        const scaleCv = document.createElement('canvas');
        scaleCv.className = 'scalebar';
        wrap.appendChild(scaleCv);
        const sctx = scaleCv.getContext('2d');

        const VIEW0 = { yaw: -32, pitch: 26, zoom: 1 };
        const panW = new THREE.Vector3();                 // pan as a world offset, not screen px
        const panBasisR = new THREE.Vector3(1, 0, 0), panBasisU = new THREE.Vector3(0, 1, 0);
        let panWpp = 0.05;
        const V = Object.assign({}, VIEW0);
        let cw = 1100, ch = 620, dpr = 1;

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setClearColor(0x000000, 0);
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const scene = new THREE.Scene();
        const FOV = 32;                                                         // long lens: perspective, but gentle
        const camera = new THREE.PerspectiveCamera(FOV, 1, 0.01, 8000);
        camera.up.set(0, 1, 0);

        // strong key + gentle sky fill + a floor of ambient, so an up-facing plate
        // reads as grey rather than washing out to pure white against the page
        scene.add(new THREE.HemisphereLight(0xffffff, 0xdedede, 1.15));
        scene.add(new THREE.AmbientLight(0xffffff, 0.72));
        const sun = new THREE.DirectionalLight(0xffffff, 1.9);
        scene.add(sun); scene.add(sun.target);
        const SUN_DIR = new THREE.Vector3(-0.5, 0.92, 0.42).normalize();

        const MAT = {
            card:  new THREE.MeshLambertMaterial({ color: 0xf8f8f6, side: THREE.DoubleSide }),
            cardD: new THREE.MeshLambertMaterial({ color: 0xf5f5f2, side: THREE.DoubleSide }),
            edge:  new THREE.LineBasicMaterial({ color: 0x1c1c1c }),
            ground:new THREE.MeshStandardMaterial({ color: 0xc4c4c4, roughness: 0.98, metalness: 0, side: THREE.DoubleSide, transparent: true })
        };

        let modelG = new THREE.Group();
        scene.add(modelG);
        let fitR = 20;
        const fitC = new THREE.Vector3();

        function clearGroup(g) {
            g.traverse(o => { if (o.geometry) o.geometry.dispose(); });
            while (g.children.length) g.remove(g.children[0]);
        }
        function parseCol(s) {
            const m = String(s).match(/rgba?\(([^)]+)\)/);
            if (!m) return { hex: 0x333333, a: 1 };
            const q = m[1].split(',').map(x => parseFloat(x));
            return { hex: (Math.round(q[0])<<16) | (Math.round(q[1])<<8) | Math.round(q[2]), a: q[3] == null ? 1 : q[3] };
        }
        function triGeom(ts) {
            const pos = new Float32Array(ts.length * 9), nor = new Float32Array(ts.length * 9);
            let k = 0;
            for (const t of ts) for (const v of t.p) {
                pos[k] = v.x; pos[k+1] = v.y; pos[k+2] = v.z;
                nor[k] = t.n.x; nor[k+1] = t.n.y; nor[k+2] = t.n.z; k += 3;
            }
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
            return g;
        }
        const V3 = o => new THREE.Vector3(o.x, o.y, o.z);

        // posts get a loose threshold so a bowed shaft reads as one smooth member —
        // its real 90 deg arrises still draw, the small kinks along the curve don't
        const EDGE_THR = { slab: 1, core: 1, post: 26, stair: 1, wall: 1, roof: 26 };

        function renderScene(p, risers) {
            clearGroup(modelG);
            const B = build(p, risers);
            const meltAmt = Math.min(1, Math.abs(p.gravity || 0));

            // ---- solids, grouped by tint, each with its crease outline
            const byTint = {};
            for (const t of B.tris) (byTint[t.tint] || (byTint[t.tint] = [])).push(t);
            for (const tint in byTint) {
                const geom = triGeom(byTint[tint]);
                const mesh = new THREE.Mesh(geom, (tint === 'roof' || tint === 'wall') ? MAT.cardD : MAT.card);
                mesh.material.shadowSide = THREE.BackSide;
                modelG.add(mesh);
                if (tint === 'slab' || tint === 'core' || tint === 'wall') continue;   // no outline on plates, core or partitions
                modelG.add(new THREE.LineSegments(new THREE.EdgesGeometry(geom, EDGE_THR[tint] || 1), MAT.edge));
            }

            // ---- slab outlines: the outer rectangle only, no core-hole rim.
            // Skipped once the plates start melting — losing the crisp edge
            // reads as more dissolved, not as a bug.
            if (meltAmt < 0.02) {
                const em = MAT.edge;
                for (let i = -p.numBelow; i < p.numFloors; i++) {
                    const y = i * p.floorHeight;
                    const c = [[-B.W/2,-B.D/2],[B.W/2,-B.D/2],[B.W/2,B.D/2],[-B.W/2,B.D/2]];
                    const pts = [];
                    for (let k = 0; k < 4; k++) {
                        const a = c[k], b = c[(k+1)%4];
                        pts.push(a[0], y, a[1], b[0], y, b[1]);
                        pts.push(a[0], y - p.slabThick, a[1], b[0], y - p.slabThick, b[1]);
                    }
                    modelG.add(new THREE.LineSegments(
                        new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(pts, 3)), em));
                }
            }

            // ---- roof top: a smooth mesh so the wedge is not faceted
            {
                const g = new THREE.PlaneGeometry(B.W, B.D, 30, 20);
                g.rotateX(-Math.PI / 2);
                const pos = g.attributes.position;
                for (let i = 0; i < pos.count; i++) pos.setY(i, B.lift(pos.getX(i), pos.getZ(i)));
                pos.needsUpdate = true;
                g.computeVertexNormals();
                const mesh = new THREE.Mesh(g, MAT.cardD);
                modelG.add(mesh);
                modelG.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 44), MAT.edge));

                const yc = B.topY + p.roofRise, W = B.W, D = B.D;
                const cm = new THREE.LineBasicMaterial({ color: 0x1c1c1c, transparent: true, opacity: 0.9 });
                const vm = new THREE.LineBasicMaterial({ color: 0x1c1c1c, transparent: true, opacity: 0.20 });
                const seg = (a, b, m) => modelG.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints([a, b]), m));
                seg(new THREE.Vector3(-W/2, yc, 0), new THREE.Vector3(W/2, yc, 0), cm);
                seg(new THREE.Vector3(0, yc, -D/2), new THREE.Vector3(0, yc, D/2), cm);
                [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(c =>
                    seg(new THREE.Vector3(0, yc, 0), new THREE.Vector3(c[0]*W/2, B.topY, c[1]*D/2), vm));
            }

            // ---- slab faces: the smooth warped skins of a melting floor, top and
            // soffit both (build() leaves only the fascia ring as CPU triangles).
            // `down` entries are wound the other way so the soffit faces down.
            if (B.slabTops && B.slabTops.length) {
                const mat = MAT.card;
                for (const s of B.slabTops) {
                    const w = s.x1 - s.x0, d = s.z1 - s.z0;
                    const nx = Math.max(2, Math.round(w / 1.4)), nz = Math.max(2, Math.round(d / 1.4));
                    const g = new THREE.PlaneGeometry(w, d, nx, nz);
                    g.rotateX(s.down ? Math.PI / 2 : -Math.PI / 2);
                    g.translate((s.x0 + s.x1) / 2, 0, (s.z0 + s.z1) / 2);
                    const pos = g.attributes.position;
                    for (let i = 0; i < pos.count; i++) pos.setY(i, s.y + s.sagAt(pos.getX(i), pos.getZ(i)));
                    pos.needsUpdate = true;
                    g.computeVertexNormals();
                    if (mat) modelG.add(new THREE.Mesh(g, mat));
                }
            }

            // ---- annotation lines (the force diagram and the slack-tie cables)
            const groups = {};
            for (const l of B.lines) {
                if (l.arrow) { addArrow(l); continue; }
                const { hex, a } = parseCol(l.color);
                const key = hex + '|' + (l.dashed ? 1 : 0) + '|' + a.toFixed(2) + '|' + (l.front ? 1 : 0);
                (groups[key] || (groups[key] = { hex, a, dashed: l.dashed, front: l.front, pts: [] })).pts
                    .push(l.a.x, l.a.y, l.a.z, l.b.x, l.b.y, l.b.z);
            }
            for (const key in groups) {
                const gr = groups[key];
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.Float32BufferAttribute(gr.pts, 3));
                const spec = { color: gr.hex, transparent: true, opacity: gr.a, depthTest: !gr.front };
                const mat = gr.dashed
                    ? new THREE.LineDashedMaterial({ ...spec, dashSize: 0.3, gapSize: 0.22 })
                    : new THREE.LineBasicMaterial(spec);
                const ls = new THREE.LineSegments(geo, mat);
                if (gr.dashed) ls.computeLineDistances();
                if (gr.front) ls.renderOrder = 9;
                modelG.add(ls);
            }

            // (the Greek / Dom-ino readings are not drawn as lines on the building
            // — the switch throws them as tree shadows instead)

            // ---- ground - a real shadow-catching disc. Under inverted gravity it
            // has no reason to stay: it thins to a bare rim and drifts up and away,
            // the way Magritte lets the ground go.
            {
                const gr = Math.max(B.W, B.D) * 0.85;
                // Grade, not "under the lowest plate". The lowest of Flammer's four
                // floors is below ground (the +-0.00 tick in the cross-section sits
                // on top of it), so with a basement the disc belongs at level 0 and
                // that storey stays buried - which is what makes the building read
                // as the three storeys the elevation actually shows.
                const gy = p.numBelow > 0 ? -0.002 : -p.slabThick + 0.002;
                const inv = Math.max(0, -(p.gravity || 0));       // 0..1 toward inverted
                MAT.ground.opacity = Math.max(0, 1 - inv * 1.15);
                if (MAT.ground.opacity > 0.01) {
                    const gm = new THREE.Mesh(new THREE.CircleGeometry(gr, 72), MAT.ground);
                    gm.rotation.x = -Math.PI / 2;
                    gm.position.y = gy + inv * 8;
                    modelG.add(gm);
                }
                if (inv > 0.02) {
                    const rim = new THREE.LineSegments(
                        new THREE.EdgesGeometry(new THREE.CircleGeometry(gr, 72)),
                        new THREE.LineBasicMaterial({ color: 0x9c9c9c, transparent: true, opacity: Math.min(1, inv * 1.4) }));
                    rim.rotation.x = -Math.PI / 2;
                    rim.position.y = gy + inv * 8;
                    modelG.add(rim);
                }
            }

            // ---- camera fit from the model's own bounds (rotation invariant)
            let mnx=1e9,mny=1e9,mnz=1e9,mxx=-1e9,mxy=-1e9,mxz=-1e9;
            for (const t of B.tris) for (const v of t.p) {
                if (v.x<mnx) mnx=v.x; if (v.x>mxx) mxx=v.x;
                if (v.y<mny) mny=v.y; if (v.y>mxy) mxy=v.y;
                if (v.z<mnz) mnz=v.z; if (v.z>mxz) mxz=v.z;
            }
            fitC.set((mnx+mxx)/2, (mny+mxy)/2, (mnz+mxz)/2);
            fitR = 0.5 * Math.hypot(mxx-mnx, mxy-mny, mxz-mnz) || 20;
        }

        function addArrow(l) {
            const { hex, a } = parseCol(l.color);
            const from = V3(l.a), to = V3(l.b);
            const d = to.clone().sub(from), len = d.length();
            if (len < 1e-4) return;
            d.normalize();
            const head = Math.min(0.55, len * 0.42);
            const ah = new THREE.ArrowHelper(d, from, len, hex, head, head * 0.55);
            // over the solids, not inside them — see the `front` note in build()
            for (const m of [ah.line.material, ah.cone.material]) {
                m.transparent = true; m.opacity = a; m.depthTest = false;
            }
            ah.renderOrder = 10;
            ah.line.renderOrder = 10; ah.cone.renderOrder = 10;
            modelG.add(ah);
        }

        let scalePxPerM = 20;
        function applyCam() {
            const asp = cw / Math.max(ch, 1);
            const ya = V.yaw * Math.PI/180, pa = V.pitch * Math.PI/180;
            const dir = new THREE.Vector3(Math.cos(pa)*Math.sin(ya), Math.sin(pa), Math.cos(pa)*Math.cos(ya));
            const right = new THREE.Vector3().crossVectors(dir, camera.up).normalize();
            const up = new THREE.Vector3().crossVectors(right, dir).normalize();

            // Perspective: back the camera off until the model's bounding sphere
            // just fills the NARROWER of the two half-angles, so the fit is the same
            // in portrait and landscape and zoom still means what it meant.
            const R = fitR * 1.12 / V.zoom;
            const vHalf = FOV * Math.PI / 360;                  // half the vertical fov
            const hHalf = Math.atan(Math.tan(vHalf) * asp);
            const D = R / Math.tan(Math.min(vHalf, hHalf));

            // Unlike the old parallel projection, world-per-pixel is no longer one
            // number for the whole view — near things are bigger. Both the scale bar
            // and the pan drag are therefore measured ON THE PLANE THROUGH THE MODEL
            // CENTRE, which is where the eye reads the building anyway.
            const wpp = (2 * D * Math.tan(vHalf)) / Math.max(ch, 1);
            scalePxPerM = 1 / wpp;
            panBasisR.copy(right); panBasisU.copy(up); panWpp = wpp;

            camera.fov = FOV; camera.aspect = asp;

            const tgt = fitC.clone().add(panW);
            camera.position.copy(tgt).addScaledVector(dir, D);
            // generous: the tree grove stands outside the camera-fit sphere, so a
            // tighter near plane can slice a trunk off as you orbit around to it
            camera.near = Math.max(0.01, D - fitR * 6);
            camera.far = D + fitR * 12;
            camera.lookAt(tgt);
            camera.updateProjectionMatrix();

            sun.position.copy(fitC).addScaledVector(SUN_DIR, fitR * 3);
            sun.target.position.copy(fitC);
        }

        function drawScaleBar() {
            const len = 5 * scalePxPerM;
            scaleCv.width = 160 * dpr; scaleCv.height = 30 * dpr;
            scaleCv.style.width = '160px'; scaleCv.style.height = '30px';
            sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            sctx.clearRect(0, 0, 160, 30);
            if (!isFinite(len) || len < 10 || len > 150) return;
            const x0 = 150 - len, y0 = 16;
            sctx.strokeStyle = '#111'; sctx.lineWidth = 1;
            sctx.beginPath();
            sctx.moveTo(x0, y0); sctx.lineTo(x0+len, y0);
            sctx.moveTo(x0, y0-4); sctx.lineTo(x0, y0+4);
            sctx.moveTo(x0+len, y0-4); sctx.lineTo(x0+len, y0+4);
            sctx.moveTo(x0+len/2, y0-3); sctx.lineTo(x0+len/2, y0+3);
            sctx.stroke();
            sctx.fillStyle = '#666'; sctx.font = '9px Helvetica, Arial, sans-serif';
            sctx.fillText('0', x0-3, y0+14); sctx.fillText('5 m', x0+len-8, y0+14);
        }

        function render() {
            renderer.render(scene, camera);
            drawScaleBar();
        }

        function resize() {
            dpr = Math.min(2, window.devicePixelRatio || 1);
            const r = canvas.getBoundingClientRect();
            cw = Math.max(1, Math.round(r.width));
            ch = Math.max(1, Math.round(r.height));
            renderer.setPixelRatio(dpr);
            renderer.setSize(cw, ch, false);
            applyCam(); render();
        }
        if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
        else window.addEventListener('resize', resize);

        // ---- orbit / zoom / pan
        let drag = null;
        canvas.addEventListener('pointerdown', e => {
            canvas.setPointerCapture(e.pointerId);
            drag = { x: e.clientX, y: e.clientY, pan: e.shiftKey || e.button === 1 || e.button === 2 };
            canvas.classList.add('dragging');
        });
        canvas.addEventListener('pointermove', e => {
            if (!drag) return;
            const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
            drag.x = e.clientX; drag.y = e.clientY;
            if (drag.pan) {
                panW.addScaledVector(panBasisR, dx * panWpp).addScaledVector(panBasisU, dy * panWpp);
            } else {
                V.yaw = (V.yaw + dx * 0.45) % 360;
                V.pitch = Math.max(-89, Math.min(89, V.pitch + dy * 0.35));
            }
            applyCam(); render();
        });
        const endDrag = () => { if (drag) { drag = null; canvas.classList.remove('dragging'); } };
        canvas.addEventListener('pointerup', endDrag);
        canvas.addEventListener('pointercancel', endDrag);
        canvas.addEventListener('contextmenu', e => e.preventDefault());
        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            V.zoom = Math.max(0.25, Math.min(9, V.zoom * Math.exp(-e.deltaY * 0.0016)));
            applyCam(); render();
        }, { passive: false });
        canvas.addEventListener('dblclick', () => { Object.assign(V, VIEW0); panW.set(0, 0, 0); applyCam(); render(); });

        // ---- recentre
        document.getElementById('resetBtn').addEventListener('click', () => {
            Object.assign(V, VIEW0); panW.set(0, 0, 0); applyCam(); render();
        });

        // the whole model is locked to the measured drawings; the reading is
        // whichever of the two the switch is holding (see setReading below)
        let reading = 'none';
        let gravity = 0;   // -1 inverted .. 0 normal .. +1 heavier — The Gravity Paradox

        function readParams() {
            const p = {};
            ['numFloors','numBelow','floorHeight','plateWidth','plateDepth','slabThick',
             'postSize','roofEdge','roofRise','coreLen','coreDep','coreWall'].forEach(k => p[k] = REAL[k]);
            p.showStairs = true;
            p.gravity = gravity;
            p.floors = floorsFor(p.numFloors);
            return p;
        }

        /* ============================================================
           THE GARDEN — white leafless trees a few metres off the front
           facade. The longer you look at a reading, the more its shadow
           leaves realism: it crawls across the grass to the wall and
           stands up — an uneven colonnade for the temple, the building's
           own few even piloti for Dom-ino. Never exact, never in step.
           ============================================================ */
        const FRONT_Z = REAL.plateDepth / 2;                 // +Z face of the building
        const GARDEN_GAP = 5.0;                              // trees stand this far off it
        const GROUND_Y = -REAL.slabThick + 0.002;
        const H_ = REAL.postSize / 2;
        const DOMINO_FRONT_X = [-REAL.plateWidth/2 + H_, 0, REAL.plateWidth/2 - H_];
        // the seven peristyle column lines across the long face (the old temple overlay)
        const TEMPLE_LINES = Array.from({ length: 7 }, (_, i) => -REAL.plateWidth/2 + i * REAL.plateWidth/6);

        const rng = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
        // Hockney's non-naturalistic trunks — one bright viridian hero, the rest
        // plum / mauve / teal / terracotta, one flat colour per tree
        const BARK = [0x1a8f6f, 0x7a3b6b, 0x8e5aa0, 0x2f6f5e, 0xb5623a, 0x1a8f6f];
        const SHADOW_MAT = new THREE.MeshBasicMaterial({ color: 0x7d6f86, transparent: true, opacity: 0.34, depthWrite: false, side: THREE.DoubleSide });
        // a faint sheet across the front of the building — a screen for the shadows to land on
        const SCREEN_MAT = new THREE.MeshBasicMaterial({ color: 0xdadada, transparent: true, opacity: 0.30, depthWrite: false, side: THREE.DoubleSide });
        const YUP_ = new THREE.Vector3(0, 1, 0);
        const groveG = new THREE.Group();  scene.add(groveG);
        const shadowG = new THREE.Group(); scene.add(shadowG);

        // scattered, uneven — x spans (a little past) the facade, z stepped back
        const TREES = [
            [-10.5, 3.8, 6.6, 11], [-7.6, 5.3, 5.6, 23], [-5.0, 3.3, 7.1, 37],
            [-2.3, 5.6, 6.0, 41], [ 0.4, 3.5, 6.4, 52], [ 3.0, 5.4, 5.3, 64],
            [ 5.6, 3.6, 6.9, 77], [ 8.3, 5.1, 5.8, 88], [ 10.8, 3.9, 6.3, 95],
        ].map(([x, back, h, seed], i) => {
            const nearLine = TEMPLE_LINES.reduce((a, b) => Math.abs(b - x) < Math.abs(a - x) ? b : a);
            return {
                x, z: FRONT_Z + GARDEN_GAP + back, h, seed,
                colX: 0, isDom: false,
                lineX: nearLine + (rng(seed * 3 + 1)() - 0.5) * 0.7,   // near the peristyle line, not on it
                uoff: rng(seed * 11 + 3)() * 0.22,                     // a small head-start spread
                goff: rng(seed * 19 + 7)() * 0.30,                     // grows a beat after its neighbour
                taper: 0.06 + rng(seed * 13 + 5)() * 0.13,             // tip width as a fraction of the base
                bark: i === 0 ? 0x1a8f6f : BARK[rng(seed * 17 + 9)() * BARK.length | 0],
                cur: { raise: 0, x },                                  // animated state
            };
        });
        // for Dom-ino, only the tree nearest each real front-face post throws a
        // shadow — three of them, landing exactly on the column
        DOMINO_FRONT_X.forEach(cx => {
            let best = null, bd = 1e9;
            TREES.forEach(t => { const d = Math.abs(t.x - cx); if (d < bd) { bd = d; best = t; } });
            if (best) { best.isDom = true; best.colX = cx; }
        });

        function limb_(parent, from, to, r0, r1, mat) {
            const d = new THREE.Vector3().subVectors(to, from);
            const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, d.length(), 6), mat);
            m.position.copy(from).addScaledVector(d, 0.5);
            m.quaternion.setFromUnitVectors(YUP_, d.clone().normalize());
            parent.add(m);
        }
        TREES.forEach(t => {
            const r = rng(t.seed);
            const bmat = new THREE.MeshLambertMaterial({ color: t.bark });
            const g = new THREE.Group(); g.position.set(t.x, GROUND_Y, t.z); groveG.add(g);
            const top = new THREE.Vector3((r() - 0.5) * 0.8, t.h, (r() - 0.5) * 0.7);
            limb_(g, new THREE.Vector3(0, 0, 0), top, 0.16, 0.05, bmat);
            const nb = 2 + (r() * 3 | 0);
            for (let i = 0; i < nb; i++) {
                const b = top.clone().multiplyScalar(0.4 + r() * 0.5);
                const a = r() * 6.28, rr = 0.7 + r() * 1.1;
                const e = b.clone().add(new THREE.Vector3(Math.cos(a) * rr, 0.7 + r() * 1.4, Math.sin(a) * rr));
                limb_(g, b, e, 0.045, 0.02, bmat);
                if (r() > 0.5) {
                    const e2 = e.clone().add(new THREE.Vector3(Math.cos(a + 0.7) * 0.6, 0.5 + r() * 0.9, Math.sin(a + 0.7) * 0.6));
                    limb_(g, e, e2, 0.022, 0.012, bmat);
                }
            }
            const disc = new THREE.Mesh(new THREE.CircleGeometry(0.5, 16),
                new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.10, depthWrite: false }));
            disc.rotation.x = -Math.PI / 2; disc.position.y = 0.015; g.add(disc);
            g.scale.set(1, 0, 1); g.visible = false;                    // starts underground, asleep
        });

        const sstep_ = (a, b, x) => { x = Math.max(0, Math.min(1, (x - a) / (b - a))); return x * x * (3 - 2 * x); };
        const lerp_  = (a, b, t) => a + (b - a) * t;

        // a flat blade that narrows to a near-point at the top — a tree, loosely
        function spireGeom(wBot, wTop, H) {
            const hb = wBot / 2, ht = wTop / 2, y0 = -H / 2, y1 = H / 2;
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
                -hb, y0, 0,   hb, y0, 0,   ht, y1, 0,
                -hb, y0, 0,   ht, y1, 0,  -ht, y1, 0,
            ]), 3));
            return g;
        }

        // each tree carries an animated { raise 0..1, x }. buildGroveShadows just
        // draws whatever those currently are — the tween below moves them.
        function buildGroveShadows() {
            clearGroup(shadowG);
            if (grown <= 0.001) return;                        // no garden while it sleeps
            const mat = SHADOW_MAT;
            const H0 = REAL.numFloors * REAL.floorHeight;        // up to the third floor

            // the faint screen across the front of the building
            SCREEN_MAT.opacity = 0.30 * Math.min(1, grown);
            const scr = new THREE.Mesh(new THREE.PlaneGeometry(REAL.plateWidth + 0.6, H0), SCREEN_MAT);
            scr.position.set(0, GROUND_Y + H0 / 2, FRONT_Z + 0.02);
            shadowG.add(scr);

            TREES.forEach((t, i) => {
                const raise = t.cur.raise * Math.min(1, grown);
                if (raise <= 0.002) return;
                const crawl = sstep_(0, 0.45, raise);           // tongue reaches the wall first
                const stand = sstep_(0.4, 1, raise);            // then the column climbs
                const x = t.cur.x;
                if (crawl > 0) {
                    const reach = (t.z - FRONT_Z - 0.1) * crawl;
                    if (reach > 0.05) {
                        const m = new THREE.Mesh(new THREE.PlaneGeometry(0.42, reach), mat);
                        m.rotation.x = -Math.PI / 2;
                        m.position.set(lerp_(t.x, x, 0.5), GROUND_Y + 0.02, t.z - reach / 2);
                        shadowG.add(m);
                    }
                }
                if (stand > 0) {
                    const H = H0 * stand;
                    const w = (reading === 'domino' && t.isDom) ? 0.16 : 0.5;
                    const m = new THREE.Mesh(spireGeom(w, w * t.taper, H), mat);
                    m.position.set(x, GROUND_Y + H / 2, FRONT_Z + 0.05 + i * 0.004);
                    shadowG.add(m);
                }
            });
        }

        // The switch holds a reading. Pressing Greek or Dom-ino wakes the garden —
        // the trees grow out of the ground, then the shadows move to that reading
        // and STAY there. Pressing the one already held puts the garden back to
        // sleep. Nothing cycles on its own any more: the reading is the viewer's,
        // not the clock's.
        const easeIO = x => x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
        const STUB = 0.14;                                 // shadow left lying on the ground
        function targetFor(state, t) {
            if (state === 'temple') return { raise: 1, x: t.lineX };
            if (state === 'domino') return t.isDom ? { raise: 1, x: t.colX } : { raise: STUB, x: t.x };
            return { raise: 0, x: t.x };
        }

        const LEG_S = 6, GROW_S = 2.2, RETRACT_S = 1.5;
        let legU = 0, legActive = false;
        let awake = false, grown = 0, growDir = 0;         // grown 0 = underground, 1 = full grove
        let groveRAF = 0, groveLast = 0;
        let pending = 'temple';                            // the reading to take up once grown
        const froms = [], tgts = [];

        function applyGrowth() {
            for (let i = 0; i < groveG.children.length; i++) {
                const t = TREES[i], g = groveG.children[i];
                const eg = easeIO(Math.max(0, Math.min(1, (grown - t.goff) / (1 - t.goff))));
                g.scale.set(1, eg, 1);
                g.visible = eg > 0.001;
            }
        }
        function beginLeg(state) {
            TREES.forEach((t, i) => { froms[i] = { raise: t.cur.raise, x: t.cur.x }; tgts[i] = targetFor(state, t); });
            reading = state; syncSwitch();
            legU = 0; legActive = true;
        }

        function groveTick(now) {
            groveRAF = 0;
            const dt = Math.min(0.05, (now - groveLast) / 1000); groveLast = now;

            if (growDir !== 0) {
                grown = Math.max(0, Math.min(1, grown + growDir * dt / (growDir > 0 ? GROW_S : RETRACT_S)));
                applyGrowth();
                if (growDir > 0 && grown >= 1) { growDir = 0; if (awake) beginLeg(pending); }
                if (growDir < 0 && grown <= 0) {
                    growDir = 0; legActive = false; reading = 'none'; syncSwitch();
                    TREES.forEach(t => { t.cur.raise = 0; t.cur.x = t.x; });
                }
            }

            if (legActive && grown >= 0.999) {
                legU = Math.min(1, legU + dt / LEG_S);
                TREES.forEach((t, i) => {
                    const f = froms[i], g = tgts[i];
                    const uu = easeIO(Math.max(0, Math.min(1, (legU - t.uoff) / (1 - t.uoff))));
                    t.cur.raise = f.raise + (g.raise - f.raise) * uu;
                    t.cur.x     = f.x     + (g.x     - f.x)     * uu;
                });
                if (legU >= 1) legActive = false;             // and it stays where it was put
            }

            buildGroveShadows();
            render();
            if (growDir !== 0 || legActive) groveRAF = requestAnimationFrame(groveTick);
        }
        function runGrove() { if (!groveRAF) { groveLast = performance.now(); groveRAF = requestAnimationFrame(groveTick); } }

        // ---- the reading switch
        const readSwitch = document.getElementById('mode');
        function syncSwitch() {
            readSwitch.querySelectorAll('button').forEach(b =>
                b.classList.toggle('active', b.dataset.r === reading));
        }
        function setReading(next) {
            if (awake && next === pending) {        // pressing the held reading sends it back to sleep
                awake = false; legActive = false; growDir = -1;
            } else {
                pending = next;
                if (!awake) { awake = true; growDir = 1; reading = next; syncSwitch(); }
                else if (grown >= 0.999) beginLeg(next);     // already up: just walk the shadows across
                else { reading = next; syncSwitch(); }       // still growing: it will take this up on arrival
            }
            runGrove();
        }
        readSwitch.querySelectorAll('button').forEach(b =>
            b.addEventListener('click', () => setReading(b.dataset.r)));

        // The Gravity Paradox: the slider drives itself, live — no tween needed,
        // dragging it is the animation. The readout is the real gravity vector the
        // model is being built with (gEff in build()): 1.0 g as built, 2.0 g at the
        // right stop, through weightless at half travel to -1.0 g at the left.
        const gravitySlider = document.getElementById('gravitySlider');
        const gravVal = document.getElementById('gravVal');
        const SNAP = 0.04;                      // a dead zone, so as-built is reachable by hand
        function applyGravity(v) {
            gravity = Math.abs(v) < SNAP ? 0 : v;
            const gEff = gravity < 0 ? 1 + 2*gravity : 1 + gravity;
            gravVal.textContent = (gEff < 0 ? '−' : '') + Math.abs(gEff).toFixed(1) + ' g';
            gravVal.classList.toggle('at0', gravity === 0);
            update();
        }
        gravitySlider.addEventListener('input', () => applyGravity(+gravitySlider.value));
        gravitySlider.addEventListener('dblclick', () => { gravitySlider.value = 0; applyGravity(0); });

        function update() {
            const p = readParams();
            const risers = Math.max(2, Math.round(p.floorHeight / REAL.riser));
            renderScene(p, risers);
            applyCam();
            applyGrowth();
            buildGroveShadows();
            render();
        }

        syncSwitch();
        update();
        resize();
        // the garden starts asleep — either button of the switch wakes it
    </script>
</body>
</html>
