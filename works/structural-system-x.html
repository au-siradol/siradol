                strip(-W/2, W/2, -D/2, -hz);
                strip(-W/2, W/2,  hz, D/2);
                strip(-W/2, -cl/2, -hz, hz);
                strip( cl/2,  W/2, -hz, hz);
                if (cut === 'landing') strip(-cl/2 + flight0, cl/2 - flight0, -hz, hz);
            }
            // ground floor (and any basement) stays solid over the core; the second
            // floor keeps its central landing; higher floors are cut fully open
            for (let i = -p.numBelow; i < p.numFloors; i++)
                slab(i*fh, i <= 0 ? false : (i === 1 ? 'landing' : true));

            // Core: two long walls, open at the short ends. Read off the three plans:
            //   floor 1  - both walls solid (the storey-1 opening was pulled back).
            //   floor 2  - both walls solid, no openings (the stair only passes).
            //   top floor - both walls solid to full height with 0.80 m x 2.0 m door
            //              openings near the middle: two in the front wall (each side
            //              of the foyer), one in the back wall (the through door).
            const y0c = botY - p.slabThick;
            const s1 = 0, s2 = fh, s3 = (p.numFloors - 1) * fh, doorH = 2.0;
            // Ground storey: the core keeps its wall and takes a door in the front.
            // Placed off the MODEL photographs, where a single opening sits on the
            // building's centreline — the pair of slots you see there is one 0.80 m
            // door read through both core walls (1.744 m apart), the far one thrown
            // slightly off the near one because the camera is a little off axis.
            // The DRAWINGS disagree: plan 0's THIN layer puts a 0.70 m leaf away at
            // x -5.58..-4.88, against the left end of the front wall's stub. Model
            // and plan are simply different stages; this follows the model.
            const G_DOOR = [-0.40, 0.40];
            const notch = (a, b, holes) => {   // solid x-spans of [a,b] with holes removed
                const out = []; let x = a;
                holes.slice().sort((p, q) => p[0] - q[0]).forEach(([h0, h1]) => {
                    if (h0 > x) out.push([x, h0]);
                    x = Math.max(x, h1);
                });
                if (b > x) out.push([x, b]);
                return out;
            };
            function coreWall(zc, front) {
                const spans = (y0, y1) => {
                    const ym = (y0 + y1) / 2;
                    if (p.numFloors >= 3 && ym > s3 && ym < s3 + doorH)      // top-storey doors
                        return notch(-cl/2, cl/2, front ? [[-1.30, -0.50], [0.50, 1.30]] : [[0.50, 1.30]]);
                    if (front && ym > s1 && ym < s1 + doorH)                 // ground-storey door
                        return notch(-cl/2, cl/2, [G_DOOR]);
                    return [[-cl/2, cl/2]];
                };
                const ys = [...new Set([y0c, s1, s1 + doorH, s2, s3, s3 + doorH, topY])]
                    .filter(v => v <= topY + 1e-6).sort((a, b) => a - b);
                for (let k = 0; k < ys.length - 1; k++) {
                    const ya = ys[k], yb = ys[k+1];
                    if (yb - ya < 1e-4) continue;
                    for (const [x0, x1] of spans(ya, yb))
                        if (x1 - x0 > 1e-4) box((x0 + x1)/2, ya, zc, x1 - x0, yb - ya, cwall, 'core');
                }
            }
            coreWall( cd/2 - cwall/2, true);    // front wall (+z)
            coreWall(-cd/2 + cwall/2, false);   // back wall (-z)

            // The 'double stair' — the device the project is named after.
            // One stair is a PAIR of flights travelling left across the core: a flight
            // at the right end, a landing in the middle, then a flight at the left end.
            // 4.48 + 3.25 + 4.48 = 12.21 m, the core length exactly — so one stair
            // consumes the whole core and climbs TWO storeys, no more. The second
            // stair is that same pair started one floor higher. With four floors that
            // gives exactly two: A links 0-1-2, B links 1-2-3. Each skips a floor the
            // other stops at, and they pass at opposite ends of the core — Flammer's
            // "moving through the office conventionally, or if necessary, unseen".
            if (p.showStairs) {
                const clear = cd/2 - cwall;
                const flight = Math.min((risers - 1) * REAL.going, cl/2 - 0.05);
                const run = (x0, dir, base) => {
                    for (let r = 1; r <= risers; r++) {
                        const y0 = base + (r-1)*fh/risers, y1 = base + r*fh/risers;
                        const xa = x0 + dir*(r-1)*flight/risers, xb = x0 + dir*r*flight/risers;
                        box((xa+xb)/2, y1 - 0.04*fh, 0, Math.abs(xb-xa), 0.04*fh, 2*clear, 'stair');
                        box(xa, y0, 0, 0.03, y1-y0, 2*clear, 'stair');
                    }
                };
                const RIGHT = cl/2, LEFT = -cl/2 + flight;
                for (let k = -p.numBelow; k + 2 <= p.numFloors - 1; k++) {
                    run(RIGHT, -1,  k      * fh);        // stair A: right end, then left
                    run(LEFT,  -1, (k + 1) * fh);
                    run(LEFT,  -1,  k      * fh);        // stair B: the same pair, mirrored
                    run(RIGHT, -1, (k + 1) * fh);        //   — two routes that never meet
                }
            }

            // Roof: a slab with a FLAT SOFFIT thickest in the middle, both ways. The
            // top surface is lift(x,z); the crest reaches full crown height out to the
            // four mid-side posts and drops to the eave only at the corners. Locked to
            // the measured wedge - the soffit and fascia are solid here, the top
            // surface is built in three.js as a smooth mesh.
            const soff = topY - p.roofEdge;
            const lift = (x, z) => topY + p.roofRise * (1 - Math.abs(2*x/W) * Math.abs(2*z/D));
            {
                const above = { x:0, y:topY + 60, z:0 };
                const midpt = { x:0, y:soff + p.roofEdge/2, z:0 };
                const S0 = (x,z) => ({ x, y:soff, z });
                quad(S0(-W/2,-D/2), S0(W/2,-D/2), S0(W/2,D/2), S0(-W/2,D/2), above, 'roof');   // soffit
                const NX = 16, NZ = 10;
                for (let i = 0; i < NX; i++) {
                    const xa = -W/2 + i*W/NX, xb = -W/2 + (i+1)*W/NX;
                    for (let j = 0; j < NZ; j++) {
                        const za = -D/2 + j*D/NZ, zb = -D/2 + (j+1)*D/NZ;
                        const A={x:xa,y:lift(xa,za),z:za}, B={x:xb,y:lift(xb,za),z:za},
                              Cc={x:xb,y:lift(xb,zb),z:zb}, Dd={x:xa,y:lift(xa,zb),z:zb};
                        if (j === 0)     quad(S0(xa,za), S0(xb,za), B, A, midpt, 'roof');
                        if (j === NZ-1)  quad(Dd, Cc, S0(xb,zb), S0(xa,zb), midpt, 'roof');
                        if (i === 0)     quad(S0(xa,zb), S0(xa,za), A, Dd, midpt, 'roof');
                        if (i === NX-1)  quad(Cc, B, S0(xb,za), S0(xb,zb), midpt, 'roof');
                    }
                }
                // top-floor partitions, 45 deg in from each corner. They run all the way
                // to the core (no gap, no vertical seam); a 1.0 m wide x 2.0 m tall door
                // is cut just short of the core end.
                // Measured on plan 2 at the +x +z corner: the solid wall runs 5.63 m
                // from the mitre to a jamb at (7.04, 1.76); a 0.90 m opening (two
                // jambs 0.222 and 0.216 long — the wall's own thickness — with the
                // THIN layer's door leaf drawn across it); then a 0.54 m stub to the
                // corner of the core at x 6.100, which is the measured coreLen/2.
                // 5.63 + 0.90 + 0.54 = 7.07 against a computed reach of 7.00.
                // The old 4.06 / 1.00 put the door a metre and a half too far out.
                const wr = REAL.wallRun;          // no clamp: the plate is locked to REAL
                const baseY = topY - fh - p.slabThick, headY = topY - fh + 2.0, dW = REAL.wallDoor;
                // The wall is MITRED to the building line: in plan 2 its two faces
                // start on the two plate edges, 0.227/sqrt2 = 0.161 m either side of
                // the corner, measured at (-10.937, -5.824) and (-11.098, -5.672)
                // against a corner at (-11.098, -5.824). That is exactly
                //   corner + u*(t/2) +- n*(t/2),
                // so setting the centreline back along the diagonal by half the wall
                // thickness puts both faces where the drawing puts them. Starting it
                // on the corner itself — as this did — threw the square end cap
                // 0.08 m past the building line in x and z at all four corners.
                const mitre = REAL.wallThick / 2;
                const reach = Math.SQRT2 * (D/2 - cd/2) - mitre;    // set-back start -> core face
                [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(c => {
                    const ux = -c[0]/Math.SQRT2, uz = -c[1]/Math.SQRT2;
                    const Ax = c[0]*W/2 + ux*mitre, Az = c[1]*D/2 + uz*mitre;
                    const Bx = Ax + ux*wr, Bz = Az + uz*wr;
                    const bdx = Bx + ux*dW, bdz = Bz + uz*dW;
                    const Cx = Ax + ux*reach, Cz = Az + uz*reach;
                    wall(Ax, Az, Bx, Bz, baseY, soff, REAL.wallThick, 'wall');       // measured wall
                    wall(Bx, Bz, bdx, bdz, headY, soff, REAL.wallThick, 'wall');     // lintel over the door
                    if (wr + dW < reach - 0.05)
                        wall(bdx, bdz, Cx, Cz, baseY, soff, REAL.wallThick, 'wall'); // door -> core, full height
                });
            }

            // four posts a floor, each standing between the plate below and the one
            // above, buried 20 mm into each so its outline stays in the open storey
            // and not on the plates. Top-floor posts stop at the roof soffit.
            p.floors.forEach((f, idx) => {
                postsAt(f.pos, p).forEach(q => {
                    const pB = idx*fh - 0.02;
                    const pT = (idx === p.numFloors - 1 ? soff : (idx+1)*fh - p.slabThick) + 0.02;
                    box(q.x, pB, q.z, S, pT - pB, S, 'post');
                });
            });

            // Furniture, drawn flat on each plate from the plans' own FURN layer.
            // Lines only — it is plan information lying on the floor, not objects.
            // The plans also draw the STAIR in plan: the ladder of treads at 0.279 m
            // (the measured going) and its direction arrows. The stair is modelled in
            // three dimensions a few lines above, so its plan drawing is dropped here
            // rather than deleted from FURN, which stays as measured. Everything the
            // plans put inside the core band is that drawing: the clear between the
            // core walls is only hz = 0.601 m, and no desk is in there.
            const inCore = (z0, z1) => Math.abs(z0) <= hz + 0.02 && Math.abs(z1) <= hz + 0.02;
            for (let fi = 0; fi < FURN.length && fi < p.numFloors; fi++) {
                const fy = fi * fh + 0.012;
                for (const q of FURN[fi])
                    for (let i = 0; i + 3 < q.length; i += 2) {
                        if (inCore(q[i+1], q[i+3])) continue;
                        line({ x:q[i], y:fy, z:q[i+1] }, { x:q[i+2], y:fy, z:q[i+3] },
                             'rgba(70,70,70,0.45)', 1);
                    }
            }

            return { tris, lines, topY, W, D, cl, cd, lift };
        }

        /* ============================================================
           THREE.JS RENDER
           ============================================================ */
        const canvas = document.getElementById('simCanvas');
        const wrap = canvas.parentElement;
        const scaleCv = document.createElement('canvas');
        scaleCv.className = 'scalebar';
        wrap.appendChild(scaleCv);
        const sctx = scaleCv.getContext('2d');

        // The camera is not free: it walks a fixed path. Three stations — seen from
        // across the garden, from the near corner, and from under the eaves — with
        // the eye dropping as you come in, the way it does when a building stops
        // being an object in a field and becomes something you stand under.
        const STATIONS = [
            // The far station is framed after the photograph of the Acropolis seen
            // from Philopappos: the eye is BELOW the building and looking slightly
            // up, so the colonnade and the architrave are what you get and the roof
            // is not in the picture at all; and the thing sits small, high and to
            // the right of the frame, the way something far away sits in a view
            // rather than being presented for inspection.
            // panR / panU shift the camera's aim, in metres. Watch the signs: `dir`
            // runs from the model TO the camera, so the `right` built from it is
            // screen LEFT, and the aim moving one way sends the model the other.
            // Measured on screen at this zoom, 1 m is about 4.3 px: positive panR
            // carries the model right, negative panU carries it up.
            // The other two zooms match the building's height against the frame in
            // the reference frames: about 33% and 73%.
            { yaw: -32, pitch:  -5, zoom: 0.26, panR:  17, panU: -20 },  // far
            { yaw: -32, pitch:  24, zoom: 0.62, panR:   0, panU:  0 },   // middle
            { yaw: -32, pitch:  17, zoom: 1.36, panR:   0, panU:  0 },   // near
        ];
        const panW = new THREE.Vector3();                 // kept at zero; applyCam still reads it
        const V = Object.assign({}, STATIONS[0]);
        let cw = 1100, ch = 620, dpr = 1;

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setClearColor(0x000000, 0);
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const scene = new THREE.Scene();
        const FOV = 32;                                                         // long lens: perspective, but gentle
        const camera = new THREE.PerspectiveCamera(FOV, 1, 0.01, 8000);
        camera.up.set(0, 1, 0);

        // No outlines anywhere, so light alone has to carry the form.
        // The key light rides the CAMERA, so the building is lit the same from
        // every orbit position — turn all the way round and no side falls into
        // the dark. It sits off the viewer's left shoulder and a little above.
        const key = new THREE.DirectionalLight(0xffffff, 0.80);
        key.position.set(-0.35, 0.75, 0.55);       // in the camera's own space
        camera.add(key);
        scene.add(camera);                          // children of the camera only
                                                    // render if the camera is in the scene
        // The hemisphere does the real drawing: white overhead, grey underfoot, so
        // a face that looks up goes near-white and a soffit falls to mid grey. That
        // fall is the ONLY reason a white building reads against a white page —
        // there are no outlines and no coloured field to help. It is also a cheap
        // stand-in for the ambient occlusion a render would give the deep recesses.
        // The intensity and the ground colour have to move in opposite directions:
        // raising the intensity alone lifts the soffits as much as the roof and
        // nothing separates. Bright enough to clip the up-facing surfaces to white,
        // dark enough underneath that the underside of every plate stays grey.
        scene.add(new THREE.HemisphereLight(0xffffff, 0x858585, 1.80));
        scene.add(new THREE.AmbientLight(0xffffff, 0.03));

        // one white for the whole building. No emissive: a self-lit floor would
        // raise the soffits and flatten exactly the gradient being relied on here.
        const MAT = {
            card: new THREE.MeshLambertMaterial({
                color: 0xffffff, side: THREE.DoubleSide, shadowSide: THREE.BackSide
            })
        };

        let modelG = new THREE.Group();
        scene.add(modelG);
        let fitR = 20;
        const fitC = new THREE.Vector3();

        function clearGroup(g) {
            g.traverse(o => { if (o.geometry) o.geometry.dispose(); });
            while (g.children.length) g.remove(g.children[0]);
        }
        function parseCol(s) {
            const m = String(s).match(/rgba?\(([^)]+)\)/);
            if (!m) return { hex: 0x333333, a: 1 };
            const q = m[1].split(',').map(x => parseFloat(x));
            return { hex: (Math.round(q[0])<<16) | (Math.round(q[1])<<8) | Math.round(q[2]), a: q[3] == null ? 1 : q[3] };
        }
        function triGeom(ts) {
            const pos = new Float32Array(ts.length * 9), nor = new Float32Array(ts.length * 9);
            let k = 0;
            for (const t of ts) for (const v of t.p) {
                pos[k] = v.x; pos[k+1] = v.y; pos[k+2] = v.z;
                nor[k] = t.n.x; nor[k+1] = t.n.y; nor[k+2] = t.n.z; k += 3;
            }
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
            return g;
        }

        function renderScene(p, risers) {
            clearGroup(modelG);
            const B = build(p, risers);

            // ---- solids. One white material, no outlines of any kind: every edge
            // in the image is a real turn of a surface, read off the shading.
            const byTint = {};
            for (const t of B.tris) (byTint[t.tint] || (byTint[t.tint] = [])).push(t);
            for (const tint in byTint) {
                modelG.add(new THREE.Mesh(triGeom(byTint[tint]), MAT.card));
            }

            // ---- roof top: a smooth mesh so the wedge is not faceted
            {
                const g = new THREE.PlaneGeometry(B.W, B.D, 30, 20);
                g.rotateX(-Math.PI / 2);
                const pos = g.attributes.position;
                for (let i = 0; i < pos.count; i++) pos.setY(i, B.lift(pos.getX(i), pos.getZ(i)));
                pos.needsUpdate = true;
                g.computeVertexNormals();
                modelG.add(new THREE.Mesh(g, MAT.card));
            }

            // ---- plan lines lying on the floors (the furniture)
            const groups = {};
            for (const l of B.lines) {
                const { hex, a } = parseCol(l.color);
                const key = hex + '|' + a.toFixed(2);
                (groups[key] || (groups[key] = { hex, a, pts: [] })).pts
                    .push(l.a.x, l.a.y, l.a.z, l.b.x, l.b.y, l.b.z);
            }
            for (const key in groups) {
                const gr = groups[key];
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.Float32BufferAttribute(gr.pts, 3));
                modelG.add(new THREE.LineSegments(geo,
                    new THREE.LineBasicMaterial({ color: gr.hex, transparent: true, opacity: gr.a })));
            }


            // ---- camera fit from the model's own bounds (rotation invariant)
            let mnx=1e9,mny=1e9,mnz=1e9,mxx=-1e9,mxy=-1e9,mxz=-1e9;
            for (const t of B.tris) for (const v of t.p) {
                if (v.x<mnx) mnx=v.x; if (v.x>mxx) mxx=v.x;
                if (v.y<mny) mny=v.y; if (v.y>mxy) mxy=v.y;
                if (v.z<mnz) mnz=v.z; if (v.z>mxz) mxz=v.z;
            }
            fitC.set((mnx+mxx)/2, (mny+mxy)/2, (mnz+mxz)/2);
            fitR = 0.5 * Math.hypot(mxx-mnx, mxy-mny, mxz-mnz) || 20;
        }

        let scalePxPerM = 20;
        function applyCam() {
            const asp = cw / Math.max(ch, 1);
            const ya = V.yaw * Math.PI/180, pa = V.pitch * Math.PI/180;
            const dir = new THREE.Vector3(Math.cos(pa)*Math.sin(ya), Math.sin(pa), Math.cos(pa)*Math.cos(ya));
            // the camera's own right and up, used only to place the aim off-centre
            const right = new THREE.Vector3().crossVectors(dir, camera.up).normalize();
            const up = new THREE.Vector3().crossVectors(right, dir).normalize();
            panW.set(0, 0, 0).addScaledVector(right, V.panR || 0).addScaledVector(up, V.panU || 0);

            // Perspective: back the camera off until the model's bounding sphere
            // just fills the NARROWER of the two half-angles, so the fit is the same
            // in portrait and landscape and zoom still means what it meant.
            const R = fitR * 1.12 / V.zoom;
            const vHalf = FOV * Math.PI / 360;                  // half the vertical fov
            const hHalf = Math.atan(Math.tan(vHalf) * asp);
            const D = R / Math.tan(Math.min(vHalf, hHalf));

            // In perspective, world-per-pixel is not one number for the whole view —
            // near things are bigger. The scale bar is therefore measured ON THE
            // PLANE THROUGH THE MODEL CENTRE, which is where the eye reads the
            // building anyway.
            scalePxPerM = Math.max(ch, 1) / (2 * D * Math.tan(vHalf));

            camera.fov = FOV; camera.aspect = asp;

            const tgt = fitC.clone().add(panW);
            camera.position.copy(tgt).addScaledVector(dir, D);
            // kept generous: a tight near plane slices the building as you orbit in
            camera.near = Math.max(0.01, D - fitR * 6);
            camera.far = D + fitR * 12;
            camera.lookAt(tgt);
            camera.updateProjectionMatrix();
            // the key light is a child of the camera, so it has just followed it —
            // nothing to place here any more
        }

        function drawScaleBar() {
            const len = 5 * scalePxPerM;
            scaleCv.width = 160 * dpr; scaleCv.height = 30 * dpr;
            scaleCv.style.width = '160px'; scaleCv.style.height = '30px';
            sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            sctx.clearRect(0, 0, 160, 30);
            if (!isFinite(len) || len < 10 || len > 150) return;
            const x0 = 150 - len, y0 = 16;
            sctx.strokeStyle = '#111'; sctx.lineWidth = 1;
            sctx.beginPath();
            sctx.moveTo(x0, y0); sctx.lineTo(x0+len, y0);
            sctx.moveTo(x0, y0-4); sctx.lineTo(x0, y0+4);
            sctx.moveTo(x0+len, y0-4); sctx.lineTo(x0+len, y0+4);
            sctx.moveTo(x0+len/2, y0-3); sctx.lineTo(x0+len/2, y0+3);
            sctx.stroke();
            sctx.fillStyle = '#666'; sctx.font = '9px Helvetica, Arial, sans-serif';
            sctx.fillText('0', x0-3, y0+14); sctx.fillText('5 m', x0+len-8, y0+14);
        }

        function render() {
            renderer.render(scene, camera);
            drawScaleBar();
        }

        function resize() {
            dpr = Math.min(2, window.devicePixelRatio || 1);
            const r = canvas.getBoundingClientRect();
            cw = Math.max(1, Math.round(r.width));
            ch = Math.max(1, Math.round(r.height));
            renderer.setPixelRatio(dpr);
            renderer.setSize(cw, ch, false);
            applyCam(); render();
        }
        if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
        else window.addEventListener('resize', resize);

        // ---- the walk. The camera is locked to the path: no orbit, no wheel zoom,
        // no pan. The slider is the only way the view moves.
        const walkSlider = document.getElementById('walkSlider');
        function walkTo(t) {
            t = Math.max(0, Math.min(1, t));
            const seg = STATIONS.length - 1;          // two legs across three stations
            const u = t * seg;
            const i = Math.min(seg - 1, Math.floor(u));
            const f = u - i;
            const e = f * f * (3 - 2 * f);            // ease at each station, not a hard corner
            const A = STATIONS[i], B = STATIONS[i + 1];
            V.yaw   = A.yaw   + (B.yaw   - A.yaw)   * e;
            V.pitch = A.pitch + (B.pitch - A.pitch) * e;
            V.panR  = A.panR  + (B.panR  - A.panR)  * e;   // the aim slides back to
            V.panU  = A.panU  + (B.panU  - A.panU)  * e;   // centre as you walk in
            // zoom moves geometrically: "closer" is a ratio, not a difference, so a
            // linear ramp would crawl at the far end and rush at the near one
            V.zoom  = Math.exp(Math.log(A.zoom) + (Math.log(B.zoom) - Math.log(A.zoom)) * e);
            applyCam(); render();
        }
        walkSlider.addEventListener('input', () => walkTo(+walkSlider.value));

        function readParams() {
            const p = {};
            ['numFloors','numBelow','floorHeight','plateWidth','plateDepth','slabThick',
             'postSize','roofEdge','roofRise','coreLen','coreDep','coreWall'].forEach(k => p[k] = REAL[k]);
            p.showStairs = true;
            p.floors = floorsFor(p.numFloors);
            return p;
        }

        function update() {
            const p = readParams();
            const risers = Math.max(2, Math.round(p.floorHeight / REAL.riser));
            renderScene(p, risers);
            applyCam();
            render();
        }

        // The model is built once. Nothing animates: from here on the page only
        // redraws when the slider moves it.
        update();
        resize();
        walkTo(+walkSlider.value);
    </script>
</body>
</html>
