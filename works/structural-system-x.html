    <style>

    <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        /* ============================================================
           MEASURED CONSTANTS  (A4 @300dpi, group scale 300/72 -> units
           are PostScript points, plotted at 1:200. The stair fixes the
           scale: going 0.279, riser 0.179, 2R+G = 0.637.)
           ============================================================ */
        const REAL = {
            numFloors: 3, numBelow: 0,
            floorHeight: 3.04, plateWidth: 22.18, plateDepth: 11.64,
            slabThick: 0.237, postSize: 0.22,
            roofEdge: 0.423, roofRise: 0.720,
            coreLen: 12.21, coreDep: 1.744, coreWall: 0.271,
            going: 0.279, riser: 0.179, wallThick: 0.227, wallRun: 4.06
        };
        // Ground posts mid-side, first floor at the corners, top floor mid-side
        // again, so no post lands on the one below it. Ground bears; everything
        // above is hung, with the mid-points of the long sides kept as the one
        // real compression prop among the disguised posts.
        function floorsFor(n) {
            const out = [];
            for (let i = 0; i < n; i++) out.push({ pos: i % 2 ? 'corner' : 'mid', role: i === 0 ? 'strut' : 'tie' });
            return out;
        }
        const PROP_KIND = 'long';

        const sub  = (a,b) => ({ x:a.x-b.x, y:a.y-b.y, z:a.z-b.z });
        const cross= (a,b) => ({ x:a.y*b.z-a.z*b.y, y:a.z*b.x-a.x*b.z, z:a.x*b.y-a.y*b.x });
        const dot  = (a,b) => a.x*b.x + a.y*b.y + a.z*b.z;
        const norm = a => { const l = Math.hypot(a.x,a.y,a.z) || 1; return { x:a.x/l, y:a.y/l, z:a.z/l }; };

        function postsAt(pos, p) {
            const W = p.plateWidth, D = p.plateDepth, h = p.postSize / 2;
            if (pos === 'corner') return [
                { x:-W/2+h, z:-D/2+h, k:'corner' }, { x: W/2-h, z:-D/2+h, k:'corner' },
                { x: W/2-h, z: D/2-h, k:'corner' }, { x:-W/2+h, z: D/2-h, k:'corner' }];
            return [
                { x:0, z:-D/2+h, k:'long' }, { x:0, z:D/2-h, k:'long' },
                { x:-W/2+h, z:0, k:'short' }, { x:W/2-h, z:0, k:'short' }];
        }
        function realRole(floor, post) {
            if (floor.role !== 'tie') return floor.role;
            return post.k === PROP_KIND ? 'strut' : 'tie';
        }

        /* ============================================================
           GEOMETRY  — unchanged: produces flat triangles with a face
           normal, plus annotation lines for the X-ray force diagram.
           ============================================================ */
        const C = { mode: 'asbuilt' };

        function build(p, risers) {
            const tris = [], lines = [];
            const xray = C.mode === 'xray';
            const W = p.plateWidth, D = p.plateDepth, fh = p.floorHeight, S = p.postSize;
            const cl = Math.min(p.coreLen, W - 1), cd = Math.min(p.coreDep, D - 1);
            const cwall = Math.min(p.coreWall, cd/2 - 0.05);
            const topY = p.numFloors * fh, botY = -p.numBelow * fh;

            function quad(a, b, c, d, ref, tint) {
                const n = norm(cross(sub(b, a), sub(c, a)));
                let two = true;
                if (ref) { two = false; if (dot(n, sub(a, ref)) < 0) { n.x=-n.x; n.y=-n.y; n.z=-n.z; } }
                tris.push({ p:[a,b,c], n, two, tint });
                tris.push({ p:[a,c,d], n, two, tint });
            }
            function box(cx, cy, cz, w, h, d, tint) {
                const r = { x:cx, y:cy+h/2, z:cz };
                const A={x:cx-w/2,y:cy,z:cz-d/2}, B={x:cx+w/2,y:cy,z:cz-d/2},
                      G={x:cx+w/2,y:cy,z:cz+d/2}, H={x:cx-w/2,y:cy,z:cz+d/2},
                      E={x:cx-w/2,y:cy+h,z:cz-d/2},F={x:cx+w/2,y:cy+h,z:cz-d/2},
                      I={x:cx+w/2,y:cy+h,z:cz+d/2}, J={x:cx-w/2,y:cy+h,z:cz+d/2};
                quad(A,H,J,E,r,tint); quad(B,G,I,F,r,tint); quad(A,B,F,E,r,tint);
                quad(H,G,I,J,r,tint); quad(E,F,I,J,r,tint); quad(A,B,G,H,r,tint);
            }
            function wall(x1, z1, x2, z2, y0, y1, t, tint) {
                const dx = x2-x1, dz = z2-z1, L = Math.hypot(dx, dz) || 1;
                const nx = -dz/L*t/2, nz = dx/L*t/2;
                const A={x:x1+nx,y:y0,z:z1+nz}, B={x:x2+nx,y:y0,z:z2+nz},
                      Cq={x:x2-nx,y:y0,z:z2-nz}, Dq={x:x1-nx,y:y0,z:z1-nz};
                const E={x:A.x,y:y1,z:A.z}, F={x:B.x,y:y1,z:B.z},
                      G={x:Cq.x,y:y1,z:Cq.z}, H={x:Dq.x,y:y1,z:Dq.z};
                const r = { x:(x1+x2)/2, y:(y0+y1)/2, z:(z1+z2)/2 };
                quad(A,B,F,E,r,tint); quad(B,Cq,G,F,r,tint); quad(Cq,Dq,H,G,r,tint);
                quad(Dq,A,E,H,r,tint); quad(E,F,G,H,r,tint); quad(A,B,Cq,Dq,r,tint);
            }
            const line = (a,b,color,w,arrow,dashed) => lines.push({a,b,color,w,arrow:!!arrow,dashed:!!dashed});

            // slabs, cut open over the core on every level - except the middle of the
            // second floor, where the landing between the two stair flights stays solid
            const flight0 = Math.min((risers - 1) * REAL.going, cl/2 - 0.05);
            const hz = cd/2 - cwall;                     // clear between the core walls
            function slab(y, cut) {
                const yb = y - p.slabThick;
                const strip = (x0,x1,z0,z1) => {
                    if (x1 - x0 < 1e-3 || z1 - z0 < 1e-3) return;
                    box((x0+x1)/2, yb, (z0+z1)/2, x1-x0, p.slabThick, z1-z0, 'slab');
                };
                if (!cut) { strip(-W/2, W/2, -D/2, D/2); return; }     // solid plate
                strip(-W/2, W/2, -D/2, -hz);
                strip(-W/2, W/2,  hz, D/2);
                strip(-W/2, -cl/2, -hz, hz);
                strip( cl/2,  W/2, -hz, hz);
                if (cut === 'landing') strip(-cl/2 + flight0, cl/2 - flight0, -hz, hz);
            }
            // ground floor (and any basement) stays solid over the core; the second
            // floor keeps its central landing; higher floors are cut fully open
            for (let i = -p.numBelow; i < p.numFloors; i++)
                slab(i*fh, i <= 0 ? false : (i === 1 ? 'landing' : true));

            // Core: two long walls, open at the short ends. Read off the three plans:
            //   floor 1  - both walls solid (the storey-1 opening was pulled back).
            //   floor 2  - both walls solid, no openings (the stair only passes).
            //   floor 3  - both walls solid to full height with 0.80 m x 2.0 m door
            //              openings near the middle: two in the front wall (each side
            //              of the foyer), one in the back wall (the through door).
            const y0c = botY - p.slabThick;
            const s1 = 0, s2 = fh, s3 = 2 * fh, doorH = 2.0;
            const notch = (a, b, holes) => {   // solid x-spans of [a,b] with holes removed
                const out = []; let x = a;
                holes.slice().sort((p, q) => p[0] - q[0]).forEach(([h0, h1]) => {
                    if (h0 > x) out.push([x, h0]);
                    x = Math.max(x, h1);
                });
                if (b > x) out.push([x, b]);
                return out;
            };
            function coreWall(zc, front) {
                const spans = (y0, y1) => {
                    const ym = (y0 + y1) / 2;
                    if (p.numFloors >= 3 && ym > s3 && ym < s3 + doorH)      // storey 3 doors
                        return notch(-cl/2, cl/2, front ? [[-1.30, -0.50], [0.50, 1.30]] : [[0.50, 1.30]]);
                    return [[-cl/2, cl/2]];
                };
                const ys = [...new Set([y0c, s1, s2, s3, s3 + doorH, topY])]
                    .filter(v => v <= topY + 1e-6).sort((a, b) => a - b);
                for (let k = 0; k < ys.length - 1; k++) {
                    const ya = ys[k], yb = ys[k+1];
                    if (yb - ya < 1e-4) continue;
                    for (const [x0, x1] of spans(ya, yb))
                        if (x1 - x0 > 1e-4) box((x0 + x1)/2, ya, zc, x1 - x0, yb - ya, cwall, 'core');
                }
            }
            coreWall( cd/2 - cwall/2, true);    // front wall (+z)
            coreWall(-cd/2 + cwall/2, false);   // back wall (-z)

            // Two stairs. A climbs the whole height as one run travelling left across
            // the core: a flight at the right end, the landing in the middle, then a
            // flight at the left end. B is a single flight at the left end from the
            // ground to the second floor, the same way up as A's upper flight, so it
            // sits directly beneath it. 4.48 + 3.25 + 4.48 = 12.21 m, the core length.
            if (p.showStairs) {
                const clear = cd/2 - cwall;
                const flight = Math.min((risers - 1) * REAL.going, cl/2 - 0.05);
                const run = (x0, dir, base) => {
                    for (let r = 1; r <= risers; r++) {
                        const y0 = base + (r-1)*fh/risers, y1 = base + r*fh/risers;
                        const xa = x0 + dir*(r-1)*flight/risers, xb = x0 + dir*r*flight/risers;
                        box((xa+xb)/2, y1 - 0.04*fh, 0, Math.abs(xb-xa), 0.04*fh, 2*clear, 'stair');
                        box(xa, y0, 0, 0.03, y1-y0, 2*clear, 'stair');
                    }
                };
                for (let lvl = -p.numBelow; lvl <= p.numFloors - 2; lvl++) {
                    const atRight = (((lvl % 2) + 2) % 2) === 0;
                    run(atRight ? cl/2 : -cl/2 + flight, -1, lvl * fh);      // stair A
                }
                if (p.numFloors >= 2) run(-cl/2 + flight, -1, 0);            // stair B
            }

            // Roof: a slab with a FLAT SOFFIT thickest in the middle, both ways. The
            // top surface is lift(x,z); the crest reaches full crown height out to the
            // four mid-side posts and drops to the eave only at the corners. Locked to
            // the measured wedge - the soffit and fascia are solid here, the top
            // surface is built in three.js as a smooth mesh.
            const soff = topY - p.roofEdge;
            const lift = (x, z) => topY + p.roofRise * (1 - Math.abs(2*x/W) * Math.abs(2*z/D));
            {
                const above = { x:0, y:topY + 60, z:0 };
                const midpt = { x:0, y:soff + p.roofEdge/2, z:0 };
                const S0 = (x,z) => ({ x, y:soff, z });
                quad(S0(-W/2,-D/2), S0(W/2,-D/2), S0(W/2,D/2), S0(-W/2,D/2), above, 'roof');   // soffit
                const NX = 16, NZ = 10;
                for (let i = 0; i < NX; i++) {
                    const xa = -W/2 + i*W/NX, xb = -W/2 + (i+1)*W/NX;
                    for (let j = 0; j < NZ; j++) {
                        const za = -D/2 + j*D/NZ, zb = -D/2 + (j+1)*D/NZ;
                        const A={x:xa,y:lift(xa,za),z:za}, B={x:xb,y:lift(xb,za),z:za},
                              Cc={x:xb,y:lift(xb,zb),z:zb}, Dd={x:xa,y:lift(xa,zb),z:zb};
                        if (j === 0)     quad(S0(xa,za), S0(xb,za), B, A, midpt, 'roof');
                        if (j === NZ-1)  quad(Dd, Cc, S0(xb,zb), S0(xa,zb), midpt, 'roof');
                        if (i === 0)     quad(S0(xa,zb), S0(xa,za), A, Dd, midpt, 'roof');
                        if (i === NX-1)  quad(Cc, B, S0(xb,za), S0(xb,zb), midpt, 'roof');
                    }
                }
                // top-floor partitions, 45 deg in from each corner. They run all the way
                // to the core (no gap, no vertical seam); a 1.0 m wide x 2.0 m tall door
                // is cut just short of the core end.
                const wr = Math.min(REAL.wallRun, W/2 - 0.6, D/2 - 0.6);
                const baseY = topY - fh - p.slabThick, headY = topY - fh + 2.0, dW = 1.0;
                const reach = Math.SQRT2 * (D/2 - cd/2);            // corner -> core face along 45 deg
                [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(c => {
                    const ux = -c[0]/Math.SQRT2, uz = -c[1]/Math.SQRT2;
                    const Ax = c[0]*W/2, Az = c[1]*D/2;
                    const Bx = Ax + ux*wr, Bz = Az + uz*wr;
                    const bdx = Bx + ux*dW, bdz = Bz + uz*dW;
                    const Cx = Ax + ux*reach, Cz = Az + uz*reach;
                    wall(Ax, Az, Bx, Bz, baseY, soff, REAL.wallThick, 'wall');       // measured wall
                    wall(Bx, Bz, bdx, bdz, headY, soff, REAL.wallThick, 'wall');     // lintel over the 1 m door
                    if (wr + dW < reach - 0.05)
                        wall(bdx, bdz, Cx, Cz, baseY, soff, REAL.wallThick, 'wall'); // door -> core, full height
                });
            }

            // four posts a floor
            p.floors.forEach((f, idx) => {
                const y1 = (idx+1)*fh;
                postsAt(f.pos, p).forEach(q => {
                    const role = realRole(f, q);
                    // sits between the plate below and the one above, buried 20 mm into
                    // each so its outline stays in the open storey, not on the plates
                    // top-floor posts stop at the roof soffit, not one storey up
                    const pB = idx*fh - 0.02;
                    const pT = (idx === p.numFloors - 1 ? soff : (idx+1)*fh - p.slabThick) + 0.02;
                    box(q.x, pB, q.z, S, pT - pB, S,
                        !xray ? 'post' : (role === 'strut' ? 'strut' : 'tieghost'));
                    if (!xray) return;
                    if (role === 'strut') {
                        line({x:q.x,y:y1,z:q.z}, {x:q.x,y:y1-fh*0.55,z:q.z}, 'rgba(211,47,47,0.95)', 2, true);
                    } else {
                        const head = topY - (idx === p.floors.length - 1 ? p.slabThick/2 : p.slabThick);
                        if (head > y1 + 1e-6) line({x:q.x,y:y1,z:q.z}, {x:q.x,y:head,z:q.z}, 'rgba(13,71,161,0.9)', 1.6, false, true);
                        line({x:q.x,y:y1-fh*0.5,z:q.z}, {x:q.x,y:y1,z:q.z}, 'rgba(25,118,210,0.95)', 2, true);
                        const ax = q.x < -0.01 ? -cl/2 : (q.x > 0.01 ? cl/2 : 0);
                        const az = q.z < -0.01 ? -cd/2 : (q.z > 0.01 ? cd/2 : 0);
                        line({x:q.x,y:head,z:q.z}, {x:ax,y:head,z:az}, 'rgba(230,81,0,0.95)', 2, true);
                    }
                });
            });

            if (p.reveal) {
                const seen = {};
                p.floors.forEach(f => postsAt(f.pos, p).forEach(q => { seen[q.x.toFixed(3)+','+q.z.toFixed(3)] = q; }));
                Object.values(seen).forEach(q => {
                    line({x:q.x,y:0,z:q.z}, {x:q.x,y:topY,z:q.z}, 'rgba(0,0,0,0.22)', 1, false, true);
                    p.floors.forEach((f, idx) => {
                        const here = postsAt(f.pos, p).some(o => Math.abs(o.x-q.x)<1e-6 && Math.abs(o.z-q.z)<1e-6);
                        const y0 = idx*fh, y1 = (idx+1)*fh, o = S*1.6;
                        if (here) line({x:q.x+o,y:y0,z:q.z}, {x:q.x+o,y:y1,z:q.z},
                                       realRole(f,q)==='strut' ? 'rgba(20,120,40,0.95)' : 'rgba(20,90,180,0.95)', 2.6);
                        else line({x:q.x+o-0.4,y:(y0+y1)/2,z:q.z}, {x:q.x+o+0.4,y:(y0+y1)/2,z:q.z},
                                  'rgba(211,47,47,0.98)', 2.2);
                    });
                });
            }

            return { tris, lines, topY, W, D, cl, cd, lift };
        }

        /* ============================================================
           THREE.JS RENDER
           ============================================================ */
        const canvas = document.getElementById('simCanvas');
        const wrap = canvas.parentElement;
        const scaleCv = document.createElement('canvas');
        scaleCv.className = 'scalebar';
        wrap.appendChild(scaleCv);
        const sctx = scaleCv.getContext('2d');

        const VIEW0 = { yaw: -32, pitch: 26, zoom: 1 };
        const panW = new THREE.Vector3();                 // pan as a world offset, not screen px
        const panBasisR = new THREE.Vector3(1, 0, 0), panBasisU = new THREE.Vector3(0, 1, 0);
        let panWpp = 0.05;
        const V = Object.assign({}, VIEW0);
        let cw = 1100, ch = 620, dpr = 1;

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setClearColor(0x000000, 0);
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 8000);   // axonometric — parallel projection
        camera.up.set(0, 1, 0);

        // strong key + gentle sky fill + a floor of ambient, so an up-facing plate
        // reads as grey rather than washing out to pure white against the page
        scene.add(new THREE.HemisphereLight(0xffffff, 0xdedede, 1.15));
        scene.add(new THREE.AmbientLight(0xffffff, 0.72));
        const sun = new THREE.DirectionalLight(0xffffff, 1.9);
        scene.add(sun); scene.add(sun.target);
        const SUN_DIR = new THREE.Vector3(-0.5, 0.92, 0.42).normalize();

        const MAT = {
            card:  new THREE.MeshLambertMaterial({ color: 0xf8f8f6, side: THREE.DoubleSide }),
            cardD: new THREE.MeshLambertMaterial({ color: 0xf5f5f2, side: THREE.DoubleSide }),
            ghost: new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.10, side: THREE.DoubleSide, depthWrite: false }),
            ghostS:new THREE.MeshLambertMaterial({ color: 0xef9a9a, transparent: true, opacity: 0.30, side: THREE.DoubleSide, depthWrite: false }),
            edge:  new THREE.LineBasicMaterial({ color: 0x1c1c1c }),
            edgeX: new THREE.LineBasicMaterial({ color: 0x444444, transparent: true, opacity: 0.4 }),
            ground:new THREE.MeshStandardMaterial({ color: 0xc4c4c4, roughness: 0.98, metalness: 0, side: THREE.DoubleSide })
        };

        let modelG = new THREE.Group();
        scene.add(modelG);
        let fitR = 20;
        const fitC = new THREE.Vector3();

        function clearGroup(g) {
            g.traverse(o => { if (o.geometry) o.geometry.dispose(); });
            while (g.children.length) g.remove(g.children[0]);
        }
        function parseCol(s) {
            const m = String(s).match(/rgba?\(([^)]+)\)/);
            if (!m) return { hex: 0x333333, a: 1 };
            const q = m[1].split(',').map(x => parseFloat(x));
            return { hex: (Math.round(q[0])<<16) | (Math.round(q[1])<<8) | Math.round(q[2]), a: q[3] == null ? 1 : q[3] };
        }
        function triGeom(ts) {
            const pos = new Float32Array(ts.length * 9), nor = new Float32Array(ts.length * 9);
            let k = 0;
            for (const t of ts) for (const v of t.p) {
                pos[k] = v.x; pos[k+1] = v.y; pos[k+2] = v.z;
                nor[k] = t.n.x; nor[k+1] = t.n.y; nor[k+2] = t.n.z; k += 3;
            }
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
            return g;
        }
        const V3 = o => new THREE.Vector3(o.x, o.y, o.z);

        const EDGE_THR = { slab: 1, core: 1, post: 1, stair: 1, wall: 1, strut: 1, tieghost: 1, roof: 26 };

        function renderScene(p, risers) {
            clearGroup(modelG);
            const B = build(p, risers);
            const xray = C.mode === 'xray';

            // ---- solids, grouped by tint, each with its crease outline
            const byTint = {};
            for (const t of B.tris) (byTint[t.tint] || (byTint[t.tint] = [])).push(t);
            for (const tint in byTint) {
                const geom = triGeom(byTint[tint]);
                let mat = null;
                if (!xray)                 mat = (tint === 'roof' || tint === 'wall') ? MAT.cardD : MAT.card;
                else if (tint === 'strut') mat = MAT.ghostS;
                else if (tint === 'tieghost') mat = null;              // envelope shown as outline only
                else                       mat = MAT.ghost;
                if (mat) {
                    const mesh = new THREE.Mesh(geom, mat);
                    mesh.material.shadowSide = THREE.BackSide;
                    modelG.add(mesh);
                }
                if (tint === 'slab' || tint === 'core' || tint === 'wall') continue;   // no outline on plates, core or partitions
                const el = new THREE.LineSegments(
                    new THREE.EdgesGeometry(geom, EDGE_THR[tint] || 1),
                    xray ? MAT.edgeX : MAT.edge);
                modelG.add(el);
            }

            // ---- slab outlines: the outer rectangle only, no core-hole rim
            {
                const em = xray ? MAT.edgeX : MAT.edge;
                for (let i = -p.numBelow; i < p.numFloors; i++) {
                    const y = i * p.floorHeight;
                    const c = [[-B.W/2,-B.D/2],[B.W/2,-B.D/2],[B.W/2,B.D/2],[-B.W/2,B.D/2]];
                    const pts = [];
                    for (let k = 0; k < 4; k++) {
                        const a = c[k], b = c[(k+1)%4];
                        pts.push(a[0], y, a[1], b[0], y, b[1]);
                        pts.push(a[0], y - p.slabThick, a[1], b[0], y - p.slabThick, b[1]);
                    }
                    modelG.add(new THREE.LineSegments(
                        new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(pts, 3)), em));
                }
            }

            // ---- roof top: a smooth mesh so the wedge is not faceted
            {
                const g = new THREE.PlaneGeometry(B.W, B.D, 30, 20);
                g.rotateX(-Math.PI / 2);
                const pos = g.attributes.position;
                for (let i = 0; i < pos.count; i++) pos.setY(i, B.lift(pos.getX(i), pos.getZ(i)));
                pos.needsUpdate = true;
                g.computeVertexNormals();
                const mesh = new THREE.Mesh(g, xray ? MAT.ghost : MAT.cardD);
                modelG.add(mesh);
                modelG.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 44), xray ? MAT.edgeX : MAT.edge));

                const yc = B.topY + p.roofRise, W = B.W, D = B.D;
                const cm = new THREE.LineBasicMaterial({ color: 0x1c1c1c, transparent: true, opacity: xray ? 0.55 : 0.9 });
                const vm = new THREE.LineBasicMaterial({ color: 0x1c1c1c, transparent: true, opacity: 0.20 });
                const seg = (a, b, m) => modelG.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints([a, b]), m));
                seg(new THREE.Vector3(-W/2, yc, 0), new THREE.Vector3(W/2, yc, 0), cm);
                seg(new THREE.Vector3(0, yc, -D/2), new THREE.Vector3(0, yc, D/2), cm);
                [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(c =>
                    seg(new THREE.Vector3(0, yc, 0), new THREE.Vector3(c[0]*W/2, B.topY, c[1]*D/2), vm));
            }

            // ---- annotation lines (force diagram, reveal, reading overlays)
            const groups = {};
            for (const l of B.lines) {
                if (l.arrow) { addArrow(l); continue; }
                const { hex, a } = parseCol(l.color);
                const key = hex + '|' + (l.dashed ? 1 : 0) + '|' + a.toFixed(2);
                (groups[key] || (groups[key] = { hex, a, dashed: l.dashed, pts: [] })).pts
                    .push(l.a.x, l.a.y, l.a.z, l.b.x, l.b.y, l.b.z);
            }
            for (const key in groups) {
                const gr = groups[key];
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.Float32BufferAttribute(gr.pts, 3));
                const mat = gr.dashed
                    ? new THREE.LineDashedMaterial({ color: gr.hex, transparent: true, opacity: gr.a, dashSize: 0.3, gapSize: 0.22 })
                    : new THREE.LineBasicMaterial({ color: gr.hex, transparent: true, opacity: gr.a });
                const ls = new THREE.LineSegments(geo, mat);
                if (gr.dashed) ls.computeLineDistances();
                modelG.add(ls);
            }

            // (the temple / Dom-ino readings are no longer drawn as lines on the
            // building — the hourglass throws them as tree shadows instead)

            // ---- ground (as-built only) - a real shadow-catching disc
            if (!xray) {
                const gr = Math.max(B.W, B.D) * 0.85;
                // sit the ground plane a clear step below the lowest floor plate
                const gy = -p.numBelow * p.floorHeight - p.slabThick + 0.002;   // flush under the lowest plate
                const gm = new THREE.Mesh(new THREE.CircleGeometry(gr, 72), MAT.ground);
                gm.rotation.x = -Math.PI / 2;
                gm.position.y = gy;
                modelG.add(gm);
            }

            // ---- camera fit from the model's own bounds (rotation invariant)
            let mnx=1e9,mny=1e9,mnz=1e9,mxx=-1e9,mxy=-1e9,mxz=-1e9;
            for (const t of B.tris) for (const v of t.p) {
                if (v.x<mnx) mnx=v.x; if (v.x>mxx) mxx=v.x;
                if (v.y<mny) mny=v.y; if (v.y>mxy) mxy=v.y;
                if (v.z<mnz) mnz=v.z; if (v.z>mxz) mxz=v.z;
            }
            fitC.set((mnx+mxx)/2, (mny+mxy)/2, (mnz+mxz)/2);
            fitR = 0.5 * Math.hypot(mxx-mnx, mxy-mny, mxz-mnz) || 20;
        }

        function addArrow(l) {
            const { hex, a } = parseCol(l.color);
            const from = V3(l.a), to = V3(l.b);
            const d = to.clone().sub(from), len = d.length();
            if (len < 1e-4) return;
            d.normalize();
            const head = Math.min(0.55, len * 0.42);
            const ah = new THREE.ArrowHelper(d, from, len, hex, head, head * 0.55);
            ah.line.material.transparent = true; ah.line.material.opacity = a;
            ah.cone.material.transparent = true; ah.cone.material.opacity = a;
            modelG.add(ah);
        }

        let scalePxPerM = 20;
        function applyCam() {
            const asp = cw / Math.max(ch, 1);
            const ya = V.yaw * Math.PI/180, pa = V.pitch * Math.PI/180;
            const dir = new THREE.Vector3(Math.cos(pa)*Math.sin(ya), Math.sin(pa), Math.cos(pa)*Math.cos(ya));
            const right = new THREE.Vector3().crossVectors(dir, camera.up).normalize();
            const up = new THREE.Vector3().crossVectors(right, dir).normalize();

            // parallel projection: frustum half-size fits the model's bounding sphere
            const R = fitR * 1.12 / V.zoom;
            let halfH, halfW;
            if (asp >= 1) { halfH = R; halfW = R * asp; }
            else          { halfW = R; halfH = R / asp; }
            const wpp = (2 * halfH) / Math.max(ch, 1);      // world / px — constant across the whole view
            scalePxPerM = 1 / wpp;
            panBasisR.copy(right); panBasisU.copy(up); panWpp = wpp;

            camera.left = -halfW; camera.right = halfW;
            camera.top = halfH;   camera.bottom = -halfH;

            const D = fitR * 8;                             // stand-off (does not affect size in ortho)
            const tgt = fitC.clone().add(panW);
            camera.position.copy(tgt).addScaledVector(dir, D);
            camera.near = 0.01;
            camera.far = D + fitR * 12;
            camera.lookAt(tgt);
            camera.updateProjectionMatrix();

            sun.position.copy(fitC).addScaledVector(SUN_DIR, fitR * 3);
            sun.target.position.copy(fitC);
        }

        function drawScaleBar() {
            const len = 5 * scalePxPerM;
            scaleCv.width = 160 * dpr; scaleCv.height = 30 * dpr;
            scaleCv.style.width = '160px'; scaleCv.style.height = '30px';
            sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            sctx.clearRect(0, 0, 160, 30);
            if (!isFinite(len) || len < 10 || len > 150) return;
            const x0 = 150 - len, y0 = 16;
            sctx.strokeStyle = '#111'; sctx.lineWidth = 1;
            sctx.beginPath();
            sctx.moveTo(x0, y0); sctx.lineTo(x0+len, y0);
            sctx.moveTo(x0, y0-4); sctx.lineTo(x0, y0+4);
            sctx.moveTo(x0+len, y0-4); sctx.lineTo(x0+len, y0+4);
            sctx.moveTo(x0+len/2, y0-3); sctx.lineTo(x0+len/2, y0+3);
            sctx.stroke();
            sctx.fillStyle = '#666'; sctx.font = '9px Helvetica, Arial, sans-serif';
            sctx.fillText('0', x0-3, y0+14); sctx.fillText('5 m', x0+len-8, y0+14);
        }

        function render() {
            renderer.render(scene, camera);
            drawScaleBar();
        }

        function resize() {
            dpr = Math.min(2, window.devicePixelRatio || 1);
            const r = canvas.getBoundingClientRect();
            cw = Math.max(1, Math.round(r.width));
            ch = Math.max(1, Math.round(r.height));
            renderer.setPixelRatio(dpr);
            renderer.setSize(cw, ch, false);
            applyCam(); render();
        }
        if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
        else window.addEventListener('resize', resize);

        // ---- orbit / zoom / pan
        let drag = null;
        canvas.addEventListener('pointerdown', e => {
            canvas.setPointerCapture(e.pointerId);
            drag = { x: e.clientX, y: e.clientY, pan: e.shiftKey || e.button === 1 || e.button === 2 };
            canvas.classList.add('dragging');
        });
        canvas.addEventListener('pointermove', e => {
            if (!drag) return;
            const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
            drag.x = e.clientX; drag.y = e.clientY;
            if (drag.pan) {
                panW.addScaledVector(panBasisR, dx * panWpp).addScaledVector(panBasisU, dy * panWpp);
            } else {
                V.yaw = (V.yaw + dx * 0.45) % 360;
                V.pitch = Math.max(-89, Math.min(89, V.pitch + dy * 0.35));
            }
            applyCam(); render();
        });
        const endDrag = () => { if (drag) { drag = null; canvas.classList.remove('dragging'); } };
        canvas.addEventListener('pointerup', endDrag);
        canvas.addEventListener('pointercancel', endDrag);
        canvas.addEventListener('contextmenu', e => e.preventDefault());
        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            V.zoom = Math.max(0.25, Math.min(9, V.zoom * Math.exp(-e.deltaY * 0.0016)));
            applyCam(); render();
        }, { passive: false });
        canvas.addEventListener('dblclick', () => { Object.assign(V, VIEW0); panW.set(0, 0, 0); applyCam(); render(); });

        // ---- mode switch. "As built" doubles as the recentre — it also snaps the
        // orbit / zoom / pan back to the default view. The trees and whatever the
        // hourglass is showing are left alone.
        const modeSwitch = document.getElementById('mode');
        modeSwitch.querySelectorAll('button').forEach(b =>
            b.addEventListener('click', () => {
                C.mode = b.dataset.m;
                modeSwitch.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
                if (b.dataset.m === 'asbuilt') { Object.assign(V, VIEW0); panW.set(0, 0, 0); }
                update();
            }));

        // the whole model is locked to the measured drawings; the reading is
        // whatever the hourglass is currently showing (see the glass handler)
        let reading = 'none';

        function readParams() {
            const p = {};
            ['numFloors','numBelow','floorHeight','plateWidth','plateDepth','slabThick',
             'postSize','roofEdge','roofRise','coreLen','coreDep','coreWall'].forEach(k => p[k] = REAL[k]);
            p.reveal = false;
            p.showStairs = true;
            p.floors = floorsFor(p.numFloors);
            return p;
        }

        /* ============================================================
           THE GARDEN — white leafless trees a few metres off the front
           facade. The longer you look at a reading, the more its shadow
           leaves realism: it crawls across the grass to the wall and
           stands up — an uneven colonnade for the temple, the building's
           own few even piloti for Dom-ino. Never exact, never in step.
           ============================================================ */
        const FRONT_Z = REAL.plateDepth / 2;                 // +Z face of the building
        const GARDEN_GAP = 5.0;                              // trees stand this far off it
        const GROUND_Y = -REAL.slabThick + 0.002;
        const H_ = REAL.postSize / 2;
        const DOMINO_FRONT_X = [-REAL.plateWidth/2 + H_, 0, REAL.plateWidth/2 - H_];
        // the seven peristyle column lines across the long face (the old temple overlay)
        const TEMPLE_LINES = Array.from({ length: 7 }, (_, i) => -REAL.plateWidth/2 + i * REAL.plateWidth/6);

        const rng = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
        // Hockney's non-naturalistic trunks — one bright viridian hero, the rest
        // plum / mauve / teal / terracotta, one flat colour per tree
        const BARK = [0x1a8f6f, 0x7a3b6b, 0x8e5aa0, 0x2f6f5e, 0xb5623a, 0x1a8f6f];
        const SHADOW_MAT = new THREE.MeshBasicMaterial({ color: 0x7d6f86, transparent: true, opacity: 0.34, depthWrite: false, side: THREE.DoubleSide });
        // a faint sheet across the front of the building — a screen for the shadows to land on
        const SCREEN_MAT = new THREE.MeshBasicMaterial({ color: 0xdadada, transparent: true, opacity: 0.30, depthWrite: false, side: THREE.DoubleSide });
        const YUP_ = new THREE.Vector3(0, 1, 0);
        const groveG = new THREE.Group();  scene.add(groveG);
        const shadowG = new THREE.Group(); scene.add(shadowG);

        // scattered, uneven — x spans (a little past) the facade, z stepped back
        const TREES = [
            [-10.5, 3.8, 6.6, 11], [-7.6, 5.3, 5.6, 23], [-5.0, 3.3, 7.1, 37],
            [-2.3, 5.6, 6.0, 41], [ 0.4, 3.5, 6.4, 52], [ 3.0, 5.4, 5.3, 64],
            [ 5.6, 3.6, 6.9, 77], [ 8.3, 5.1, 5.8, 88], [ 10.8, 3.9, 6.3, 95],
        ].map(([x, back, h, seed], i) => {
            const nearLine = TEMPLE_LINES.reduce((a, b) => Math.abs(b - x) < Math.abs(a - x) ? b : a);
            return {
                x, z: FRONT_Z + GARDEN_GAP + back, h, seed,
                colX: 0, isDom: false,
                lineX: nearLine + (rng(seed * 3 + 1)() - 0.5) * 0.7,   // near the peristyle line, not on it
                uoff: rng(seed * 11 + 3)() * 0.22,                     // a small head-start spread
                goff: rng(seed * 19 + 7)() * 0.30,                     // grows a beat after its neighbour
                taper: 0.06 + rng(seed * 13 + 5)() * 0.13,             // tip width as a fraction of the base
                bark: i === 0 ? 0x1a8f6f : BARK[rng(seed * 17 + 9)() * BARK.length | 0],
                cur: { raise: 0, x },                                  // animated state
            };
        });
        // for Dom-ino, only the tree nearest each real front-face post throws a
        // shadow — three of them, landing exactly on the column
        DOMINO_FRONT_X.forEach(cx => {
            let best = null, bd = 1e9;
            TREES.forEach(t => { const d = Math.abs(t.x - cx); if (d < bd) { bd = d; best = t; } });
            if (best) { best.isDom = true; best.colX = cx; }
        });

        function limb_(parent, from, to, r0, r1, mat) {
            const d = new THREE.Vector3().subVectors(to, from);
            const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, d.length(), 6), mat);
            m.position.copy(from).addScaledVector(d, 0.5);
            m.quaternion.setFromUnitVectors(YUP_, d.clone().normalize());
            parent.add(m);
        }
        TREES.forEach(t => {
            const r = rng(t.seed);
            const bmat = new THREE.MeshLambertMaterial({ color: t.bark });
            const g = new THREE.Group(); g.position.set(t.x, GROUND_Y, t.z); groveG.add(g);
            const top = new THREE.Vector3((r() - 0.5) * 0.8, t.h, (r() - 0.5) * 0.7);
            limb_(g, new THREE.Vector3(0, 0, 0), top, 0.16, 0.05, bmat);
            const nb = 2 + (r() * 3 | 0);
            for (let i = 0; i < nb; i++) {
                const b = top.clone().multiplyScalar(0.4 + r() * 0.5);
                const a = r() * 6.28, rr = 0.7 + r() * 1.1;
                const e = b.clone().add(new THREE.Vector3(Math.cos(a) * rr, 0.7 + r() * 1.4, Math.sin(a) * rr));
                limb_(g, b, e, 0.045, 0.02, bmat);
                if (r() > 0.5) {
                    const e2 = e.clone().add(new THREE.Vector3(Math.cos(a + 0.7) * 0.6, 0.5 + r() * 0.9, Math.sin(a + 0.7) * 0.6));
                    limb_(g, e, e2, 0.022, 0.012, bmat);
                }
            }
            const disc = new THREE.Mesh(new THREE.CircleGeometry(0.5, 16),
                new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.10, depthWrite: false }));
            disc.rotation.x = -Math.PI / 2; disc.position.y = 0.015; g.add(disc);
            g.scale.set(1, 0, 1); g.visible = false;                    // starts underground, asleep
        });

        const sstep_ = (a, b, x) => { x = Math.max(0, Math.min(1, (x - a) / (b - a))); return x * x * (3 - 2 * x); };
        const lerp_  = (a, b, t) => a + (b - a) * t;

        // a flat blade that narrows to a near-point at the top — a tree, loosely
        function spireGeom(wBot, wTop, H) {
            const hb = wBot / 2, ht = wTop / 2, y0 = -H / 2, y1 = H / 2;
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
                -hb, y0, 0,   hb, y0, 0,   ht, y1, 0,
                -hb, y0, 0,   ht, y1, 0,  -ht, y1, 0,
            ]), 3));
            return g;
        }

        // each tree carries an animated { raise 0..1, x }. buildGroveShadows just
        // draws whatever those currently are — the tween below moves them.
        function buildGroveShadows() {
            clearGroup(shadowG);
            if (C.mode === 'xray' || grown <= 0.001) return;   // no garden in X-ray / while asleep
            const mat = SHADOW_MAT;
            const H0 = REAL.numFloors * REAL.floorHeight;        // up to the third floor

            // the faint screen across the front of the building
            SCREEN_MAT.opacity = 0.30 * Math.min(1, grown);
            const scr = new THREE.Mesh(new THREE.PlaneGeometry(REAL.plateWidth + 0.6, H0), SCREEN_MAT);
            scr.position.set(0, GROUND_Y + H0 / 2, FRONT_Z + 0.02);
            shadowG.add(scr);

            TREES.forEach((t, i) => {
                const raise = t.cur.raise * Math.min(1, grown);
                if (raise <= 0.002) return;
                const crawl = sstep_(0, 0.45, raise);           // tongue reaches the wall first
                const stand = sstep_(0.4, 1, raise);            // then the column climbs
                const x = t.cur.x;
                if (crawl > 0) {
                    const reach = (t.z - FRONT_Z - 0.1) * crawl;
                    if (reach > 0.05) {
                        const m = new THREE.Mesh(new THREE.PlaneGeometry(0.42, reach), mat);
                        m.rotation.x = -Math.PI / 2;
                        m.position.set(lerp_(t.x, x, 0.5), GROUND_Y + 0.02, t.z - reach / 2);
                        shadowG.add(m);
                    }
                }
                if (stand > 0) {
                    const H = H0 * stand;
                    const w = (reading === 'domino' && t.isDom) ? 0.16 : 0.5;
                    const m = new THREE.Mesh(spireGeom(w, w * t.taper, H), mat);
                    m.position.set(x, GROUND_Y + H / 2, FRONT_Z + 0.05 + i * 0.004);
                    shadowG.add(m);
                }
            });
        }

        // The hourglass is a toggle. 1st press wakes the garden: the trees grow
        // out of the ground, then the shadow reading begins and the two readings
        // (Greek / Dom-ino) cross-fade back and forth on their own for ever.
        // Press again to cancel: the trees shrink back into the ground and vanish.
        const easeIO = x => x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;
        const STUB = 0.14;                                 // shadow left lying on the ground
        function targetFor(state, t) {
            if (state === 'temple') return { raise: 1, x: t.lineX };
            if (state === 'domino') return t.isDom ? { raise: 1, x: t.colX } : { raise: STUB, x: t.x };
            return { raise: 0, x: t.x };
        }

        const LEG_S = 6, HOLD_S = 2.6, GROW_S = 2.2, RETRACT_S = 1.5;
        let legU = 0, legActive = false, holdUntil = 0;
        let awake = false, grown = 0, growDir = 0;         // grown 0 = underground, 1 = full grove
        let groveRAF = 0, groveLast = 0;
        let hgRot = 0, hgFrom = 0, hgTo = 0;
        const froms = [], tgts = [];

        function applyGrowth() {
            for (let i = 0; i < groveG.children.length; i++) {
                const t = TREES[i], g = groveG.children[i];
                const eg = easeIO(Math.max(0, Math.min(1, (grown - t.goff) / (1 - t.goff))));
                g.scale.set(1, eg, 1);
                g.visible = eg > 0.001 && C.mode !== 'xray';
            }
        }
        function beginLeg(state) {
            TREES.forEach((t, i) => { froms[i] = { raise: t.cur.raise, x: t.cur.x }; tgts[i] = targetFor(state, t); });
            reading = state; syncGlass();
            hgFrom = hgRot; hgTo = (state === 'domino') ? 180 : 0;
            legU = 0; legActive = true;
        }
        function nextReading() {
            return reading === 'temple' ? 'domino'
                 : reading === 'domino' ? 'temple'
                 : (Math.random() < 0.5 ? 'temple' : 'domino');
        }

        function groveTick(now) {
            groveRAF = 0;
            const dt = Math.min(0.05, (now - groveLast) / 1000); groveLast = now;

            if (growDir !== 0) {
                grown = Math.max(0, Math.min(1, grown + growDir * dt / (growDir > 0 ? GROW_S : RETRACT_S)));
                applyGrowth();
                if (growDir > 0 && grown >= 1) { growDir = 0; if (awake) beginLeg(nextReading()); }
                if (growDir < 0 && grown <= 0) {
                    growDir = 0; legActive = false; reading = 'none'; syncGlass();
                    TREES.forEach(t => { t.cur.raise = 0; t.cur.x = t.x; });
                    hgRot = 0; hg.style.transform = 'rotate(0deg)';
                }
            }

            if (awake && grown >= 0.999) {
                if (legActive) {
                    legU = Math.min(1, legU + dt / LEG_S);
                    const e = easeIO(legU);
                    TREES.forEach((t, i) => {
                        const f = froms[i], g = tgts[i];
                        const uu = easeIO(Math.max(0, Math.min(1, (legU - t.uoff) / (1 - t.uoff))));
                        t.cur.raise = f.raise + (g.raise - f.raise) * uu;
                        t.cur.x     = f.x     + (g.x     - f.x)     * uu;
                    });
                    hgRot = hgFrom + (hgTo - hgFrom) * e;      // the glass turns in step with the shadow
                    hg.style.transform = `rotate(${hgRot}deg)`;
                    if (legU >= 1) { legActive = false; holdUntil = now + HOLD_S * 1000; }
                } else if (now >= holdUntil) {
                    beginLeg(nextReading());
                }
            }

            buildGroveShadows();
            render();
            if (growDir !== 0 || (awake && grown >= 0.999)) groveRAF = requestAnimationFrame(groveTick);
        }
        function runGrove() { if (!groveRAF) { groveLast = performance.now(); groveRAF = requestAnimationFrame(groveTick); } }

        const glassBtn = document.getElementById('glassBtn');
        const hg = glassBtn.querySelector('.hg');
        const lblTop = glassBtn.querySelector('.lbl.top');
        const lblBot = glassBtn.querySelector('.lbl.bot');
        function syncGlass() {
            lblTop.classList.toggle('on', reading === 'temple');
            lblBot.classList.toggle('on', reading === 'domino');
        }
        glassBtn.addEventListener('click', () => {
            awake = !awake;
            growDir = awake ? 1 : -1;
            if (!awake) legActive = false;
            runGrove();
        });

        function update() {
            const p = readParams();
            const risers = Math.max(2, Math.round(p.floorHeight / REAL.riser));
            renderScene(p, risers);
            applyCam();
            applyGrowth();
            buildGroveShadows();
            render();
        }

        update();
        resize();
        // the garden starts asleep — the hourglass wakes it
    </script>
</body>
</html>
