<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H60</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
/* one light look, after works/snowdon-aviary-tensegrity.html — compact: the model gets the room */
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  font-family: Helvetica, sans-serif;
  background: #f4f4f4; color: #111;
  padding: 8px 14px; box-sizing: border-box;
  display: flex; flex-direction: column;
}
.bar {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding-bottom: 4px; margin-bottom: 6px; border-bottom: 1px solid #111; flex-shrink: 0;
}
.bar h1 { margin: 0; font-size: 12px; font-weight: bold; letter-spacing: .8px; text-transform: uppercase; }
.bar span { font-size: 9px; letter-spacing: .8px; text-transform: uppercase; color: #999; }

.canvas-container { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
#canvas-inner {
  flex: 1 1 auto; min-height: 200px; background: #fdfdfd;
  border: 1px solid #eaeaea; position: relative; touch-action: none;
  outline: none; overflow: hidden; cursor: move;
}
#canvas-inner.handle { cursor: grab; }
#canvas-inner canvas { display: block; position: absolute; left: 0; top: 0; }
#labels { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
.tag { position: absolute; font-size: 9px; transform: translate(-50%, -50%); white-space: nowrap; color: #666; font-variant-numeric: tabular-nums; }
.tag.lvl { transform: translate(-100%, -50%); margin-left: -6px; color: #333; }
.tag.lvr { transform: translate(0, -50%); margin-left: 6px; color: #333; }
.tag.wid { color: #2f5fb3; font-size: 8px; }
.view-btns { position: absolute; top: 6px; right: 6px; z-index: 20; display: flex; gap: 3px; }
.view-btns .sep { width: 5px; }
#status-text { font-size: 9px; text-align: center; margin: 4px 0 0; flex-shrink: 0; letter-spacing: .3px; color: #888; line-height: 1.35; }

.controls-container {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0;
  margin-top: 6px; padding-top: 6px; border-top: 1px dashed #aaa;
  font-size: 9px; line-height: 1.3; flex-shrink: 0;
}
.column { padding: 0 12px; border-left: 1px solid #ddd; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.column:first-child { border-left: none; padding-left: 0; }
.column h3 { margin: 2px 0 1px; font-size: 8px; font-weight: bold; text-transform: uppercase; letter-spacing: .6px; color: #999; }
.control-row { display: grid; grid-template-columns: minmax(0, 1fr) 42% 38px; align-items: center; gap: 6px; }
.control-row label { color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.control-row label.dim { color: #aaa; }
.val { color: #555; text-align: right; font-variant-numeric: tabular-nums; }
.note { color: #777; font-size: 9px; margin: 0; line-height: 1.3; }
input[type="range"] { width: 100%; -webkit-appearance: none; appearance: none; background: transparent; margin: 3px 0; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 8px; width: 8px; border-radius: 50%; background: #111; cursor: pointer; margin-top: -3px; }
input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 2px; cursor: pointer; background: #ccc; }
input[type="range"]::-moz-range-thumb { height: 8px; width: 8px; border-radius: 50%; background: #111; border: 0; }
input[type="range"]::-moz-range-track { height: 2px; background: #ccc; }
input[type="range"]:disabled::-webkit-slider-thumb { background: #bbb; }
input[type="range"]:focus-visible { outline: 1px dashed #111; outline-offset: 2px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 3px; }
button.toggle-btn {
  border: 1px solid #bbb; background: #fff; color: #333; padding: 2px 6px;
  font: bold 8px Helvetica, sans-serif; line-height: 1.5;
  text-transform: uppercase; letter-spacing: .4px; cursor: pointer; transition: all .15s ease; flex: 1 0 auto;
}
.view-btns button.toggle-btn { flex: none; }
button.toggle-btn:hover { background: #eee; }
button.toggle-btn.active { background: #111; border-color: #111; color: #fff; }
button.toggle-btn:disabled { opacity: .35; cursor: default; background: #fff; }
button.toggle-btn:focus-visible { outline: 1px dashed #111; outline-offset: 2px; }
#pieceInfo, #winInfo { color: #333; font-variant-numeric: tabular-nums; }
#toast { color: #d32f2f; min-height: 1.2em; }
.num-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.num-row label { display: flex; flex-direction: column; gap: 1px; color: #777; font-size: 8px; }
.num-row input { width: 100%; box-sizing: border-box; font: 9px Helvetica, sans-serif; padding: 1px 3px; border: 1px solid #bbb; background: #fff; font-variant-numeric: tabular-nums; }
.num-row input:focus-visible { outline: 1px dashed #111; outline-offset: 1px; }

@media (max-width: 900px) { .controls-container { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 8px; } .column:nth-child(3) { border-left: none; padding-left: 0; } }
@media (max-width: 560px) {
  html, body { overflow: auto; height: auto; }
  .canvas-container { flex: none; height: 65vh; }
  .controls-container { grid-template-columns: 1fr; }
  .column { border-left: none; padding: 6px 0 0; border-top: 1px solid #ddd; }
}
</style>
</head>
<body>

<div class="bar">
  <h1><a href="../index.html" style="color:inherit;text-decoration:none">&larr; Index</a> &nbsp;·&nbsp; H60</h1>
  <span>Drawing1.dxf · house 7.50 × 21.00 m · plan → superellipse → storey</span>
</div>

<div class="canvas-container">
  <div id="canvas-inner" tabindex="0" aria-label="Model">
    <div class="view-btns">
      <button id="eS" class="toggle-btn" title="South elevation (y = 0)">S</button>
      <button id="eN" class="toggle-btn" title="North elevation (y = 21)">N</button>
      <button id="eW" class="toggle-btn" title="West elevation (x = 0)">W</button>

    <div id="labels"></div>

  <div id="status-text"></div>
</div>

<div class="controls-container">
  <div class="column">
    <h3>Steps</h3>
    <div class="btn-row">
      <button id="st0" class="toggle-btn">1 Plan</button>
      <button id="st1" class="toggle-btn">2 Flexible</button>

    <h3>Display</h3>
    <div class="btn-row">
      <button id="mWire" class="toggle-btn">Wireframe</button>
      <button id="mSolid" class="toggle-btn">Solid</button>
      <button id="mIds" class="toggle-btn active" aria-pressed="true" title="Wall IDs and level labels">Wall IDs</button>
      <button id="mGfE" class="toggle-btn" aria-pressed="false" title="Ground-floor outside walls, 10 cm, on the plan lines">Ext walls</button>
      <button id="mGfI" class="toggle-btn" aria-pressed="false" title="Ground-floor inside walls, 10 cm, on the plan lines">Int walls</button>
      <button id="mWin" class="toggle-btn active" aria-pressed="true">Windows</button>

  <div class="column">

    <div class="control-row"><label for="n">Squareness n</label><input type="range" id="n" min="2" max="10" step="0.1" value="4"><span id="o-n" class="val"></span></div>
    <div class="control-row"><label for="offL">Roof offset left</label><input type="range" id="offL" min="0" max="1.5" step="0.05" value="0"><span id="o-offL" class="val"></span></div>
    <div class="control-row"><label for="offR">Roof offset right</label><input type="range" id="offR" min="0" max="1.5" step="0.05" value="0"><span id="o-offR" class="val"></span></div>
    <div class="control-row"><label for="op" id="l-op">Curved wall opacity</label><input type="range" id="op" min="0" max="100" step="1" value="100"><span id="o-op" class="val"></span></div>
    <div class="control-row"><label for="env">Envelope opacity</label><input type="range" id="env" min="0" max="100" step="1" value="35"><span id="o-env" class="val"></span></div>

    <div class="control-row"><label for="winH">Height</label><input type="range" id="winH" min="0.3" max="2.2" step="0.05" value="1.2"><span id="o-winH" class="val"></span></div>
    <div class="control-row"><label for="winSill">Sill above floor</label><input type="range" id="winSill" min="0" max="1.8" step="0.05" value="0.9"><span id="o-winSill" class="val"></span></div>
    <div class="btn-row">
      <button id="wDel" class="toggle-btn" disabled title="Delete the selected window (or press Delete)">Delete selected</button>
    </div>

    <div id="winBox" hidden>
      <h3>Selected window</h3>

      <div class="num-row">
        <label>From corner<input id="wA" type="number" step="0.05" min="0"></label>
        <label>Width<input id="wW" type="number" step="0.05" min="0.2"></label>
        <label>Sill<input id="wS" type="number" step="0.05" min="0"></label>
        <label>Height<input id="wH" type="number" step="0.05" min="0.2"></label>
      </div>
    </div>
  </div>

  <div class="column">
    <div id="selBox" hidden>
      <h3>Selected piece</h3>
      <div id="pieceInfo"></div>
      <div class="btn-row" style="margin-top:3px"><button id="bCentre" class="toggle-btn">Centre in room</button></div>
    </div>
    <h3>Export 3D model · by layer</h3>
    <div class="btn-row">
      <button id="saveSkp" class="toggle-btn" title="Collada .dae, one group per layer — File › Import in SketchUp">SketchUp</button>
      <button id="save3dm" class="toggle-btn" title="OBJ + MTL in a .zip, OBJ groups = layers — Import in Rhino">Rhino</button>
      <button id="saveGh" class="toggle-btn" title="Grasshopper definition for Rhino 7: six GhPython boxes wired to sliders">Grasshopper</button>
    </div>
    <p class="note" id="toast" role="status"></p>
  </div>
</div>

<script>
/* From the plan of Drawing1.dxf:
   1  Plan: every room is a rectangle (the L room is cut into two at x = 6.00);
      a circle sits at its centre, as large as the room allows 10 cm clear of
      the plan lines
   2  Flexible: the circle grows into a superellipse held by the room frame and
      its centre — four half-axes, the distances from the centre to the frame's
      sides less 10 cm. Centres move inside their rooms, snap, or are randomised
   Walls: every stretch of plan line between two junctions is a wall, E01…
      outside and I01… inside, numbered bottom to top, left to right.
   Windows (ground floor only): one per outside wall, centred, by rule; each can
      then be moved, resized, deleted or added in the four elevations.
   3  Storey: the ground is ±0.00; the ground floor is a thin slab at +1.00 on
      a solid base the size of the house, with the plan on it; the superellipses are the second floor,
      base +3.40, walls rising to an offset (measured normal to the roof) under
      a gable roof — ridge +7.00 on the house's centre line, down to +3.40 at its
      long walls. The roof is 0.30 m thick, built up from that surface, with
      eaves 1.20 m out along the slope at the sides and 1.00 m at the gable
      ends, cut square to the slope. The envelope is white walls and a flat
      clay-tile roof, see-through by a slider */

// house, local origin at the lower-left corner of the plan in Drawing1.dxf (metres, y up)
const ORIGIN = [2750.541365912678, 1907.039885595487];
const W = 7.5, D = 21.0, GAP = 0.10, KEEP = 0.15, SNAP_PX = 9;
// ground ±0.00; ground floor +1.00 on columns; second floor 2.40 above it
const FF = 1.00, L2 = FF + 2.40, RIDGE = FF + 6.00, RX = W / 2, SLAB = 0.15;
const ROOF_T = 0.30, GABLE_EAVE = 1.00;
const SLOPE = (RIDGE - L2) / RX, COS = 1 / Math.hypot(1, SLOPE);
const roof = x => RIDGE - SLOPE * Math.abs(x - RX);   // also past the walls, for the eaves
const EAVE = 1.20 * COS;                               // 1.20 m along the slope
const Z_EAVE = roof(-EAVE);
const fmtZ = z => (Math.abs(z) < 0.005 ? "±" : "+") + z.toFixed(2);
// the roof as a solid: per side a section (eave underside, ridge underside,
// ridge top, eave top), the top offset 0.30 m along the roof's normal, run from
// one gable eave to the other. Faces and edges in site coordinates
function roofSolid() {
  const Y0 = -GABLE_EAVE, Y1 = D + GABLE_EAVE, dz = ROOF_T * COS, dx = ROOF_T * SLOPE * COS;
  const faces = [], edges = [];
  for (const side of [-1, 1]) {
    const xe = side < 0 ? -EAVE : W + EAVE;
    const sec = [{ x: xe, z: Z_EAVE }, { x: RX, z: RIDGE }, { x: RX, z: RIDGE + ROOF_T / COS }, { x: xe + side * dx, z: Z_EAVE + dz }];
    const at = (q, y) => ({ x: q.x, y, z: q.z });
    for (let i = 0; i < 4; i++) {
      const a = sec[i], b = sec[(i + 1) % 4];
      if (i !== 1) faces.push([at(a, Y0), at(b, Y0), at(b, Y1), at(a, Y1)]); // the ridge joint is inside
      edges.push([at(a, Y0), at(b, Y0)], [at(a, Y1), at(b, Y1)], [at(a, Y0), at(a, Y1)]);
    }
    faces.push(sec.map(q => at(q, Y0)), sec.map(q => at(q, Y1)));
  }
  return { faces, edges };
}
// the site: the outer LWPOLYLINE of Drawing1.dxf (12:47)
const SITE = [[-18.2198, 23.494], [-17.8638, -4.5594], [9.6311, -4.5594], [9.49, 22.9187]].map(([x, y]) => ({ x, y }));
// every LINE and LWPOLYLINE edge of the house plan, local metres
const PLAN = [
 [[7.5,0.0404],[7.5,0]],[[0,14.25],[3.5503,14.25]],[[7.5,0],[4.7429,0]],[[6,8.9147],[0,8.9147]],
 [[4.7429,0],[4.65,0]],[[4.65,0],[4.5571,0]],[[4.5571,0],[0,0]],[[0,21],[0,0]],[[7.5,0.0404],[7.5,8.9147]],
 [[6,10.6153],[0,10.6153]],
 [[3.5503,12.9933],[6,12.9933],[6,16.0939],[3.5503,16.0939],[3.5503,12.9933]],
 [[6,11.5012],[7.5,11.5012],[7.5,8.9147],[6,8.9147],[6,11.5012]],
 [[2.7959,0],[0,0],[0,5.25],[2.7959,5.25],[2.7959,0]],
 [[4.7752,18.0939],[7.5,18.0939],[7.5,21],[4.7752,21],[4.7752,18.0939]],
 [[4.7752,18.0939],[4.7752,16.0939]],[[4.7752,17.0939],[0,17.0939]],[[4.7752,12.9933],[4.7752,10.6153]],
 [[0,21],[4.7752,21]],[[7.5,18.0939],[7.5,11.5012]],[[2.7959,5.25],[2.7959,8.9147]],[[2.7959,5.25],[7.5,5.25]],
 [[6,16.0939],[7.5,16.0939]],[[3.5503,16.0939],[3.5503,17.0939]],[[3.5503,12.9933],[3.5503,10.6153]],
 [[3.5503,10.6153],[3.5503,8.9147]],
].map(l => l.map(([x, y]) => ({ x, y })));

const $ = id => document.getElementById(id);
const S = { t: 1, target: 1, n: 4, op: 1, env: 0.18, offL: 0, offR: 0, solid: false, below: false, ids: true, gfE: false, gfI: false, win: true, elev: null, winSel: null, winW: 0.5, winH: 1.2, winSill: 0.9, sel: null, dirty: true };
let PIECES = [], UNDO = null;

const clamp01 = v => Math.max(0, Math.min(1, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const ease = q => q < 0.5 ? 2 * q * q : 1 - (-2 * q + 2) ** 2 / 2;

/* ---------------- rooms of the plan, as rectangles ---------------- */
// the plan is orthogonal: cut the site at every x and y the lines use, join
// neighbouring grid cells no line separates, then cut a room that is not a
// rectangle into column rectangles (the L room splits along x = 6.00)
function findPieces() {
  const segs = [];
  PLAN.forEach(l => { for (let k = 0; k + 1 < l.length; k++) segs.push([l[k], l[k + 1]]); });
  const r4 = v => Math.round(v * 1e4) / 1e4;
  const xs = [...new Set(segs.flatMap(s => s.map(p => r4(p.x))))].sort((a, b) => a - b);
  const ys = [...new Set(segs.flatMap(s => s.map(p => r4(p.y))))].sort((a, b) => a - b);
  const e = 1e-3;
  const wallV = (x, y0, y1) => segs.some(([a, b]) => Math.abs(a.x - x) < e && Math.abs(b.x - x) < e && Math.min(a.y, b.y) <= y0 + e && Math.max(a.y, b.y) >= y1 - e);
  const wallH = (y, x0, x1) => segs.some(([a, b]) => Math.abs(a.y - y) < e && Math.abs(b.y - y) < e && Math.min(a.x, b.x) <= x0 + e && Math.max(a.x, b.x) >= x1 - e);
  const nx = xs.length - 1, ny = ys.length - 1, seen = new Set(), key = (i, j) => i * 1000 + j;
  const pieces = [];
  let room = 0;
  for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
    if (seen.has(key(i, j))) continue;
    room++;
    const cells = [], st = [[i, j]]; seen.add(key(i, j));
    while (st.length) {
      const [a, b] = st.pop(); cells.push([a, b]);
      const nb = [];
      if (a > 0 && !wallV(xs[a], ys[b], ys[b + 1])) nb.push([a - 1, b]);
      if (a < nx - 1 && !wallV(xs[a + 1], ys[b], ys[b + 1])) nb.push([a + 1, b]);
      if (b > 0 && !wallH(ys[b], xs[a], xs[a + 1])) nb.push([a, b - 1]);
      if (b < ny - 1 && !wallH(ys[b + 1], xs[a], xs[a + 1])) nb.push([a, b + 1]);
      for (const q of nb) if (!seen.has(key(...q))) { seen.add(key(...q)); st.push(q); }
    }
    const cols = new Map();
    for (const [a, b] of cells) {
      const c = cols.get(a) || { a, y0: Infinity, y1: -Infinity };
      c.y0 = Math.min(c.y0, ys[b]); c.y1 = Math.max(c.y1, ys[b + 1]);
      cols.set(a, c);
    }
    const rects = [];
    for (const c of [...cols.values()].sort((p, q) => p.a - q.a)) {
      const last = rects[rects.length - 1];
      if (last && last.a1 === c.a && Math.abs(last.y0 - c.y0) < e && Math.abs(last.y1 - c.y1) < e) { last.x1 = xs[c.a + 1]; last.a1 = c.a + 1; }
      else rects.push({ x0: xs[c.a], x1: xs[c.a + 1], y0: c.y0, y1: c.y1, a1: c.a + 1 });
    }
    rects.forEach(r => pieces.push({ room, x0: r.x0, x1: r.x1, y0: r.y0, y1: r.y1, split: rects.length > 1 }));
  }
  pieces.sort((p, q) => ((p.y0 + p.y1) - (q.y0 + q.y1)) || ((p.x0 + p.x1) - (q.x0 + q.x1)));
  pieces.forEach((p, k) => { p.no = k + 1; p.cx = (p.x0 + p.x1) / 2; p.cy = (p.y0 + p.y1) / 2; });
  return pieces;
}


/* ---------------- shapes ---------------- */
function axes(p) { return { l: p.cx - p.x0 - GAP, r: p.x1 - p.cx - GAP, d: p.cy - p.y0 - GAP, u: p.y1 - p.cy - GAP }; }
const circleR = p => { const a = axes(p); return Math.max(0, Math.min(a.l, a.r, a.d, a.u)); };
// superellipse with a different half-axis on each side; k blends from the
// circle (0) to the full shape (1). N a multiple of 4 keeps the extremes as samples
function shapePts(p, k, n, N) {
  const a = axes(p), r0 = circleR(p), ex = lerp(2, n, k);
  const L = lerp(r0, a.l, k), R = lerp(r0, a.r, k), Dn = lerp(r0, a.d, k), U = lerp(r0, a.u, k);
  const pts = [];
  for (let i = 0; i < N; i++) {
    const th = i / N * Math.PI * 2, c = Math.cos(th), s = Math.sin(th);
    pts.push({ x: p.cx + Math.sign(c) * Math.abs(c) ** (2 / ex) * (c >= 0 ? R : L), y: p.cy + Math.sign(s) * Math.abs(s) ** (2 / ex) * (s >= 0 ? U : Dn) });
  }
  return pts;
}
// top of the curved walls: each roof plane moved in by its side's offset along
// its normal (a vertical drop of offset / cos), never below the storey base.
// With unequal offsets the two planes meet off the ridge line
const DL = () => S.offL / COS, DR = () => S.offR / COS;
const wallTop = x => Math.max(L2, Math.min(RIDGE - SLOPE * (RX - x) - DL(), RIDGE - SLOPE * (x - RX) - DR()));
// x where the top surface creases: where the two planes meet, and where each meets +3.40
function breaks() {
  const xc = RX + (DL() - DR()) / (2 * SLOPE);
  const xl = RX - (RIDGE - L2 - DL()) / SLOPE, xr = RX + (RIDGE - L2 - DR()) / SLOPE;
  const b = [xc];
  if (xl < xc - 1e-9) b.push(xl);
  if (xr > xc + 1e-9) b.push(xr);

const GH_PY_SOURCES = {
"plan": "\"\"\"H60 - 1 Plan\nThe rooms of Drawing1 as rectangles (the L room cut in two at x = 6.00),\na circle at each centre, as large as the room allows Gap clear of the lines.\nInputs : Gap (m)\nOutputs: Data, PlanLines, Site, Rooms, Circles, WallLines, WallIDs, WallMids\nLocal metres; origin = lower-left corner of the plan.\"\"\"\nimport Rhino.Geometry as rg\n\nclass H60(object):\n    \"\"\"The design state passed along the wires (an object, so Grasshopper\n    keeps it as one item instead of listing a dict's keys).\"\"\"\n    def __init__(self, d): self.d = d\n    def __repr__(self): return \"H60 data: %d pieces, %d walls\" % (len(self.d[\"pieces\"]), len(self.d[\"walls\"]))\n\nif Gap is None: Gap = 0.10\nW, D = 7.5, 21.0\nPLAN = __PLAN__\nSITE = __SITE__\n# no, room, x0, y0, x1, y1, centre x, centre y, split  (centres as set on the web page)\nPIECES = __PIECES__\n# id, facade (S N W E or \"\"), ax, ay, bx, by\nWALLS = __WALLS__\n\ndef P(x, y, z=0.0):\n    return rg.Point3d(x, y, z)\n\ndef closed(pts):\n    return rg.PolylineCurve([P(x, y) for x, y in list(pts) + [pts[0]]])\n\npieces = []\nfor no, room, x0, y0, x1, y1, cx, cy, split in PIECES:\n    pieces.append(dict(no=no, room=room, x0=x0, y0=y0, x1=x1, y1=y1, cx=cx, cy=cy, split=split))\nwalls = [dict(id=i, face=f, a=(ax, ay), b=(bx, by)) for i, f, ax, ay, bx, by in WALLS]\n\ndef circle_r(p):\n    return max(0.0, min(p[\"cx\"] - p[\"x0\"], p[\"x1\"] - p[\"cx\"], p[\"cy\"] - p[\"y0\"], p[\"y1\"] - p[\"cy\"]) - Gap)\n\nPlanLines = [rg.PolylineCurve([P(x, y) for x, y in l]) for l in PLAN]\nSite = closed(SITE)\nRooms = [closed([(p[\"x0\"], p[\"y0\"]), (p[\"x1\"], p[\"y0\"]), (p[\"x1\"], p[\"y1\"]), (p[\"x0\"], p[\"y1\"])]) for p in pieces]\nCircles = [rg.Circle(P(p[\"cx\"], p[\"cy\"]), max(circle_r(p), 0.001)).ToNurbsCurve() for p in pieces]\nWallLines = [rg.LineCurve(P(w[\"a\"][0], w[\"a\"][1]), P(w[\"b\"][0], w[\"b\"][1])) for w in walls]\nWallIDs = [w[\"id\"] for w in walls]\nWallMids = [P((w[\"a\"][0] + w[\"b\"][0]) / 2.0, (w[\"a\"][1] + w[\"b\"][1]) / 2.0) for w in walls]\nData = H60(dict(W=W, D=D, gap=float(Gap), plan=PLAN, site=SITE, pieces=pieces, walls=walls))\n",
"flexible": "\"\"\"H60 - 2 Flexible\nEach circle grows into a superellipse held by its room frame and centre:\nfour half-axes = distance from the centre to each side, less Gap.\nInputs : Data, n (2 = ellipse), Seed (0 = centres from the web page,\n         any other value = random centres inside each room)\nOutputs: Data, Shapes, Centres\"\"\"\nimport Rhino.Geometry as rg\nimport math, random\n\nclass H60(object):\n    \"\"\"The design state passed along the wires (an object, so Grasshopper\n    keeps it as one item instead of listing a dict's keys).\"\"\"\n    def __init__(self, d): self.d = d\n    def __repr__(self): return \"H60 data: %d pieces, %d walls\" % (len(self.d[\"pieces\"]), len(self.d[\"walls\"]))\n\nd0 = Data.d\nif n is None: n = 4.0\nif Seed is None: Seed = 0\nKEEP = 0.15\ngap = d0[\"gap\"]\npieces = [dict(p) for p in d0[\"pieces\"]]\nif int(Seed) != 0:\n    rnd = random.Random(int(Seed))\n    for p in pieces:\n        p[\"cx\"] = p[\"x0\"] + KEEP + (p[\"x1\"] - p[\"x0\"] - 2 * KEEP) * rnd.random()\n        p[\"cy\"] = p[\"y0\"] + KEEP + (p[\"y1\"] - p[\"y0\"] - 2 * KEEP) * rnd.random()\n\ndef sgn(v):\n    return (v > 0) - (v < 0)\n\ndef shape_pts(p, ex, N=160):\n    l = p[\"cx\"] - p[\"x0\"] - gap; r = p[\"x1\"] - p[\"cx\"] - gap\n    dn = p[\"cy\"] - p[\"y0\"] - gap; u = p[\"y1\"] - p[\"cy\"] - gap\n    pts = []\n    for i in range(N):\n        th = 2.0 * math.pi * i / N\n        c = math.cos(th); s = math.sin(th)\n        x = p[\"cx\"] + sgn(c) * abs(c) ** (2.0 / ex) * (r if c >= 0 else l)\n        y = p[\"cy\"] + sgn(s) * abs(s) ** (2.0 / ex) * (u if s >= 0 else dn)\n        pts.append((x, y))\n    return pts\n\nShapes = []\nfor p in pieces:\n    pts = shape_pts(p, n)\n    Shapes.append(rg.PolylineCurve([rg.Point3d(x, y, 0) for x, y in pts + [pts[0]]]))\nCentres = [rg.Point3d(p[\"cx\"], p[\"cy\"], 0) for p in pieces]\nd = dict(d0)\nd[\"pieces\"] = pieces\nd[\"n\"] = float(n)\nData = H60(d)\n",
"levels": "\"\"\"H60 - 3 Levels & roof\nGround +/-0.00, ground floor FF on a solid base, second floor Storey above it,\na gable roof over the house: ridge RidgeH above FF on the centre line, down\nto the storey base at the long walls, RoofT thick (built up along the normal),\neaves EaveSlope out along the slope at the sides and GableEave at the ends.\nInputs : Data, FF, Storey, RidgeH, RoofT, EaveSlope, GableEave, Slab\nOutputs: Data, Site, Base, SlabBrep, Roof (closed Brep), Levels\"\"\"\nimport Rhino.Geometry as rg\nimport math\n\nclass H60(object):\n    \"\"\"The design state passed along the wires (an object, so Grasshopper\n    keeps it as one item instead of listing a dict's keys).\"\"\"\n    def __init__(self, d): self.d = d\n    def __repr__(self): return \"H60 data: %d pieces, %d walls\" % (len(self.d[\"pieces\"]), len(self.d[\"walls\"]))\n\nd0 = Data.d\nif FF is None: FF = 1.0\nif Storey is None: Storey = 2.4\nif RidgeH is None: RidgeH = 6.0\nif RoofT is None: RoofT = 0.3\nif EaveSlope is None: EaveSlope = 1.2\nif GableEave is None: GableEave = 1.0\nif Slab is None: Slab = 0.15\nW, D = d0[\"W\"], d0[\"D\"]\nL2 = FF + Storey\nRIDGE = FF + RidgeH\nRX = W / 2.0\nSLOPE = (RIDGE - L2) / RX\nCOS = 1.0 / math.hypot(1.0, SLOPE)\nEAVE = EaveSlope * COS\nroof = lambda x: RIDGE - SLOPE * abs(x - RX)\nZ_EAVE = roof(-EAVE)\n\ndef mesh(tris):\n    m = rg.Mesh()\n    for a, b, c in tris:\n        i = m.Vertices.Count\n        for q in (a, b, c): m.Vertices.Add(q[0], q[1], q[2])\n        m.Faces.AddFace(i, i + 1, i + 2)\n    m.Normals.ComputeNormals()\n    m.Compact()\n    return m\n\ndef quad(t, a, b, c, d):\n    t.append((a, b, c)); t.append((a, c, d))\n\ndef box(x0, x1, y0, y1, z0, z1):\n    return rg.Box(rg.BoundingBox(rg.Point3d(x0, y0, z0), rg.Point3d(x1, y1, z1))).ToBrep()\n\nsite = d0[\"site\"]\nSite = mesh([((site[0][0], site[0][1], 0), (site[i][0], site[i][1], 0), (site[i + 1][0], site[i + 1][1], 0)) for i in range(1, len(site) - 1)])\nBase = box(0, W, 0, D, 0, FF - Slab)\nSlabBrep = box(0, W, 0, D, FF - Slab, FF)\n\n# the roof as one closed solid: the gable section (both eaves under, ridge\n# under, both eaves on top, ridge on top) run from gable eave to gable eave,\n# built face by face and joined\nY0, Y1 = -GableEave, D + GableEave\ndz, dx = RoofT * COS, RoofT * SLOPE * COS\nsec = [(-EAVE, Z_EAVE), (RX, RIDGE), (W + EAVE, Z_EAVE), (W + EAVE + dx, Z_EAVE + dz), (RX, RIDGE + RoofT / COS), (-EAVE - dx, Z_EAVE + dz)]\nTOL = 0.001\nat = lambda q, y: rg.Point3d(q[0], y, q[1])\nparts = []\nfor i in range(len(sec)):\n    a, b = sec[i], sec[(i + 1) % len(sec)]\n    # one flat face per edge of the section, run along the house\n    parts.append(rg.Brep.CreateFromCornerPoints(at(a, Y0), at(b, Y0), at(b, Y1), at(a, Y1), TOL))\nfor y in (Y0, Y1):\n    cap = rg.PolylineCurve([at(q, y) for q in sec + [sec[0]]])\n    parts.extend(rg.Brep.CreatePlanarBreps(cap, TOL))\njoined = rg.Brep.JoinBreps([p for p in parts if p is not None], TOL)\nRoof = joined[0] if joined is not None and len(joined) == 1 else list(joined or parts)\nprint(\"roof: %d faces joined into %s\" % (len(parts), \"one closed solid\" if not isinstance(Roof, list) and Roof.IsSolid else \"%d pieces\" % len(Roof if isinstance(Roof, list) else [Roof])))\nLevels = [0.0, FF, L2, RIDGE, RIDGE + RoofT / COS, Z_EAVE]\nd = dict(d0)\nd.update(FF=FF, L2=L2, RIDGE=RIDGE, RX=RX, SLOPE=SLOPE, COS=COS, SLAB=Slab)\nData = H60(d)\n",
"curved": "\"\"\"H60 - 4 Curved walls\nThe superellipses stand on the storey base and rise to the roof underside,\neach roof plane moved in by its side's offset along its normal; never below\nthe base (where the roof is too low the wall has no height).\nInputs : Data, OffL, OffR (m, normal to the roof)\nOutputs: Data, CurvedWalls, Bases, Tops\"\"\"\nimport Rhino.Geometry as rg\nimport math\n\nclass H60(object):\n    \"\"\"The design state passed along the wires (an object, so Grasshopper\n    keeps it as one item instead of listing a dict's keys).\"\"\"\n    def __init__(self, d): self.d = d\n    def __repr__(self): return \"H60 data: %d pieces, %d walls\" % (len(self.d[\"pieces\"]), len(self.d[\"walls\"]))\n\nd0 = Data.d\nif OffL is None: OffL = 0.0\nif OffR is None: OffR = 0.0\ngap, ex = d0[\"gap\"], d0[\"n\"]\nL2, RIDGE, RX, SLOPE, COS = d0[\"L2\"], d0[\"RIDGE\"], d0[\"RX\"], d0[\"SLOPE\"], d0[\"COS\"]\nDL, DR = OffL / COS, OffR / COS\n\ndef wall_top(x):\n    return max(L2, min(RIDGE - SLOPE * (RX - x) - DL, RIDGE - SLOPE * (x - RX) - DR))\n\ndef breaks():\n    xc = RX + (DL - DR) / (2 * SLOPE)\n    xl = RX - (RIDGE - L2 - DL) / SLOPE\n    xr = RX + (RIDGE - L2 - DR) / SLOPE\n    b = [xc]\n    if xl < xc - 1e-9: b.append(xl)\n    if xr > xc + 1e-9: b.append(xr)\n    return sorted(b)\n\ndef sgn(v):\n    return (v > 0) - (v < 0)\n\ndef shape_pts(p, N=160):\n    l = p[\"cx\"] - p[\"x0\"] - gap; r = p[\"x1\"] - p[\"cx\"] - gap\n    dn = p[\"cy\"] - p[\"y0\"] - gap; u = p[\"y1\"] - p[\"cy\"] - gap\n    pts = []\n    for i in range(N):\n        th = 2.0 * math.pi * i / N\n        c = math.cos(th); s = math.sin(th)\n        pts.append((p[\"cx\"] + sgn(c) * abs(c) ** (2.0 / ex) * (r if c >= 0 else l),\n                    p[\"cy\"] + sgn(s) * abs(s) ** (2.0 / ex) * (u if s >= 0 else dn)))\n    return pts\n\ndef ring_pts(p):\n    pts, out, bs = shape_pts(p), [], breaks()\n    for i in range(len(pts)):\n        a, b = pts[i], pts[(i + 1) % len(pts)]\n        out.append(a)\n        ts = sorted((x - a[0]) / (b[0] - a[0]) for x in bs if (a[0] - x) * (b[0] - x) < 0)\n        for t in ts:\n            out.append((a[0] + t * (b[0] - a[0]), a[1] + t * (b[1] - a[1])))\n    return out\n\ndef clip_side(poly, x0, keep_above):\n    out = []\n    side = (lambda q: q[0] - x0) if keep_above else (lambda q: x0 - q[0])\n    for i in range(len(poly)):\n        a, b = poly[i], poly[(i + 1) % len(poly)]\n        da, db = side(a), side(b)\n        if da >= -1e-12: out.append(a)\n        if (da > 1e-12 and db < -1e-12) or (da < -1e-12 and db > 1e-12):\n            t = da / (da - db)\n            out.append((a[0] + t * (b[0] - a[0]), a[1] + t * (b[1] - a[1])))\n    return out\n\ndef cap_tris(ring):\n    edges = [None] + breaks() + [None]\n    tris = []\n    for k in range(len(edges) - 1):\n        strip = ring\n        if edges[k] is not None: strip = clip_side(strip, edges[k], True)\n        if edges[k + 1] is not None and strip: strip = clip_side(strip, edges[k + 1], False)\n        for i in range(1, len(strip) - 1):\n            tris.append((strip[0], strip[i], strip[i + 1]))\n    return tris\n\ndef area2(a, b, c):\n    ux, uy, uz = b[0] - a[0], b[1] - a[1], b[2] - a[2]\n    vx, vy, vz = c[0] - a[0], c[1] - a[1], c[2] - a[2]\n    return (uy * vz - uz * vy) ** 2 + (uz * vx - ux * vz) ** 2 + (ux * vy - uy * vx) ** 2\n\ndef mesh(tris):\n    m = rg.Mesh()\n    for a, b, c in tris:\n        if area2(a, b, c) < 1e-14: continue\n        i = m.Vertices.Count\n        for q in (a, b, c): m.Vertices.Add(q[0], q[1], q[2])\n        m.Faces.AddFace(i, i + 1, i + 2)\n    m.Normals.ComputeNormals()\n    m.Compact()\n    return m\n\nCurvedWalls, Bases, Tops = [], [], []\nfor p in d0[\"pieces\"]:\n    ring = ring_pts(p)\n    bot = [(x, y, L2) for x, y in ring]\n    top = [(x, y, wall_top(x)) for x, y in ring]\n    t = []\n    for i in range(len(ring)):\n        j = (i + 1) % len(ring)\n        if top[i][2] - L2 < 1e-6 and top[j][2] - L2 < 1e-6: continue\n        t.append((bot[i], bot[j], top[j])); t.append((bot[i], top[j], top[i]))\n    for a, b, c in cap_tris(ring):\n        t.append(tuple((q[0], q[1], wall_top(q[0])) for q in (a, b, c)))\n    CurvedWalls.append(mesh(t))\n    Bases.append(rg.PolylineCurve([rg.Point3d(*q) for q in bot + [bot[0]]]))\n    Tops.append(rg.PolylineCurve([rg.Point3d(*q) for q in top + [top[0]]]))\nd = dict(d0)\nd.update(offL=float(OffL), offR=float(OffR))\nData = H60(d)\n",
"windows": "\"\"\"H60 - 5 Windows (ground floor)\nOne centred window on every outside wall at least 0.90 m long (rule), or the\nwindows as edited on the web page.\nInputs : Data, WidthPct (share of the wall, %), Height, Sill (above FF),\n         UsePage (1 = windows from the web page, 0 = rule), Show (1/0)\nOutputs: Data, Panes, Frames, WindowIDs  (I28 is a glass door, from the floor)\"\"\"\nimport Rhino.Geometry as rg\n\nclass H60(object):\n    \"\"\"The design state passed along the wires (an object, so Grasshopper\n    keeps it as one item instead of listing a dict's keys).\"\"\"\n    def __init__(self, d): self.d = d\n    def __repr__(self): return \"H60 data: %d pieces, %d walls\" % (len(self.d[\"pieces\"]), len(self.d[\"walls\"]))\n\nd0 = Data.d\nif WidthPct is None: WidthPct = 50.0\nif Height is None: Height = 1.2\nif Sill is None: Sill = 0.9\nif UsePage is None: UsePage = 1\nif Show is None: Show = 1\nW, D, FF, L2 = d0[\"W\"], d0[\"D\"], d0[\"FF\"], d0[\"L2\"]\n# key, facade, wall id, from, to (along the wall axis), sill, height\nPAGE = __WINDOWS__\n# walls that are openings get no window (the page has already left them out)\nHIDE = set(__HIDE__)\n# facades: axis, position across it, length (the house sides, plus the court walls)\nFACES = __FACES__\n# where a facade starts along its axis (court walls do not start at 0)\nFACE_LO = __FACELO__\n# walls whose opening is a glass door: from the floor, DOOR_W x DOOR_H\nDOORS = set(__DOORS__)\nDOOR_W, DOOR_H = __DOORW__, __DOORH__\nMIN_WALL, MIN = 0.9, 0.2\n\ndef face_pt(f, a, z):\n    axis, at, _ = FACES[f]\n    return rg.Point3d(a, at, z) if axis == \"x\" else rg.Point3d(at, a, z)\n\ndef clamp_win(w):\n    L = FACES[w[\"face\"]][2]\n    w[\"a0\"] = max(FACE_LO.get(w[\"face\"], 0.0), min(L - MIN, w[\"a0\"]))\n    w[\"a1\"] = max(w[\"a0\"] + MIN, min(L, w[\"a1\"]))\n    w[\"sill\"] = max(0.0, min(L2 - FF - MIN, w[\"sill\"]))\n    w[\"h\"] = max(MIN, min(L2 - FF - w[\"sill\"], w[\"h\"]))\n    return w\n\nwins = []\nif int(Show):\n    if int(UsePage):\n        for key, f, wall, a0, a1, sill, h in PAGE:\n            wins.append(clamp_win(dict(key=key, face=f, wall=wall, a0=a0, a1=a1, sill=sill, h=h)))\n    else:\n        for wl in d0[\"walls\"]:\n            if not wl[\"face\"] or wl[\"id\"] in HIDE: continue\n            ln = abs(wl[\"b\"][0] - wl[\"a\"][0]) + abs(wl[\"b\"][1] - wl[\"a\"][1])\n            if ln < MIN_WALL: continue\n            lo = min(wl[\"a\"][0], wl[\"b\"][0]) if FACES[wl[\"face\"]][0] == \"x\" else min(wl[\"a\"][1], wl[\"b\"][1])\n            if wl[\"id\"] in DOORS:\n                dw = min(DOOR_W, ln - 0.1)\n                a0 = lo + (ln - dw) / 2.0\n                wins.append(clamp_win(dict(key=wl[\"id\"], face=wl[\"face\"], wall=wl[\"id\"], a0=a0, a1=a0 + dw, sill=0.0, h=DOOR_H)))\n                continue\n            ww = WidthPct / 100.0 * ln\n            a0 = lo + (ln - ww) / 2.0\n            wins.append(clamp_win(dict(key=wl[\"id\"], face=wl[\"face\"], wall=wl[\"id\"], a0=a0, a1=a0 + ww, sill=float(Sill), h=float(Height))))\n\nPanes, Frames, WindowIDs = [], [], []\nfor w in wins:\n    z0, z1 = FF + w[\"sill\"], FF + w[\"sill\"] + w[\"h\"]\n    c = [face_pt(w[\"face\"], w[\"a0\"], z0), face_pt(w[\"face\"], w[\"a1\"], z0), face_pt(w[\"face\"], w[\"a1\"], z1), face_pt(w[\"face\"], w[\"a0\"], z1)]\n    Panes.append(rg.Brep.CreateFromCornerPoints(c[0], c[1], c[2], c[3], 0.001))\n    Frames.append(rg.PolylineCurve(c + [c[0]]))\n    WindowIDs.append(w[\"key\"])\nd = dict(d0)\nd[\"windows\"] = wins\nData = H60(d)\n",
"walls": "\"\"\"H60 - 6 Walls\nThe see-through envelope (ground-floor band with the windows cut out, gable\ntriangles) and the ground-floor walls, Thickness thick, as closed Breps:\noutside, one continuous wall per stretch of a facade, standing inside the\noutline (outer face on it), windows cut through; inside, one per segment,\ncentred on its line, run past its ends by half the thickness but never past\nthe outline. Hidden inside walls are not built; hidden outside walls are\nopenings (no wall, no glass, no window).\nInputs : Data, ShowExt (1/0), ShowInt (1/0), Thickness\nOutputs: Envelope, ExtWalls, IntWalls, ExtNames, IntIDs, White\"\"\"\nimport Rhino.Geometry as rg\n\nclass H60(object):\n    \"\"\"The design state passed along the wires (an object, so Grasshopper\n    keeps it as one item instead of listing a dict's keys).\"\"\"\n    def __init__(self, d): self.d = d\n    def __repr__(self): return \"H60 data: %d pieces, %d walls\" % (len(self.d[\"pieces\"]), len(self.d[\"walls\"]))\n\nd0 = Data.d\nif ShowExt is None: ShowExt = 1\nif ShowInt is None: ShowInt = 1\nif Thickness is None: Thickness = 0.10\nHIDE = set(__HIDE__)\nW, D, FF, L2, RX, RIDGE, SLAB = d0[\"W\"], d0[\"D\"], d0[\"FF\"], d0[\"L2\"], d0[\"RX\"], d0[\"RIDGE\"], d0[\"SLAB\"]\nwins = d0.get(\"windows\", [])\n# facades: axis, position across it, length (the house sides, plus the court walls)\nFACES = __FACES__\nINWARD = __INWARD__\nTOL = 0.001\n\ndef along(f, wl):\n    i = 0 if FACES[f][0] == \"x\" else 1\n    return (min(wl[\"a\"][i], wl[\"b\"][i]), max(wl[\"a\"][i], wl[\"b\"][i]))\n\ndef face_runs(f):\n    iv = sorted(along(f, wl) for wl in d0[\"walls\"] if wl[\"face\"] == f and wl[\"id\"] not in HIDE)\n    runs = []\n    for a, b in iv:\n        if runs and a <= runs[-1][1] + 1e-6: runs[-1][1] = max(runs[-1][1], b)\n        else: runs.append([a, b])\n    return runs\n\ndef face_pt(f, a, z):\n    axis, at, _ = FACES[f]\n    return (a, at, z) if axis == \"x\" else (at, a, z)\n\ndef holes_of(f):\n    return [(w[\"a0\"], w[\"a1\"], FF + w[\"sill\"], FF + w[\"sill\"] + w[\"h\"]) for w in wins if w[\"face\"] == f]\n\ndef hole_quads(lo, hi, z0, z1, holes):\n    xs = sorted(set([lo, hi] + [v for h in holes for v in (h[0], h[1]) if lo < v < hi]))\n    quads = []\n    for i in range(len(xs) - 1):\n        u, v = xs[i], xs[i + 1]\n        if v - u < 1e-6: continue\n        spans = [(z0, z1)]\n        for a0, a1, h0, h1 in holes:\n            if not (a0 <= u + 1e-9 and a1 >= v - 1e-9): continue\n            nxt = []\n            for p, q in spans:\n                for s in ((p, min(q, h0)), (max(p, h1), q)):\n                    if s[1] - s[0] > 1e-6: nxt.append(s)\n            spans = nxt\n        for p, q in spans: quads.append((u, v, p, q))\n    return quads\n\ndef box(horiz, c, lo, hi, n0, n1, z0, z1):\n    # a box lo..hi along the wall axis, c+n0..c+n1 across it, z0..z1 high\n    if horiz: p0, p1 = rg.Point3d(lo, c + n0, z0), rg.Point3d(hi, c + n1, z1)\n    else: p0, p1 = rg.Point3d(c + n0, lo, z0), rg.Point3d(c + n1, hi, z1)\n    return rg.Box(rg.BoundingBox(p0, p1)).ToBrep()\n\ndef wall(horiz, c, lo, hi, holes, t):\n    solid = box(horiz, c, lo, hi, -t / 2.0, t / 2.0, FF, L2)\n    cutters = [box(horiz, c, max(a0, lo), min(a1, hi), -t, t, z0, z1) for a0, a1, z0, z1 in holes if min(a1, hi) - max(a0, lo) > 1e-6]\n    if cutters:\n        cut = rg.Brep.CreateBooleanDifference([solid], cutters, TOL)\n        if cut and len(cut) == 1: return cut[0]\n        print(\"window cut failed on a wall at %.2f..%.2f; kept whole\" % (lo, hi))\n    return solid\n\n# the envelope band, only where the facade is wall\nenv = []\nif not int(ShowExt):\n    for f in FACES:\n        for lo, hi in face_runs(f):\n            for u, v, p, r in hole_quads(lo, hi, FF, L2, holes_of(f)):\n                env.append((face_pt(f, u, p), face_pt(f, v, p), face_pt(f, v, r), face_pt(f, u, r)))\nm = rg.Mesh()\nfor a, b, c, dd in env:\n    i = m.Vertices.Count\n    for q in (a, b, c, dd): m.Vertices.Add(q[0], q[1], q[2])\n    m.Faces.AddFace(i, i + 1, i + 2, i + 3)\nfor y in (0.0, D):\n    i = m.Vertices.Count\n    for q in ((0.0, y, L2), (W, y, L2), (RX, y, RIDGE)): m.Vertices.Add(q[0], q[1], q[2])\n    m.Faces.AddFace(i, i + 1, i + 2)\nm.Normals.ComputeNormals()\nEnvelope = m\n\nExtWalls, IntWalls, ExtNames, IntIDs = [], [], [], []\nif int(ShowExt):\n    for f in sorted(FACES):\n        axis, at, _ = FACES[f]\n        runs = face_runs(f)\n        for k, (lo, hi) in enumerate(runs):\n            ExtWalls.append(wall(axis == \"x\", at + INWARD[f] * Thickness / 2.0, lo, hi, holes_of(f), Thickness))\n            ExtNames.append(\"Wall \" + f + (str(k + 1) if len(runs) > 1 else \"\"))\nif int(ShowInt):\n    for wl in d0[\"walls\"]:\n        if wl[\"face\"] or wl[\"id\"] in HIDE: continue\n        horiz = abs(wl[\"a\"][1] - wl[\"b\"][1]) < 1e-6\n        i = 0 if horiz else 1\n        L = W if horiz else D\n        lo = max(0.0, min(wl[\"a\"][i], wl[\"b\"][i]) - Thickness / 2.0)\n        hi = min(L, max(wl[\"a\"][i], wl[\"b\"][i]) + Thickness / 2.0)\n        IntWalls.append(box(horiz, wl[\"a\"][1] if horiz else wl[\"a\"][0], lo, hi, -Thickness / 2.0, Thickness / 2.0, FF, L2))\n        IntIDs.append(wl[\"id\"])\n\n# everything that takes the wall white: base, slab, outside and inside walls\nWhite = [rg.Box(rg.BoundingBox(rg.Point3d(0, 0, 0), rg.Point3d(W, D, FF - SLAB))).ToBrep(),\n         rg.Box(rg.BoundingBox(rg.Point3d(0, 0, FF - SLAB), rg.Point3d(W, D, FF))).ToBrep()] + ExtWalls + IntWalls\n\n# a line in the \"out\" panel so an empty output is never a mystery\nprint(\"outside walls: %d (ShowExt = %d), inside walls: %d (ShowInt = %d), hidden: %s\" % (\n    len(ExtWalls), int(ShowExt), len(IntWalls), int(ShowInt), \", \".join(sorted(HIDE))))\n"
};

// GH_IO binary archive: a chunk is its name, index, item count, chunk count,
// the items (name, index, type, value) and the child chunks; the whole
// archive is raw-deflated
class GhChunk {
  constructor(name, idx = -1) { this.name = name; this.idx = idx; this.items = []; this.chunks = []; }
  item(name, type, value, idx = -1) { this.items.push({ name, idx, type, value }); return this; }
  chunk(name, idx = -1) { const c = new GhChunk(name, idx); this.chunks.push(c); return c; }
}
const GH_T = { bool: 1, int: 3, single: 5, double: 6, date: 8, guid: 9, string: 10, point: 30, pointf: 31, size: 32, rectf: 35, color: 36, version: 80 };
function ghBytes(root) {
  const out = [], enc = new TextEncoder();
  const u8 = v => out.push(v & 255);
  const i32 = v => { const b = new DataView(new ArrayBuffer(4)); b.setInt32(0, v, true); out.push(...new Uint8Array(b.buffer)); };
  const f32 = v => { const b = new DataView(new ArrayBuffer(4)); b.setFloat32(0, v, true); out.push(...new Uint8Array(b.buffer)); };
  const f64 = v => { const b = new DataView(new ArrayBuffer(8)); b.setFloat64(0, v, true); out.push(...new Uint8Array(b.buffer)); };
  const i64 = v => { const b = new DataView(new ArrayBuffer(8)); b.setBigInt64(0, v, true); out.push(...new Uint8Array(b.buffer)); };
  const str = s => {
    const b = enc.encode(s); let n = b.length;
    do { let c = n & 0x7f; n >>>= 7; if (n) c |= 0x80; u8(c); } while (n);
    for (const x of b) out.push(x);
  };
  const guid = g => {
    const h = g.replace(/-/g, ""), by = [];
    for (let i = 0; i < 32; i += 2) by.push(parseInt(h.slice(i, i + 2), 16));
    out.push(by[3], by[2], by[1], by[0], by[5], by[4], by[7], by[6], ...by.slice(8));
  };
  const value = (t, v) => {
    switch (t) {
      case GH_T.bool: u8(v ? 1 : 0); break;
      case GH_T.int: case GH_T.color: i32(v); break;
      case GH_T.single: f32(v); break;
      case GH_T.double: f64(v); break;
      case GH_T.date: i64(v); break;
      case GH_T.guid: guid(v); break;
      case GH_T.string: str(v); break;
      case GH_T.point: case GH_T.size: i32(v[0]); i32(v[1]); break;
      case GH_T.pointf: f32(v[0]); f32(v[1]); break;
      case GH_T.rectf: v.forEach(f32); break;
      case GH_T.version: v.forEach(i32); break;
      default: throw new Error("GH type " + t);
    }
  };
  const write = c => {
    str(c.name); i32(c.idx); i32(c.items.length); i32(c.chunks.length);
    for (const it of c.items) { str(it.name); i32(it.idx); i32(it.type); value(it.type, it.value); }
    c.chunks.forEach(write);
  };
  write(root);
  return new Uint8Array(out);
}
async function deflateRaw(bytes) {
  const cs = new CompressionStream("deflate-raw");
  const stream = new Blob([bytes]).stream().pipeThrough(cs);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
const newGuid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
  const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16);
}));

// a scene description → archive. comps: { nick, code, x, y, inputs:[{name, hint, src?}], outputs:[names] }
// sliders: { nick, x, y, min, max, value, digits, int }; groups: { nick, colour, members:[objects] }
function ghArchive(comps, sliders, groups) {
  const root = new GhChunk("Root");
  root.item("ArchiveVersion", GH_T.version, [0, 2, 2]);
  const def = root.chunk("Definition");
  def.item("plugin_version", GH_T.version, [1, 0, 7]);
  const hd = def.chunk("DocumentHeader");
  hd.item("DocumentID", GH_T.guid, newGuid()).item("Preview", GH_T.string, "Shaded").item("PreviewMeshType", GH_T.int, 1)
    .item("PreviewNormal", GH_T.color, -1498698837).item("PreviewSelected", GH_T.color, -543488);
  const pr = def.chunk("DefinitionProperties");
  pr.item("Date", GH_T.date, dotnetNow()).item("Description", GH_T.string, "H60 — Flexible Grid from the Plan (exported from the web page)").item("Name", GH_T.string, "h60.gh");
  pr.chunk("Revisions").item("RevisionCount", GH_T.int, 0);
  pr.chunk("Projection").item("Target", GH_T.point, [-40, -40]).item("Zoom", GH_T.single, 0.75);
  pr.chunk("Views").item("ViewCount", GH_T.int, 0);
  def.chunk("RcpLayout").item("GroupCount", GH_T.int, 0);
  def.chunk("Author").item("Company", GH_T.string, "").item("Name", GH_T.string, "H60").item("Website", GH_T.string, "https://au-siradol.github.io/siradol/");
  const libs = def.chunk("GHALibraries");
  libs.item("Count", GH_T.int, 1);
  libs.chunk("Library", 0).item("AssemblyFullName", GH_T.string, GH_PY_LIB.name).item("AssemblyVersion", GH_T.string, GH_PY_LIB.version)
    .item("Author", GH_T.string, "").item("Id", GH_T.guid, GHID.zero).item("Name", GH_T.string, "").item("Version", GH_T.string, "");
  const objs = def.chunk("DefinitionObjects");
  const all = [...sliders, ...comps, ...groups];
  objs.item("ObjectCount", GH_T.int, all.length);
  let k = 0;
  for (const s of sliders) {
    const o = objs.chunk("Object", k++);
    o.item("GUID", GH_T.guid, GHID.slider).item("Name", GH_T.string, "Number Slider");
    const c = o.chunk("Container");
    const w = 170;
    c.item("Description", GH_T.string, "Numeric slider for single values").item("InstanceGuid", GH_T.guid, s.id)
      .item("Name", GH_T.string, "Number Slider").item("NickName", GH_T.string, s.nick).item("Optional", GH_T.bool, false).item("SourceCount", GH_T.int, 0);
    c.chunk("Attributes").item("Bounds", GH_T.rectf, [s.x, s.y, w, 20]).item("Pivot", GH_T.pointf, [s.x, s.y]);
    c.chunk("Slider").item("Digits", GH_T.int, s.digits).item("GripDisplay", GH_T.int, 1).item("Interval", GH_T.int, s.int ? 1 : 0)
      .item("Max", GH_T.double, s.max).item("Min", GH_T.double, s.min).item("SnapCount", GH_T.int, 0).item("Value", GH_T.double, s.value);
  }
  for (const cp of comps) {
    const o = objs.chunk("Object", k++);
    o.item("GUID", GH_T.guid, GHID.python).item("Lib", GH_T.guid, GHID.zero).item("Name", GH_T.string, "GhPython Script");
    const c = o.chunk("Container");
    const nIn = cp.inputs.length, nOut = cp.outputs.length + 1, rows = Math.max(nIn, nOut), h = rows * 20 + 4, wIn = 70, wOut = 80, w = wIn + wOut + 30;
    c.item("CodeInput", GH_T.string, cp.code).item("Description", GH_T.string, "GhPython provides a Python script component")
      .item("EditorLocation", GH_T.point, [200, 100]).item("EditorSize", GH_T.size, [760, 620])
      .item("HideInput", GH_T.bool, true).item("HideOutput", GH_T.bool, false).item("InputIsPath", GH_T.bool, false)
      .item("InstanceGuid", GH_T.guid, cp.id).item("IsAdvancedMode", GH_T.bool, false).item("MarshalOutGuids", GH_T.bool, true)
      .item("Name", GH_T.string, "GhPython Script").item("NickName", GH_T.string, cp.nick);
    c.chunk("Attributes").item("Bounds", GH_T.rectf, [cp.x, cp.y, w, h]).item("Pivot", GH_T.pointf, [cp.x + w / 2, cp.y + h / 2]);
    const pd = c.chunk("ParameterData");
    pd.item("InputCount", GH_T.int, nIn);
    cp.inputs.forEach((p, i) => pd.item("InputId", GH_T.guid, GHID.scriptVar, i));
    pd.item("OutputCount", GH_T.int, nOut);
    pd.item("OutputId", GH_T.guid, GHID.outString, 0);
    cp.outputs.forEach((p, i) => pd.item("OutputId", GH_T.guid, GHID.outGeneric, i + 1));
    const ph = (h - 4) / nIn, oh = (h - 4) / nOut;
    cp.inputs.forEach((p, i) => {
      const ip = pd.chunk("InputParam", i);
      ip.item("AllowTreeAccess", GH_T.bool, true).item("Description", GH_T.string, "Script input " + p.name + ".")
        .item("InstanceGuid", GH_T.guid, p.id).item("Name", GH_T.string, p.name).item("NickName", GH_T.string, p.name)
        .item("Optional", GH_T.bool, true).item("ScriptParamAccess", GH_T.int, 0).item("ShowTypeHints", GH_T.bool, true);
      if (p.src) ip.item("Source", GH_T.guid, p.src, 0);
      ip.item("SourceCount", GH_T.int, p.src ? 1 : 0).item("TypeHintID", GH_T.guid, p.hint);
      ip.chunk("Attributes").item("Bounds", GH_T.rectf, [cp.x + 2, cp.y + 2 + i * ph, wIn - 4, ph]).item("Pivot", GH_T.pointf, [cp.x + wIn / 2, cp.y + 2 + (i + 0.5) * ph]);

        .item("InstanceGuid", GH_T.guid, cp.outIds[i]).item("Name", GH_T.string, name).item("NickName", GH_T.string, name)
        .item("Optional", GH_T.bool, false).item("SourceCount", GH_T.int, 0);
      op.chunk("Attributes").item("Bounds", GH_T.rectf, [cp.x + w - wOut + 2, cp.y + 2 + i * oh, wOut - 4, oh]).item("Pivot", GH_T.pointf, [cp.x + w - wOut / 2, cp.y + 2 + (i + 0.5) * oh]);
    });
  }
  for (const g of groups) {
    const o = objs.chunk("Object", k++);
    o.item("GUID", GH_T.guid, GHID.group).item("Name", GH_T.string, "Group");
    const c = o.chunk("Container");
    c.item("Border", GH_T.int, 1).item("Colour", GH_T.color, g.colour).item("Description", GH_T.string, "A group of Grasshopper objects");
    g.members.forEach((m, i) => c.item("ID", GH_T.guid, m, i));
    c.item("ID_Count", GH_T.int, g.members.length).item("InstanceGuid", GH_T.guid, g.id).item("Name", GH_T.string, "Group").item("NickName", GH_T.string, g.nick);

  }
  return root;
}

// Python literal for plain data (numbers, strings, lists)
const pyLit = v => Array.isArray(v) ? "[" + v.map(pyLit).join(", ") + "]"
  : typeof v === "string" ? JSON.stringify(v)
  : typeof v === "boolean" ? (v ? "True" : "False")
  : Number.isInteger(v) ? String(v) : String(+v.toFixed(6));

    }),
    PY.flexible, PY.levels, PY.curved,
    fill(PY.windows, { __WINDOWS__: "[\n    " + windows().map(w => pyLit([w.key, w.face, w.wall || "", +w.a0.toFixed(4), +w.a1.toFixed(4), +w.sill.toFixed(4), +w.h.toFixed(4)])).join(",\n    ") + "]", __HIDE__: pyLit([...GF_HIDE]), __FACES__: pyFaces(),
      __FACELO__: "{" + Object.entries(FACES).filter(([, f]) => f.lo).map(([k, f]) => JSON.stringify(k) + ": " + pyLit(f.lo)).join(", ") + "}",
      __DOORS__: pyLit([...DOOR_WALLS]), __DOORW__: pyLit(DOOR_W), __DOORH__: pyLit(DOOR_H) }),
    fill(PY.walls, { __HIDE__: pyLit([...GF_HIDE]), __FACES__: pyFaces(), __INWARD__: "{" + Object.entries(INWARD).map(([k, v]) => JSON.stringify(k) + ": " + v).join(", ") + "}" }),
  ];
  // components left to right, sliders to the left of each, one group per box
  const F = GHID.hintFloat, I = GHID.hintInt, O = GHID.hintObject;
  const spec = [
    { nick: "1 Plan", inputs: [["Gap", F, 0, 0.5, GAP, 2]], outputs: ["Data", "PlanLines", "Site", "Rooms", "Circles", "WallLines", "WallIDs", "WallMids"] },
    { nick: "2 Flexible", inputs: [["Data", O], ["n", F, 2, 10, S.n, 1], ["Seed", I, 0, 100, 0, 0]], outputs: ["Data", "Shapes", "Centres"] },
    { nick: "3 Levels & roof", inputs: [["Data", O], ["FF", F, 0, 3, FF, 2], ["Storey", F, 2, 4, L2 - FF, 2], ["RidgeH", F, 3, 10, RIDGE - FF, 2], ["RoofT", F, 0.05, 0.6, ROOF_T, 2], ["EaveSlope", F, 0, 3, 1.2, 2], ["GableEave", F, 0, 3, GABLE_EAVE, 2], ["Slab", F, 0.05, 0.5, SLAB, 2]], outputs: ["Data", "Site", "Base", "SlabBrep", "Roof", "Levels"] },
    { nick: "4 Curved walls", inputs: [["Data", O], ["OffL", F, 0, 1.5, S.offL, 2], ["OffR", F, 0, 1.5, S.offR, 2]], outputs: ["Data", "CurvedWalls", "Bases", "Tops"] },
    { nick: "5 Windows", inputs: [["Data", O], ["WidthPct", F, 20, 90, S.winW * 100, 0], ["Height", F, 0.3, 2.2, S.winH, 2], ["Sill", F, 0, 1.8, S.winSill, 2], ["UsePage", I, 0, 1, 1, 0], ["Show", I, 0, 1, S.win ? 1 : 0, 0]], outputs: ["Data", "Panes", "Frames", "WindowIDs"] },
    { nick: "6 Walls", inputs: [["Data", O], ["ShowExt", I, 0, 1, 1, 0], ["ShowInt", I, 0, 1, 1, 0], ["Thickness", F, 0.05, 0.4, GF_T, 2]], outputs: ["Envelope", "ExtWalls", "IntWalls", "ExtNames", "IntIDs", "White"] },
  ];
  const COLOURS = [0x50b4c8d2, 0x50c8d2b4, 0x50d2c3b4, 0x50d2b4b4, 0x50b4b4d2, 0x50c3c3c3]; // translucent tints, ARGB
  const comps = [], sliders = [], groups = [];
  let prevData = null;
  spec.forEach((sp, k) => {
    const x = 60 + k * 470, y = 80;
    const cp = { id: newGuid(), nick: sp.nick, code: codes[k], x: x + 230, y, inputs: [], outputs: sp.outputs, outIds: [newGuid(), ...sp.outputs.map(() => newGuid())] };
    const members = [cp.id];
    let sy = y;
    sp.inputs.forEach(([name, hint, min, max, value, digits]) => {
      const ip = { name, hint, id: newGuid() };
      if (name === "Data") ip.src = prevData;
      else {
        const sl = { id: newGuid(), nick: name, x, y: sy, min, max, value: Math.min(max, Math.max(min, value)), digits, int: hint === I };
        sy += 26; sliders.push(sl); members.push(sl.id); ip.src = sl.id;
      }
      cp.inputs.push(ip);
    });
    const di = sp.outputs.indexOf("Data");
    if (di >= 0) prevData = cp.outIds[di + 1];
    comps.push(cp);
    groups.push({ id: newGuid(), nick: sp.nick, colour: COLOURS[k], members });
  });
  return deflateRaw(ghBytes(ghArchive(comps, sliders, groups)));
}

function toast(m) { $("toast").textContent = m; }
let downloads = null;
(async () => {
  try { downloads = await window.claude?.use?.("downloads"); } catch (e) { downloads = null; }
})();
async function save(filename, data) {
  if (!downloads) {
    // a plain page (not inside Claude): an ordinary browser download
    const name = filename;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: typeof data === "string" ? "text/plain" : "application/octet-stream" }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast("Saved " + name);
    return;
  }
  try { await downloads.save({ filename, data }); toast("Saved " + filename); }
  catch (e) { toast(e.code === "declined" ? "Save cancelled." : "Could not save: " + (e.message || e.code)); }
}
// Claude's viewer saves only some file types: there the .dae travels in a .zip
$("saveSkp").addEventListener("click", () => downloads
  ? save("h60-sketchup.zip", zipFiles([{ name: "h60.dae", data: daeFile() }]))
  : save("h60.dae", daeFile()));
$("save3dm").addEventListener("click", () => save("h60-rhino.zip", zipFiles(objFiles())));
$("saveGh").addEventListener("click", async () => {
  try {
    const gh = await ghFile();
    if (downloads) save("h60-grasshopper.zip", zipFiles([{ name: "h60.gh", data: gh }, { name: "README.txt", data: GH_README }]));
    else save("h60.gh", gh);
  } catch (e) { toast("Could not build the Grasshopper file: " + e.message); }
});

PIECES = findPieces();
S.n = +$("n").value; S.op = +$("op").value / 100; S.env = +$("env").value / 100; S.offL = +$("offL").value; S.offR = +$("offR").value;
S.winW = +$("winW").value / 100; S.winH = +$("winH").value; S.winSill = +$("winSill").value;
camFrom = { dir: TOP.dir.clone(), up: TOP.up.clone(), zoom: 1, target: new THREE.Vector3() }; camK = 1;
controlMode();
ui(); resize(); loop();
</script>
