<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H60</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
/* one light look, after works/snowdon-aviary-tensegrity.html — compact: the model gets the room */
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  font-family: Helvetica, sans-serif;
  background: #f4f4f4; color: #111;
  padding: 8px 14px; box-sizing: border-box;
  display: flex; flex-direction: column;
}
.bar {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding-bottom: 4px; margin-bottom: 6px; border-bottom: 1px solid #111; flex-shrink: 0;
}
.bar h1 { margin: 0; font-size: 12px; font-weight: bold; letter-spacing: .8px; text-transform: uppercase; }
.bar span { font-size: 9px; letter-spacing: .8px; text-transform: uppercase; color: #999; }

.canvas-container { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
#canvas-inner {
  flex: 1 1 auto; min-height: 200px; background: #fdfdfd;
  border: 1px solid #eaeaea; position: relative; touch-action: none;
  outline: none; overflow: hidden; cursor: move;
}
#canvas-inner.handle { cursor: grab; }
#canvas-inner canvas { display: block; position: absolute; left: 0; top: 0; }
#labels { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
.tag { position: absolute; font-size: 9px; transform: translate(-50%, -50%); white-space: nowrap; color: #666; font-variant-numeric: tabular-nums; }
.tag.lvl { transform: translate(-100%, -50%); margin-left: -6px; color: #333; }
.tag.lvr { transform: translate(0, -50%); margin-left: 6px; color: #333; }
.tag.wid { color: #2f5fb3; font-size: 8px; }
.view-btns { position: absolute; top: 6px; right: 6px; z-index: 20; display: flex; gap: 3px; }
.view-btns .sep { width: 5px; }
#status-text { font-size: 9px; text-align: center; margin: 4px 0 0; flex-shrink: 0; letter-spacing: .3px; color: #888; line-height: 1.35; }

.controls-container {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0;
  margin-top: 6px; padding-top: 6px; border-top: 1px dashed #aaa;
  font-size: 9px; line-height: 1.3; flex-shrink: 0;
}
.column { padding: 0 12px; border-left: 1px solid #ddd; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.column:first-child { border-left: none; padding-left: 0; }
.column h3 { margin: 2px 0 1px; font-size: 8px; font-weight: bold; text-transform: uppercase; letter-spacing: .6px; color: #999; }
.control-row { display: grid; grid-template-columns: minmax(0, 1fr) 42% 38px; align-items: center; gap: 6px; }
.control-row label { color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.control-row label.dim { color: #aaa; }
.val { color: #555; text-align: right; font-variant-numeric: tabular-nums; }
.note { color: #777; font-size: 9px; margin: 0; line-height: 1.3; }
input[type="range"] { width: 100%; -webkit-appearance: none; appearance: none; background: transparent; margin: 3px 0; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 8px; width: 8px; border-radius: 50%; background: #111; cursor: pointer; margin-top: -3px; }
input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 2px; cursor: pointer; background: #ccc; }
input[type="range"]::-moz-range-thumb { height: 8px; width: 8px; border-radius: 50%; background: #111; border: 0; }
input[type="range"]::-moz-range-track { height: 2px; background: #ccc; }
input[type="range"]:disabled::-webkit-slider-thumb { background: #bbb; }
input[type="range"]:focus-visible { outline: 1px dashed #111; outline-offset: 2px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 3px; }
button.toggle-btn {
  border: 1px solid #bbb; background: #fff; color: #333; padding: 2px 6px;
  font: bold 8px Helvetica, sans-serif; line-height: 1.5;
  text-transform: uppercase; letter-spacing: .4px; cursor: pointer; transition: all .15s ease; flex: 1 0 auto;
}
.view-btns button.toggle-btn { flex: none; }
button.toggle-btn:hover { background: #eee; }
button.toggle-btn.active { background: #111; border-color: #111; color: #fff; }
button.toggle-btn:disabled { opacity: .35; cursor: default; background: #fff; }
button.toggle-btn:focus-visible { outline: 1px dashed #111; outline-offset: 2px; }
#pieceInfo, #winInfo { color: #333; font-variant-numeric: tabular-nums; }
#toast { color: #d32f2f; min-height: 1.2em; }
.num-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.num-row label { display: flex; flex-direction: column; gap: 1px; color: #777; font-size: 8px; }
.num-row input { width: 100%; box-sizing: border-box; font: 9px Helvetica, sans-serif; padding: 1px 3px; border: 1px solid #bbb; background: #fff; font-variant-numeric: tabular-nums; }
.num-row input:focus-visible { outline: 1px dashed #111; outline-offset: 1px; }

@media (max-width: 900px) { .controls-container { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 8px; } .column:nth-child(3) { border-left: none; padding-left: 0; } }
@media (max-width: 560px) {
  html, body { overflow: auto; height: auto; }
  .canvas-container { flex: none; height: 65vh; }
  .controls-container { grid-template-columns: 1fr; }
  .column { border-left: none; padding: 6px 0 0; border-top: 1px solid #ddd; }
}
</style>
</head>
<body>

<div class="bar">
  <h1><a href="../index.html" style="color:inherit;text-decoration:none">&larr; Index</a> &nbsp;·&nbsp; H60</h1>
  <span>Drawing1.dxf · house 7.50 × 21.00 m · plan → superellipse → storey</span>
</div>

<div class="canvas-container">
  <div id="canvas-inner" tabindex="0" aria-label="Model">
    <div class="view-btns">
      <button id="eS" class="toggle-btn" title="South elevation (y = 0)">S</button>
      <button id="eN" class="toggle-btn" title="North elevation (y = 21)">N</button>
      <button id="eW" class="toggle-btn" title="West elevation (x = 0)">W</button>
      <button id="eE" class="toggle-btn" title="East elevation (x = 7.5)">E</button>
      <span class="sep"></span>
      <button id="vBelow" class="toggle-btn" aria-pressed="false" title="Let the view orbit below the ground">Below ground</button>
      <button id="vReset" class="toggle-btn">Reset view</button>
    </div>
    <div id="labels"></div>
  </div>
  <div id="status-text"></div>
</div>

<div class="controls-container">
  <div class="column">
    <h3>Steps</h3>
    <div class="btn-row">
      <button id="st0" class="toggle-btn">1 Plan</button>
      <button id="st1" class="toggle-btn">2 Flexible</button>
      <button id="st2" class="toggle-btn">3 Storey</button>
    </div>
    <h3>Display</h3>
    <div class="btn-row">
      <button id="mWire" class="toggle-btn">Wireframe</button>
      <button id="mSolid" class="toggle-btn">Solid</button>
      <button id="mIds" class="toggle-btn active" aria-pressed="true" title="Wall IDs and level labels">Wall IDs</button>
      <button id="mGfE" class="toggle-btn" aria-pressed="false" title="Ground-floor outside walls, 10 cm, on the plan lines">Ext walls</button>
      <button id="mGfI" class="toggle-btn" aria-pressed="false" title="Ground-floor inside walls, 10 cm, on the plan lines">Int walls</button>
      <button id="mWin" class="toggle-btn active" aria-pressed="true">Windows</button>
    </div>

    <div class="btn-row">

      <button id="reset" class="toggle-btn">Reset</button>
    </div>
  </div>

  <div class="column">
    <h3>Superellipse &amp; roof</h3>
    <div class="control-row"><label for="n">Squareness n</label><input type="range" id="n" min="2" max="10" step="0.1" value="4"><span id="o-n" class="val"></span></div>
    <div class="control-row"><label for="offL">Roof offset left</label><input type="range" id="offL" min="0" max="1.5" step="0.05" value="0"><span id="o-offL" class="val"></span></div>
    <div class="control-row"><label for="offR">Roof offset right</label><input type="range" id="offR" min="0" max="1.5" step="0.05" value="0"><span id="o-offR" class="val"></span></div>
    <div class="control-row"><label for="op" id="l-op">Curved wall opacity</label><input type="range" id="op" min="0" max="100" step="1" value="100"><span id="o-op" class="val"></span></div>
    <div class="control-row"><label for="env">Envelope opacity</label><input type="range" id="env" min="0" max="100" step="1" value="35"><span id="o-env" class="val"></span></div>
  </div>

  <div class="column">
    <h3>Windows · ground floor</h3>
    <div class="control-row"><label for="winW">Width, share of wall</label><input type="range" id="winW" min="20" max="90" step="1" value="50"><span id="o-winW" class="val"></span></div>
    <div class="control-row"><label for="winH">Height</label><input type="range" id="winH" min="0.3" max="2.2" step="0.05" value="1.2"><span id="o-winH" class="val"></span></div>
    <div class="control-row"><label for="winSill">Sill above floor</label><input type="range" id="winSill" min="0" max="1.8" step="0.05" value="0.9"><span id="o-winSill" class="val"></span></div>
    <div class="btn-row">
      <button id="wDel" class="toggle-btn" disabled title="Delete the selected window (or press Delete)">Delete selected</button>
    </div>
    <p class="note" id="winHint">Click a window in 3D or in an elevation to select it.</p>
    <div id="winBox" hidden>
      <h3>Selected window</h3>
      <div id="winInfo"></div>
      <div class="num-row">
        <label>From corner<input id="wA" type="number" step="0.05" min="0"></label>
        <label>Width<input id="wW" type="number" step="0.05" min="0.2"></label>
        <label>Sill<input id="wS" type="number" step="0.05" min="0"></label>
        <label>Height<input id="wH" type="number" step="0.05" min="0.2"></label>
      </div>
    </div>
  </div>

  <div class="column">
    <div id="selBox" hidden>
      <h3>Selected piece</h3>
      <div id="pieceInfo"></div>
      <div class="btn-row" style="margin-top:3px"><button id="bCentre" class="toggle-btn">Centre in room</button></div>
    </div>
    <h3>Export 3D model · by layer</h3>
    <div class="btn-row">
      <button id="saveSkp" class="toggle-btn" title="Collada .dae, one group per layer — File › Import in SketchUp">SketchUp</button>
      <button id="save3dm" class="toggle-btn" title="OBJ + MTL in a .zip, OBJ groups = layers — Import in Rhino">Rhino</button>
    </div>
    <p class="note" id="toast" role="status"></p>
  </div>
</div>

<script>
/* From the plan of Drawing1.dxf:
   1  Plan: every room is a rectangle (the L room is cut into two at x = 6.00);
      a circle sits at its centre, as large as the room allows 10 cm clear of
      the plan lines
   2  Flexible: the circle grows into a superellipse held by the room frame and
      its centre — four half-axes, the distances from the centre to the frame's
      sides less 10 cm. Centres move inside their rooms, snap, or are randomised
   Walls: every stretch of plan line between two junctions is a wall, E01…
      outside and I01… inside, numbered bottom to top, left to right.
   Windows (ground floor only): one per outside wall, centred, by rule; each can
      then be moved, resized, deleted or added in the four elevations.
   3  Storey: the ground is ±0.00; the ground floor is a thin slab at +1.00 on
      a solid base the size of the house, with the plan on it; the superellipses are the second floor,
      base +3.40, walls rising to an offset (measured normal to the roof) under
      a gable roof — ridge +7.00 on the house's centre line, down to +3.40 at its
      long walls. The roof is 0.30 m thick, built up from that surface, with
      eaves 1.20 m out along the slope at the sides and 1.00 m at the gable
      ends, cut square to the slope. The envelope is white walls and a flat
      clay-tile roof, see-through by a slider */

// house, local origin at the lower-left corner of the plan in Drawing1.dxf (metres, y up)
const ORIGIN = [2750.541365912678, 1907.039885595487];
const W = 7.5, D = 21.0, GAP = 0.10, KEEP = 0.15, SNAP_PX = 9;
// ground ±0.00; ground floor +1.00 on columns; second floor 2.40 above it
const FF = 1.00, L2 = FF + 2.40, RIDGE = FF + 6.00, RX = W / 2, SLAB = 0.15;
const ROOF_T = 0.30, GABLE_EAVE = 1.00;
const SLOPE = (RIDGE - L2) / RX, COS = 1 / Math.hypot(1, SLOPE);
const roof = x => RIDGE - SLOPE * Math.abs(x - RX);   // also past the walls, for the eaves
const EAVE = 1.20 * COS;                               // 1.20 m along the slope
const Z_EAVE = roof(-EAVE);
const fmtZ = z => (Math.abs(z) < 0.005 ? "±" : "+") + z.toFixed(2);
// the roof as a solid: per side a section (eave underside, ridge underside,
// ridge top, eave top), the top offset 0.30 m along the roof's normal, run from
// one gable eave to the other. Faces and edges in site coordinates
function roofSolid() {
  const Y0 = -GABLE_EAVE, Y1 = D + GABLE_EAVE, dz = ROOF_T * COS, dx = ROOF_T * SLOPE * COS;
  const faces = [], edges = [];
  for (const side of [-1, 1]) {
    const xe = side < 0 ? -EAVE : W + EAVE;
    const sec = [{ x: xe, z: Z_EAVE }, { x: RX, z: RIDGE }, { x: RX, z: RIDGE + ROOF_T / COS }, { x: xe + side * dx, z: Z_EAVE + dz }];
    const at = (q, y) => ({ x: q.x, y, z: q.z });
    for (let i = 0; i < 4; i++) {
      const a = sec[i], b = sec[(i + 1) % 4];
      if (i !== 1) faces.push([at(a, Y0), at(b, Y0), at(b, Y1), at(a, Y1)]); // the ridge joint is inside
      edges.push([at(a, Y0), at(b, Y0)], [at(a, Y1), at(b, Y1)], [at(a, Y0), at(a, Y1)]);
    }
    faces.push(sec.map(q => at(q, Y0)), sec.map(q => at(q, Y1)));
  }
  return { faces, edges };
}
// the site: the outer LWPOLYLINE of Drawing1.dxf (12:47)
const SITE = [[-18.2198, 23.494], [-17.8638, -4.5594], [9.6311, -4.5594], [9.49, 22.9187]].map(([x, y]) => ({ x, y }));
// every LINE and LWPOLYLINE edge of the house plan, local metres
const PLAN = [
 [[7.5,0.0404],[7.5,0]],[[0,14.25],[3.5503,14.25]],[[7.5,0],[4.7429,0]],[[6,8.9147],[0,8.9147]],
 [[4.7429,0],[4.65,0]],[[4.65,0],[4.5571,0]],[[4.5571,0],[0,0]],[[0,21],[0,0]],[[7.5,0.0404],[7.5,8.9147]],
 [[6,10.6153],[0,10.6153]],
 [[3.5503,12.9933],[6,12.9933],[6,16.0939],[3.5503,16.0939],[3.5503,12.9933]],
 [[6,11.5012],[7.5,11.5012],[7.5,8.9147],[6,8.9147],[6,11.5012]],
 [[2.7959,0],[0,0],[0,5.25],[2.7959,5.25],[2.7959,0]],
 [[4.7752,18.0939],[7.5,18.0939],[7.5,21],[4.7752,21],[4.7752,18.0939]],
 [[4.7752,18.0939],[4.7752,16.0939]],[[4.7752,17.0939],[0,17.0939]],[[4.7752,12.9933],[4.7752,10.6153]],
 [[0,21],[4.7752,21]],[[7.5,18.0939],[7.5,11.5012]],[[2.7959,5.25],[2.7959,8.9147]],[[2.7959,5.25],[7.5,5.25]],
 [[6,16.0939],[7.5,16.0939]],[[3.5503,16.0939],[3.5503,17.0939]],[[3.5503,12.9933],[3.5503,10.6153]],
 [[3.5503,10.6153],[3.5503,8.9147]],
].map(l => l.map(([x, y]) => ({ x, y })));

const $ = id => document.getElementById(id);
const S = { t: 1, target: 1, n: 4, op: 1, env: 0.18, offL: 0, offR: 0, solid: false, below: false, ids: true, gfE: false, gfI: false, win: true, elev: null, winSel: null, winW: 0.5, winH: 1.2, winSill: 0.9, sel: null, dirty: true };
let PIECES = [], UNDO = null;

const clamp01 = v => Math.max(0, Math.min(1, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const ease = q => q < 0.5 ? 2 * q * q : 1 - (-2 * q + 2) ** 2 / 2;

/* ---------------- rooms of the plan, as rectangles ---------------- */
// the plan is orthogonal: cut the site at every x and y the lines use, join
// neighbouring grid cells no line separates, then cut a room that is not a
// rectangle into column rectangles (the L room splits along x = 6.00)
function findPieces() {
  const segs = [];
  PLAN.forEach(l => { for (let k = 0; k + 1 < l.length; k++) segs.push([l[k], l[k + 1]]); });
  const r4 = v => Math.round(v * 1e4) / 1e4;
  const xs = [...new Set(segs.flatMap(s => s.map(p => r4(p.x))))].sort((a, b) => a - b);
  const ys = [...new Set(segs.flatMap(s => s.map(p => r4(p.y))))].sort((a, b) => a - b);
  const e = 1e-3;
  const wallV = (x, y0, y1) => segs.some(([a, b]) => Math.abs(a.x - x) < e && Math.abs(b.x - x) < e && Math.min(a.y, b.y) <= y0 + e && Math.max(a.y, b.y) >= y1 - e);
  const wallH = (y, x0, x1) => segs.some(([a, b]) => Math.abs(a.y - y) < e && Math.abs(b.y - y) < e && Math.min(a.x, b.x) <= x0 + e && Math.max(a.x, b.x) >= x1 - e);
  const nx = xs.length - 1, ny = ys.length - 1, seen = new Set(), key = (i, j) => i * 1000 + j;
  const pieces = [];
  let room = 0;
  for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
    if (seen.has(key(i, j))) continue;
    room++;
    const cells = [], st = [[i, j]]; seen.add(key(i, j));
    while (st.length) {
      const [a, b] = st.pop(); cells.push([a, b]);
      const nb = [];
      if (a > 0 && !wallV(xs[a], ys[b], ys[b + 1])) nb.push([a - 1, b]);
      if (a < nx - 1 && !wallV(xs[a + 1], ys[b], ys[b + 1])) nb.push([a + 1, b]);
      if (b > 0 && !wallH(ys[b], xs[a], xs[a + 1])) nb.push([a, b - 1]);
      if (b < ny - 1 && !wallH(ys[b + 1], xs[a], xs[a + 1])) nb.push([a, b + 1]);
      for (const q of nb) if (!seen.has(key(...q))) { seen.add(key(...q)); st.push(q); }
    }
    const cols = new Map();
    for (const [a, b] of cells) {
      const c = cols.get(a) || { a, y0: Infinity, y1: -Infinity };
      c.y0 = Math.min(c.y0, ys[b]); c.y1 = Math.max(c.y1, ys[b + 1]);
      cols.set(a, c);
    }
    const rects = [];
    for (const c of [...cols.values()].sort((p, q) => p.a - q.a)) {
      const last = rects[rects.length - 1];
      if (last && last.a1 === c.a && Math.abs(last.y0 - c.y0) < e && Math.abs(last.y1 - c.y1) < e) { last.x1 = xs[c.a + 1]; last.a1 = c.a + 1; }
      else rects.push({ x0: xs[c.a], x1: xs[c.a + 1], y0: c.y0, y1: c.y1, a1: c.a + 1 });
    }
    rects.forEach(r => pieces.push({ room, x0: r.x0, x1: r.x1, y0: r.y0, y1: r.y1, split: rects.length > 1 }));
  }
  pieces.sort((p, q) => ((p.y0 + p.y1) - (q.y0 + q.y1)) || ((p.x0 + p.x1) - (q.x0 + q.x1)));
  pieces.forEach((p, k) => { p.no = k + 1; p.cx = (p.x0 + p.x1) / 2; p.cy = (p.y0 + p.y1) / 2; });
  return pieces;
}


/* ---------------- shapes ---------------- */
function axes(p) { return { l: p.cx - p.x0 - GAP, r: p.x1 - p.cx - GAP, d: p.cy - p.y0 - GAP, u: p.y1 - p.cy - GAP }; }
const circleR = p => { const a = axes(p); return Math.max(0, Math.min(a.l, a.r, a.d, a.u)); };
// superellipse with a different half-axis on each side; k blends from the
// circle (0) to the full shape (1). N a multiple of 4 keeps the extremes as samples
function shapePts(p, k, n, N) {
  const a = axes(p), r0 = circleR(p), ex = lerp(2, n, k);
  const L = lerp(r0, a.l, k), R = lerp(r0, a.r, k), Dn = lerp(r0, a.d, k), U = lerp(r0, a.u, k);
  const pts = [];
  for (let i = 0; i < N; i++) {
    const th = i / N * Math.PI * 2, c = Math.cos(th), s = Math.sin(th);
    pts.push({ x: p.cx + Math.sign(c) * Math.abs(c) ** (2 / ex) * (c >= 0 ? R : L), y: p.cy + Math.sign(s) * Math.abs(s) ** (2 / ex) * (s >= 0 ? U : Dn) });
  }
  return pts;
}
// top of the curved walls: each roof plane moved in by its side's offset along
// its normal (a vertical drop of offset / cos), never below the storey base.
// With unequal offsets the two planes meet off the ridge line
const DL = () => S.offL / COS, DR = () => S.offR / COS;
const wallTop = x => Math.max(L2, Math.min(RIDGE - SLOPE * (RX - x) - DL(), RIDGE - SLOPE * (x - RX) - DR()));
// x where the top surface creases: where the two planes meet, and where each meets +3.40
function breaks() {
  const xc = RX + (DL() - DR()) / (2 * SLOPE);
  const xl = RX - (RIDGE - L2 - DL()) / SLOPE, xr = RX + (RIDGE - L2 - DR()) / SLOPE;
  const b = [xc];
  if (xl < xc - 1e-9) b.push(xl);
  if (xr > xc + 1e-9) b.push(xr);
  return b.sort((u, v) => u - v);
}
// the ring with points added on every crease, so the wall top follows it exactly
function ringPts(p, k, n, N) {
